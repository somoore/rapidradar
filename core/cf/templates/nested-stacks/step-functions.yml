Resources:
  SSOUserReportGeneratorSfnRole:
    Condition: DeployUserOffboardingWorkflowProject
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-sso-user-resources-report-generator-sfn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - states.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: LambdaInvocationPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: InvokeLambda
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - !Sub "${GetSSOUserDetailsLambdaARN}:*"
            - !Ref GetSSOUserDetailsLambdaARN
            - !Sub "${SSOUserReportGeneratorLambdaARN}:*"
            - !Ref SSOUserReportGeneratorLambdaARN
            - !Sub "${SSOUserReportWaiterLambdaARN}:*"
            - !Ref SSOUserReportWaiterLambdaARN
            - !Sub "${SSOUserReportsCompilerLambdaARN}:*"
            - !Ref SSOUserReportsCompilerLambdaARN
      - PolicyName: LogsPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: CreateLogs
            Effect: Allow
            Action:
            - logs:CreateLogDelivery
            - logs:GetLogDelivery
            - logs:UpdateLogDelivery
            - logs:ListLogDeliveries
            - logs:PutResourcePolicy
            - logs:DescribeResourcePolicies
            - logs:DescribeLogGroups
            Resource: "*"

  SSOUserReportGeneratorSfnLogGroup:
    Condition: DeployUserOffboardingWorkflowProject
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/stepfunction/${ProjectName}-sso-user-resources-report-generator"
      RetentionInDays: 14

  SSOUserReportGeneratorSfn:
    Condition: DeployUserOffboardingWorkflowProject
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-sso-user-resources-report-generator
      RoleArn: !GetAtt SSOUserReportGeneratorSfnRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
             LogGroupArn: !GetAtt SSOUserReportGeneratorSfnLogGroup.Arn
      DefinitionString: !Sub |-
          {
            "Comment": "Resources Report Generator for Disabled/Deleted SSO User",
            "StartAt": "GetOrgDetails",
            "States": {
              "GetOrgDetails": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "OutputPath": "$.Payload",
                "Parameters": {
                  "Payload.$": "$",
                  "FunctionName": "${GetSSOUserDetailsLambdaARN}:$LATEST"
                },
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 6,
                    "BackoffRate": 2
                  }
                ],
                "Next": "GenerateUserResourcesReport"
              },
              "GenerateUserResourcesReport": {
                "Type": "Map",
                "ItemProcessor": {
                  "ProcessorConfig": {
                    "Mode": "DISTRIBUTED",
                    "ExecutionType": "STANDARD"
                  },
                  "StartAt": "Generate Report",
                  "States": {
                    "Generate Report": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${SSOUserReportGeneratorLambdaARN}:$LATEST"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "IntervalSeconds": 10,
                          "MaxAttempts": 15,
                          "BackoffRate": 2
                        }
                      ],
                      "Next": "Waiter"
                    },
                    "Waiter": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${SSOUserReportWaiterLambdaARN}:$LATEST"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 2,
                          "MaxAttempts": 6,
                          "BackoffRate": 2
                        }
                      ],
                      "Next": "Pass"
                    },
                    "Pass": {
                      "Type": "Pass",
                      "Next": "Choice"
                    },
                    "Choice": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.jobCompleted",
                          "BooleanEquals": false,
                          "Next": "Wait"
                        }
                      ],
                      "Default": "End"
                    },
                    "Wait": {
                      "Type": "Wait",
                      "Seconds": 180,
                      "Next": "Waiter"
                    },
                    "End": {
                      "Type": "Pass",
                      "End": true
                    }
                  }
                },
                "Next": "HandleReports",
                "MaxConcurrency": 10,
                "ItemsPath": "$.orgAccountRegion"
              },
              "HandleReports": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "OutputPath": "$.Payload",
                "Parameters": {
                  "Payload.$": "$",
                  "FunctionName": "${SSOUserReportsCompilerLambdaARN}:$LATEST"
                },
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 6,
                    "BackoffRate": 2
                  }
                ],
                "End": true
              }
            }
          }

  FetchStoreSSOUsersIpDataSfnRole:
    Condition: DeployIPTrackerProject
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-fetch-and-store-sso-users-aws-ip-data
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - states.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: CloudWatchLogsPolicy
        PolicyDocument:
