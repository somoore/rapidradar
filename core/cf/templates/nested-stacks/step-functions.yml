  FetchStoreSSOUsersIpDataSfnLogGroup:
    Condition: DeployIPTrackerProject
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/stepfunction/${ProjectName}-fetch-and-store-sso-users-aws-ip-data"
      RetentionInDays: 14

  FetchAndStoreSSOUsersAWSIpDataSfn:
    Condition: DeployIPTrackerProject
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-fetch-and-store-sso-users-aws-ip-data
      RoleArn: !GetAtt FetchStoreSSOUsersIpDataSfnRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
             LogGroupArn: !GetAtt FetchStoreSSOUsersIpDataSfnLogGroup.Arn
      DefinitionString: !Sub |-
        {
          "Comment": "Fetches AWS Source IP address for all SSO Users from last 24 hours activity",
          "StartAt": "Wait for Creation of Child StackSets",
          "States": {
            "Wait for Creation of Child StackSets": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "Payload.$": "$",
                "FunctionName": "${StackSetCreationWaiterLambdaARN}:$LATEST"
              },
              "Next": "Choice"
            },
            "Choice": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.WaitTime",
                  "NumericEquals": 0,
                  "Next": "Parallel"
                }
              ],
              "Default": "Wait"
            },
            "Wait": {
              "Type": "Wait",
              "SecondsPath": "$.WaitTime",
              "Next": "Wait for Creation of Child StackSets"
            },
            "Parallel": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "Get SSO Users",
                  "States": {
                    "Get SSO Users": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${GetSSOUsersLambdaARN}:$LATEST"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "Get Active AWS Accounts",
                  "States": {
                    "Get Active AWS Accounts": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${GetChildDeploymentAccountsLambdaARN}:$LATEST"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "Get Active Regions",
                  "States": {
                    "Get Active Regions": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${GetDeploymentRegionsLambdaARN}:$LATEST"
                      },
                      "End": true
                    }
                  }
                }
              ],
              "Next": "Fetch for each user"
            },
            "Fetch for each user": {
              "Type": "Map",
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "STANDARD"
                },
                "StartAt": "ManipulateInput-Accounts",
                "States": {
                  "ManipulateInput-Accounts": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "Payload.$": "$",
                      "FunctionName": "${ManipulateInputsAccountsLambdaARN}:$LATEST"
                    },
                    "Next": "Check each account"
                  },
                  "Check each account": {
                    "Type": "Map",
                    "ItemProcessor": {
                      "ProcessorConfig": {
                        "Mode": "INLINE"
                      },
                      "StartAt": "ManipulateInput-Regions",
                      "States": {
                        "ManipulateInput-Regions": {
                          "Type": "Task",
                          "Resource": "arn:aws:states:::lambda:invoke",
                          "OutputPath": "$.Payload",
                          "Parameters": {
                            "Payload.$": "$",
                            "FunctionName": "${ManipulateInputsRegionsLambdaARN}:$LATEST"
                          },
                          "Next": "Check each region"
                        },
                        "Check each region": {
                          "Type": "Map",
                          "ItemProcessor": {
                            "ProcessorConfig": {
                              "Mode": "INLINE"
                            },
                            "StartAt": "Fetch Latest Activity",
                            "States": {
                              "Fetch Latest Activity": {
                                "Type": "Task",
                                "Resource": "arn:aws:states:::lambda:invoke",
                                "OutputPath": "$.Payload",
                                "Parameters": {
                                  "Payload.$": "$",
                                  "FunctionName": "${GetSSOUsersLatestActivityLambdaARN}:$LATEST"
                                },
                                "End": true
                              }
                            }
                          },
                          "End": true
                        }
                      }
                    },
                    "Next": "Data Refiner"
                  },
                  "Data Refiner": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "OutputPath": "$.Payload",
                    "Parameters": {
                      "Payload.$": "$",
                      "FunctionName": "${SSOUsersDataRefinerLambdaARN}:$LATEST"
                    },
                    "Next": "Store Data"
                  },
                  "Store Data": {
                    "Type": "Parallel",
                    "End": true,
                    "Branches": [
                      {
                        "StartAt": "IP Correlation",
                        "States": {
                          "IP Correlation": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${SSOUsersDataStorerIpCorrelationLambdaARN}:$LATEST"
                            },
                            "End": true
                          }
                        }
                      },
                      {
                        "StartAt": "IP HIstory",
                        "States": {
                          "IP HIstory": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${SSOUsersDataStorerIpHistoryLambdaARN}:$LATEST"
                            },
                            "End": true
                          }
                        }
                      }
                    ]
                  }
                }
              },
              "End": true,
              "Label": "Fetchforeachuser",
              "MaxConcurrency": 2,
              "ItemReader": {
                "Resource": "arn:aws:states:::s3:getObject",
                "ReaderConfig": {
                  "InputType": "JSON"
                },
                "Parameters": {
                  "Bucket.$": "$[0].BucketName",
                  "Key.$": "$[0].BucketKey"
                }
              }
            }
          }
        }

