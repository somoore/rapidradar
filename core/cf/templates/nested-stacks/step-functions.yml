            "Choice": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.WaitTime",
                  "NumericEquals": 0,
                  "Next": "Success"
                }
              ],
              "Default": "Wait"
            },
            "Success": {
              "Type": "Succeed"
            },
            "Wait": {
              "Type": "Wait",
              "SecondsPath": "$.WaitTime",
              "Next": "Start Automation"
            }
          }
        }

