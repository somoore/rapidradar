              try:
                  while next_token is not None:
                      kwargs = base_kwargs.copy()
                      if next_token != '':
                          kwargs.update({'NextToken': next_token})
                      response = client.describe_instances(**kwargs)
                      for reservation in response['Reservations']:
                          for instance in reservation['Instances']:
                              tags = []
                              public_ip, lifecycle, platform = '', None, ''
                              if 'State' in instance and instance['State']['Name'] == 'terminated':
                                  continue
                              if 'Tags' in instance:
                                  tags = [ f"{tag['Key']}: {tag['Value']}" for tag in instance['Tags'] ]
                              if 'PublicIpAddress' in instance:
                                  public_ip = instance['PublicIpAddress']
                              if 'InstanceLifecycle' in instance:
                                  lifecycle = instance['InstanceLifecycle']
                              platform = instance['Platform'] if 'Platform' in instance else 'linux'
                              lifecycle = 'on-demand' if lifecycle is None else lifecycle
                              launch_time = instance['LaunchTime'].strftime("%Y-%m-%dT%H:%M:%SZ")
                              instance_details = {'InstanceId': instance['InstanceId'], 'InstanceType': instance['InstanceType'], 'State': instance['State']['Name'], 'LaunchedAt': launch_time, 'PublicIp': public_ip, 'CostType': lifecycle, 'Platform': platform, 'Tags': tags}
                              instance_details.update(payload)
                              active_instances.append(instance_details)
                      next_token = response['NextToken'] if 'NextToken' in response else None
              except Exception as error:
                  raise error
              return active_instances
          def assume_role(role_arn, region):
              sts = boto3.client('sts', region_name=region)
              response = sts.assume_role(RoleArn=role_arn, RoleSessionName=PROJECT_NAME)
              session = boto3.Session(aws_access_key_id=response['Credentials']['AccessKeyId'],
                              aws_secret_access_key=response['Credentials']['SecretAccessKey'],
                              aws_session_token=response['Credentials']['SessionToken'])
