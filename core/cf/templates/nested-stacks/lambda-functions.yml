            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
  SlackInteractivityLambda:
    Condition: EnableSlackInteractivity
    Type: AWS::Lambda::Function
    Properties:
      Description: Function that handles slack interactive responses
      FunctionName: !Sub "${ProjectName}-slack-interactivity-handler"
      Handler: main.lambda_handler
      Code: ../../deployment/lambdas/slack_interactivity/responses_handler/
      Runtime: python3.11
      Timeout: 5
      Role: !GetAtt SlackInteractivityLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:BOTO3_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          SLACK_BOT_CONFIG_SECRET_NAME: !Ref SlackBotConfigSecretName
          BACKGROUND_TASK_LAMBDA: !GetAtt SlackInteractivityBackgroundTaskRunner.Arn
  SignatureVerificationMetricFilter:
    Condition: EnableSlackInteractivity
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-slack-interactivity-handler"
      FilterPattern: '"Invalid Slack signature"'
      MetricTransformations:
        - MetricName: FailedSignatureVerifications
          MetricNamespace: !Ref ProjectName
          MetricValue: "1"
  FailedSignatureAlarm:
    Condition: EnableSlackInteractivity
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName} - Failed Slack Signature Verification"
      AlarmDescription: "Alarm triggered when one or more failed Slack signature verifications occur. This may indicate tampered or unauthorized requests. Check Lambda logs for details."
      MetricName: FailedSignatureVerifications
      Namespace: !Ref ProjectName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
      - !Ref CloudWatchAlarmsSnsTopic
  SlackInteractivityLambdaPermission:
    Condition: EnableSlackInteractivity
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SlackInteractivityLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
  SlackRequestVerifierLambdaRole:
    Condition: EnableSlackInteractivity
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  SlackRequestVerifierLambda:
    Condition: EnableSlackInteractivity
    Type: AWS::Lambda::Function
    Properties:
      Description: Function for verifying Slack requests
      FunctionName: !Sub "${ProjectName}-slack-request-verifier"
      Handler: main.lambda_handler
      Code: ../../deployment/lambdas/slack_interactivity/request_verifier/
      Runtime: python3.11
      Timeout: 5
      Role: !GetAtt SlackRequestVerifierLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:BOTO3_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
  SlackRequestVerifierLambdaPermission:
    Condition: EnableSlackInteractivity
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SlackRequestVerifierLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
