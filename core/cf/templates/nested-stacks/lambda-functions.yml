Resources:
  EventsProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-process-resource-events-lambda"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: AssumeRolePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: AssumeRole
            Effect: Allow
            Action:
            - sts:AssumeRole
            Resource: "*"
      - PolicyName: OrgReadPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: OrgAccess
            Effect: Allow
            Action:
            - organizations:DescribeAccount
            Resource: "*"
      - PolicyName: DynamoDBReadWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: DynamoDBAccess
            Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
            Resource:
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SecurityGroupTableName}*"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IAMUsersTableName}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${S3BucketsTableName}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RemediatedResourcesTableName}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RootIAMLoginsTableName}*"
            - !If [ IsEnabledStoppedEC2InstancesDetection, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UnusedEC2InstancesTableName}", !Ref AWS::NoValue ]
            - !If [ IsEnabledUnusedSecurityGroupsDetection, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UnusedSecurityGroupsTableName}", !Ref AWS::NoValue ]
            - !If [ IsEnabledUnusedEBSVolumesDetection, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UnusedEBSVolumesTableName}", !Ref AWS::NoValue ]
            - !If [ DeployCMDBProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ActiveResourcesTableName}*", !Ref AWS::NoValue ]
            - !If [ DeployCMDBProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DeletedResourcesTableName}", !Ref AWS::NoValue ]
            - !If [ DeployCMDBProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DailyUserCostReportsTableName}", !Ref AWS::NoValue ]
            - !If [ DeployCMDBProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WeeklyUserCostReportsTableName}", !Ref AWS::NoValue ]
            - !If [ DeployCMDBProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MonthlyUserCostReportsTableName}", !Ref AWS::NoValue ]
            - !If [ DeployIPTrackerProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SSOUserIPHistoryTableName}*", !Ref AWS::NoValue ]
            - !If [ DeployIPTrackerProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IPCorrelationTableName}*", !Ref AWS::NoValue ]
            - !If [ DeployIAMKeyPairAccessTrackerProject, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IAMKeyPairAccessTrackerTableName}*", !Ref AWS::NoValue ]
            - !If [ TrackSSMAssociationFailures, !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SSMDocumentAssociationFailureTrackerTableName}*", !Ref AWS::NoValue ]
      - PolicyName: EventsWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EventsRuleAccess
            Effect: Allow
            Action:
            - events:PutRule
            - events:PutTargets
            - events:RemoveTargets
            - events:DeleteRule
            Resource:
            - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/remediation-cron-*"
            - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/5-min-cron-*"
            - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/ten-min-cron-*"
      - PolicyName: SecretsReadPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SecretsAccess
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:PutSecretValue
            - secretsmanager:UpdateSecret
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
      - PolicyName: SSMReadWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SSMAccess
            Effect: Allow
            Action:
            - ssm:PutParameter
            - ssm:GetParameter
            - !If [ CreateSSMDocumentResources, ssm:ModifyDocumentPermission, !Ref AWS::NoValue ]
            Resource:
            - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*
            - !If [ CreateSSMDocumentResources, !Sub "arn:aws:ssm:*:${AWS::AccountId}:document/${ProjectName}-*", !Ref AWS::NoValue ]
      - PolicyName: IAMReadPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: IAMAccess
            Effect: Allow
            Action:
            - iam:ListRoles
            Resource: "*"
      - PolicyName: SESPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SESAccess
            Effect: Allow
            Action:
            - ses:SendRawEmail
            Resource: "*"
      - PolicyName: SQSPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SQSAccess
            Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource: "*"
      - Fn::If:
          - DeployIPTrackerProject
          - PolicyName: AllowStartExecution
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
              - Sid: ExecuteStepFunction
                Effect: Allow
                Action:
                - states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-fetch-and-store-sso-users-aws-ip-data"
          - !Ref AWS::NoValue

  EventsProcessorLambdaDLQ:
    Type: AWS::SQS::Queue
    Properties:
       QueueName: !Sub "${ProjectName}-aws-events-processor-lambda-dlq"
       VisibilityTimeout: 900

  EventsProcessorLambdaDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Id: default
        Statement:
          - Sid: SQSAccess
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: SQS:SendMessage
            Resource: !GetAtt EventsProcessorLambdaDLQ.Arn
      Queues:
        - !Ref EventsProcessorLambdaDLQ

  EventsProcessor:
    Type: AWS::Lambda::Function
    Properties:
      Description: Function that processes and manages incoming resource creation events.
      FunctionName: !Sub "${ProjectName}-aws-events-processor"
      Handler: main.lambda_handler
      Code: ../../deployment/lambdas/process_events/
      Runtime: python3.11
      DeadLetterConfig:
        TargetArn: !GetAtt EventsProcessorLambdaDLQ.Arn
      Timeout: 600
      MemorySize: 512
      Role: !GetAtt EventsProcessorLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:BOTO3_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:HTTPLIB2_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:PDPYRAS_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:PARLIAMENT_LAYER_ARN:AWSCURRENT}}'
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          AWS_ORG_NAME: !Ref AwsOrgName
          DEPLOYMENT_TARGETS: !Ref DeploymentTargets
          EXCLUDE_ACCOUNTS: !Ref ExcludeAccounts
          MANAGEMENT_ACCOUNT_ID: !Ref ManagementAccountId
          LOG_ARCHIVE_ACCOUNT_ID: !Ref LogArchiveAccountId
          HOME_REGION: !Ref HomeRegion
          ACTIVE_REGIONS: !Ref ActiveRegions
          CROSS_ACCOUNT_ROLE: !Ref CrossAccountRole
          SSO_CROSS_ACCOUNT_ROLE_ARN: !Sub "arn:aws:iam::${ManagementAccountId}:role/${ProjectName}-sso-cross-account-role"
          DEPLOYMENT_TARGET_ACCOUNTS: !Ref StoreDeploymentTargetAccountsNames
          LAMBDA_CONFIG_VARS_SECRET_NAME: !Ref EventsProcessorLambdaEnvVarsSecretName
          ENGINEER_FACING_NOTIFICATION_CONFIGS_SECRET_NAME: !Ref EngineerFacingNotificationsConfigsSecretName
          SLACK_BOT_CONFIG_SECRET_NAME: !Ref SlackBotConfigSecretName
  EventsProcessorLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsProcessor
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
  EventsProcessorLambdaSqsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsProcessor
      Action: lambda:InvokeFunction
      Principal: sqs.amazonaws.com
  DlqEventsProcessorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt EventsProcessorLambdaDLQ.Arn
      FunctionName: !Ref EventsProcessor
  CloudWatchAlarmsSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-cloudwatch-alarms
      DisplayName: !Sub ${ProjectName} lambda error alerts topic
  CloudWatchAlarmsSubscriptionsCreatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-cloudwatch-alarms-sns-subs-creator"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SnsReadWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SNSAccess
            Effect: Allow
            Action:
            - sns:ConfirmSubscription
            - sns:Subscribe
            - sns:Unsubscribe
            - sns:ListSubscriptionsByTopic
            Resource: !Ref CloudWatchAlarmsSnsTopic
  CloudWatchAlarmsSubscriptionsCreator:
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-cloudwatch-alarms-sns-subs-creator"
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt CloudWatchAlarmsSubscriptionsCreatorLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import copy
          import json
          import ast
          import requests
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              data = {}
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              if event_type in ['Create']:
                  method=getattr(client, 'subscribe')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  endpoints = kwargs['Endpoint'].replace(' ', '').split(',')
                  try:
                      for endpoint in endpoints:
                          kwargs['Endpoint'] = endpoint
                          data = method(**kwargs)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Update']:
                  subscribe_method=getattr(client, 'subscribe')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  kwargs['ReturnSubscriptionArn'] = True
                  try:
                      kwargs['ReturnSubscriptionArn'] = True
                      new_props_endpoints = kwargs['Endpoint'].replace(' ', '').split(',')
                      to_add = filter_subscriptions(client, kwargs['TopicArn'], new_props_endpoints)
                      if to_add:
                          print(f"Adding subscriptions for following email endpoints: {to_add}")
                          for endpoint in to_add:
                              kwargs['Endpoint'] = endpoint
                              data = subscribe_method(**kwargs)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def filter_subscriptions(client, topic_arn, new_emails):
              subscriptions_to_add = copy.copy(new_emails)
              next_token = ''
              base_kwargs = { 'TopicArn': topic_arn }
              try:
                  while next_token is not None:
                      kwargs = base_kwargs.copy()
                      if next_token != '':
                          kwargs.update({'NextToken': next_token})
                      response = client.list_subscriptions_by_topic(**kwargs)
                      for subscription in response['Subscriptions']:
                          if subscription['Protocol'] == 'email' and subscription['Endpoint'] in new_emails:
                              subscriptions_to_add.remove(subscription['Endpoint'])
                      next_token = response['NextToken'] if 'NextToken' in response else None
              except Exception as error:
                  print(f"{str(error)}")
              return subscriptions_to_add
  CreateCloudWatchAlarmsSubscriptions:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      Service: sns
      ServiceToken: !GetAtt CloudWatchAlarmsSubscriptionsCreator.Arn
      KwArgs:
        TopicArn: !Ref CloudWatchAlarmsSnsTopic
        Protocol: email
        Endpoint: !Ref ReceiverEmailAddressess
  EventsProcessorLambdaErrorCloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: True
      AlarmActions:
        - !Ref CloudWatchAlarmsSnsTopic
      AlarmDescription: !Sub "Alarm for ${EventsProcessor} Lambda Function errors"
      AlarmName: !Sub "${EventsProcessor}-errors"
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventsProcessor
      EvaluationPeriods: 2
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 0
  EventsProcessorLambdaTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EventsProcessor} - Lambda Timeout Alarm"
      AlarmDescription: !Sub "Alarm triggered when the maximum duration of Lambda Function ${EventsProcessor} exceeds 10 minutes. This may indicate timeouts or performance issues."
      MetricName: Duration
      Namespace: "AWS/Lambda"
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 600000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
      - Name: FunctionName
        Value: !Ref EventsProcessor
      AlarmActions:
      - !Ref CloudWatchAlarmsSnsTopic
  EventsProcessorLambdaColdStartAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EventsProcessor} - Lambda ColdStart Alarm"
      AlarmDescription: !Sub "Alarm triggered when the average cold start (InitDuration) of Lambda Function ${EventsProcessor} exceeds 1000 ms, indicating potential cold start issues. Investigate for performance improvements."
      MetricName: InitDuration
      Namespace: "AWS/Lambda"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
      - Name: FunctionName
        Value: !Ref EventsProcessor
      AlarmActions:
      - !Ref CloudWatchAlarmsSnsTopic
  EventsProcessorCrossAccountAccessDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EventsProcessor}"
      FilterPattern: '"Cross-account access denied"'
      MetricTransformations:
        - MetricName: !Sub "${EventsProcessor}-CrossAccountAccessDenied"
          MetricNamespace: !Ref ProjectName
          MetricValue: "1"
  EventsProcessorCrossAccountAccessDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EventsProcessor} - Cross-Account Access Denied Alarm"
      AlarmDescription: !Sub "Alarm triggered when a cross-account role assumption fails. This may indicate a misconfiguration or potential security issue with cross-account access in Lambda Function ${EventsProcessor}."
      MetricName: !Sub "${EventsProcessor}-CrossAccountAccessDenied"
      Namespace: !Ref ProjectName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
      - !Ref CloudWatchAlarmsSnsTopic

