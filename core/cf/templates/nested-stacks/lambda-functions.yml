  CreateEventBusRuleGuardDutyFindingsLambda:
    Condition: IsGuardDutyEnabled
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-create-guardduty-findings-event-rule"
      Timeout: 30
      Role: !GetAtt CreateEventBusRuleGuardDutyFindingsLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import json
          import ast
          import boto3
          import requests
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              kwargs = {}
              for key, value in props['KwArgs'].items():
                  try:
                      kwargs[key] = ast.literal_eval(value)
                  except Exception as e:
                      print(str(e))
                      kwargs[key] = value
              guardduty_security_levels = kwargs['EventPattern']['detail']['severity'] if isinstance(kwargs['EventPattern']['detail']['severity'], list) else kwargs['EventPattern']['detail']['severity'].replace(' ','').split(',')
              targets = []
              if 'Targets' in kwargs:
                  targets.extend(kwargs['Targets'])
                  del kwargs['Targets']
              event_rule_name = kwargs['Name']
              event_bus_name = kwargs['EventBusName']
              if event_type in ['Create', 'Update']:
                  severity_levels = []
                  method=getattr(client, 'put_rule')
                  try:
                      severity_levels.extend(get_severity_levels(guardduty_security_levels))
                      kwargs['EventPattern']['detail']['severity'] = severity_levels
                      kwargs['EventPattern'] = json.dumps(kwargs['EventPattern'])
                      print(f"...Creating EventBridge Rule for GuardDuty Findings with args: {kwargs}")
                      data = method(**kwargs)
                      print({"API_Call": "events:PutRule", "Response": data})
                      print(f"...Adding following target to EventBridge Rule named {event_rule_name} in EventBus {event_bus_name}: {targets}")
                      response = client.put_targets(
                          Rule=event_rule_name,
                          EventBusName=event_bus_name,
                          Targets=targets
                      )
                      print({"API_Call": "events:PutTargets", "Response": response})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_rule')
                  provider_event_rule = event['PhysicalResourceId'].split('|')[-1] if '|' in event['PhysicalResourceId'] else event['PhysicalResourceId']
                  try:
                      targets = get_event_rule_targets(client, event_bus_name, provider_event_rule)
                      if targets:
                          print(f"...Removing targets [ {(',').join(targets)} ] from EventBridge Rule named {provider_event_rule}")
                          response = client.remove_targets(
                              Rule=provider_event_rule,
                              EventBusName=event_bus_name,
                              Ids=targets
                          )
                          print({"API_Call": "events:DeleteTargets", "Response": response})
                      print(f"...Deleting EventBridge Rule named {provider_event_rule} from EventBus {event_bus_name}")
                      data = method(Name=provider_event_rule, EventBusName=event_bus_name)
                      print({"API_Call": "events:DeleteRule", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except client.exceptions.ResourceNotFoundException:
                      print("EventRule not found to delete. Skipping...")
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': f"{event_bus_name}|{event_rule_name}",
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def get_severity_levels(severities: list):
              severity_levels = []
              if 'ALL' in severities:
                  severity_levels.extend(get_numbers_within_range(10, 90))
              else:
                  if 'LOW' in severities:
                      severity_levels.extend(get_numbers_within_range(10, 40))
                  if 'MEDIUM' in severities:
                      severity_levels.extend(get_numbers_within_range(40, 70))
                  if 'HIGH' in severities:
                      severity_levels.extend(get_numbers_within_range(70, 90))
              return sorted(severity_levels)
          def get_numbers_within_range(min, max):
              numbers = []
              for x in range(min, max):
                  num = x / 10
                  if num.is_integer():
                      numbers.append(int(num))
                  numbers.append(num)
              return numbers
          def get_event_rule_targets(client, event_bus_name, rule_name):
              targets = []
              try:
                  response = client.list_targets_by_rule(Rule=rule_name, EventBusName=event_bus_name)
                  if 'Targets' in response:
                      for target in response['Targets']:
                          targets.append(target['Id'])
              except client.exceptions.ResourceNotFoundException:
                  print("EventRule not found to delete. Skipping...")
              except Exception as error:
                  print(str(error))
              return targets

