  StoreDeploymentTargetAccountsNamesLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      Timeout: 900
      FunctionName: !Sub "${ProjectName}-store-deployment-target-accounts-names"
      Role: !GetAtt StoreDeploymentTargetAccountsNamesLambdaRole.Arn
