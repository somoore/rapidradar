        Variables:
          PROJECT_NAME: !Ref ProjectName
          SSO_CROSS_ACCOUNT_ROLE_ARN: !Sub "arn:aws:iam::${ManagementAccountId}:role/${ProjectName}-sso-cross-account-role"
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import json
          import ast
          from os import getenv
          from time import sleep
          import requests
          import boto3
          PROJECT_NAME = getenv('PROJECT_NAME')
          SSO_CROSS_ACCOUNT_ROLE_ARN = getenv('SSO_CROSS_ACCOUNT_ROLE_ARN')
          MAX_RETRY_ATTEMPTS = 5
          DELAY_SECONDS = 3
          ORG_THROTTLE_PERIOD = 0.2
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              secret_name = None
              if event_type in ['Create']:
                  method=getattr(client, 'create_secret')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  active_session = __assume_role()
                  org_client = active_session.client("organizations")
                  if 'DeploymentTargets' in kwargs:
                      del kwargs['DeploymentTargets']
                  if 'ExcludeAccounts' in kwargs:
                      del kwargs['ExcludeAccounts']
                  secret_name = kwargs['Name']
                  accounts = get_active_accounts(org_client)
                  kwargs['SecretString'] = json.dumps(accounts)
                  try:
                      print(f"...Creating SecretsManager Secret named {kwargs['Name']} with args: {kwargs}")
                      data = method(**kwargs)
                      secret_name = data['Name']
                      print({"API_Call": "secretsmanager:CreateSecret", "API_Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except client.exceptions.ResourceExistsException:
                      print(f"Secret with name {kwargs['Name']} already exists. Updating its value...")
                      data = client.put_secret_value(
                          SecretId=kwargs['Name'],
                          SecretString=kwargs['SecretString']
                      )
                      secret_name = data['Name']
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Update']:
                  method=getattr(client, 'put_secret_value')
                  active_session = __assume_role()
                  org_client = active_session.client("organizations")
                  secret_name = event['PhysicalResourceId']
                  try:
                      data = client.put_secret_value(
                          SecretId=secret_name,
                          SecretString=json.dumps(get_active_accounts(org_client))
                      )
                      secret_name = data['Name']
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_secret')
                  secret_name = event['PhysicalResourceId']
                  try:
                      print(f"...Deleting SecretsManager Secret named {secret_name}")
                      data = method(SecretId=secret_name,ForceDeleteWithoutRecovery=True)
                      print({"API_Call": "secretsmanager:DeleteSecret", "API_Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': secret_name if secret_name is not None else event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def __assume_role():
              sts = boto3.client('sts')
              response = sts.assume_role(RoleArn=SSO_CROSS_ACCOUNT_ROLE_ARN, RoleSessionName=PROJECT_NAME)
              session = boto3.Session(aws_access_key_id=response['Credentials']['AccessKeyId'],
                  aws_secret_access_key=response['Credentials']['SecretAccessKey'],
                  aws_session_token=response['Credentials']['SessionToken'])
              return session
          def get_active_accounts(client):
              retry_attempts = 0
              delay = DELAY_SECONDS
              active_accounts_details = {}
              while retry_attempts < MAX_RETRY_ATTEMPTS:
                  try:
                      paginator = client.get_paginator('list_accounts')
                      for page in paginator.paginate():
                          for account in page['Accounts']:
                              if account['Status'] == 'ACTIVE':
                                  active_accounts_details[account['Id']] = account['Name']
                          sleep(ORG_THROTTLE_PERIOD)
                      break
                  except client.exceptions.ClientError as error:
                      if retry_attempts < MAX_RETRY_ATTEMPTS:
                          retry_attempts += 1
                          print(f"[INFO] {str(error)}. Retrying in {delay} seconds...")
                          sleep(delay)
                          delay *= 2
                          continue
                      print(f"[ERROR {str(error)}]")
                      break
              return active_accounts_details

