        ZipFile: |
          import json
          import boto3
          from os import getenv
          PROJECT_NAME = getenv('PROJECT_NAME')
          CROSS_ACCOUNT_ROLE = getenv('CROSS_ACCOUNT_ROLE')
          def lambda_handler(event, context):
              payload = event.copy()
              region = event['Region']
              role_arn = f"arn:aws:iam::{event['AccountId']}:role/{CROSS_ACCOUNT_ROLE}-{region}"
              active_session = assume_role(role_arn, region)
              elb_client = active_session.client('elb', region_name=region)
              elbv2_client = active_session.client('elbv2', region_name=region)
              loadbalancers, base_kwargs = [], {}
              next_token = ''
              try:
                  while next_token is not None:
                      kwargs = base_kwargs.copy()
                      if next_token != '':
                          kwargs.update({'Marker': next_token})
                      response = elb_client.describe_load_balancers(**kwargs)
                      for lb in response['LoadBalancerDescriptions']:
                          tags = get_loadbalancer_tags(elb_client, 'classic', lb['LoadBalancerName'])
                          lb_details = {'Type': 'classic', 'ResourceId': lb['LoadBalancerName'], 'Tags': tags}
                          lb_details.update(payload)
                          loadbalancers.append(lb_details)
                      next_token = response['NextMarker'] if 'NextMarker' in response else None
                  next_token = ''
                  while next_token is not None:
                      kwargs = base_kwargs.copy()
                      if next_token != '':
                          kwargs.update({'Marker': next_token})
                      response = elbv2_client.describe_load_balancers(**kwargs)
                      for lb in response['LoadBalancers']:
                          if lb['State'] not in ['failed']:
                              tags = get_loadbalancer_tags(elbv2_client, lb['Type'], lb['LoadBalancerArn'])
                              lb_details = {'Type': lb['Type'], 'ResourceId': lb['LoadBalancerArn'], 'Tags': tags}
                              lb_details.update(payload)
                              loadbalancers.append(lb_details)
                      next_token = response['NextMarker'] if 'NextMarker' in response else None
              except Exception as error:
                  raise error
              return loadbalancers
          def get_loadbalancer_tags(client, lb_type, resource_id):
              tags = []
              kwargs = {'LoadBalancerNames': [resource_id]} if lb_type == 'classic' else {'ResourceArns': [resource_id]}
              try:
                  response = client.describe_tags(**kwargs)
                  for tag_desc in response['TagDescriptions']:
                      if 'Tags' in tag_desc:
                          tags = list(tag_desc['Tags'])
              except Exception as error:
                  raise error
              return tags
          def assume_role(role_arn, region):
              sts = boto3.client('sts', region_name=region)
              response = sts.assume_role(RoleArn=role_arn, RoleSessionName=PROJECT_NAME)
              session = boto3.Session(aws_access_key_id=response['Credentials']['AccessKeyId'],
                              aws_secret_access_key=response['Credentials']['SecretAccessKey'],
                              aws_session_token=response['Credentials']['SessionToken'])
              return session

