  LambdaFunctionTriggerer:
    Condition: DeployIPTrackerProject
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-lambda-function-triggerer"
      Timeout: 30
      Role: !GetAtt LambdaFunctionTriggererLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import json
          import ast
          import requests
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              if event_type in ['Create']:
                  method=getattr(client, 'invoke')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          if key == 'Payload':
                            kwargs[key] = json.dumps(value).encode('utf-8')
                          else:
                            kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  try:
                      print(kwargs)
                      data = method(**kwargs)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return

