          def lambda_handler(event, context):
              region = event['Region']
              role_arn = f"arn:aws:iam::{event['AccountId']}:role/{CROSS_ACCOUNT_ROLE}-{region}"
              active_session = assume_role(role_arn, region)
              cloudtrail_client = active_session.client('cloudtrail', region_name=region)
              ec2_client = active_session.client('ec2', region_name=region)
              ssm_client = active_session.client('ssm', region_name=region)

              deploy_method = ''
              team = ''
              deploy_method_key_exists = False
              team_key_exists = False
              created_by, created_at = get_resource_details(cloudtrail_client, 'RunInstances', event['InstanceId'])
              is_ssm_managed = 'Yes' if is_instance_ssm_managed(ssm_client, event['InstanceId']) else 'No'
              for tag in event['Tags']:
                  if tag.split(' ')[0].rstrip(':') in ['DeployedBy', 'deployedby', 'Deployedby', 'deployedBy']:
                      created_by = tag.split(': ')[1]
                  if tag.split(' ')[0].rstrip(':') in ['DeployMethod', 'deployMethod', 'Deploymethod', 'deployMethod']:
                      deploy_method = tag.split(': ')[1]
                      deploy_method_key_exists = True
                  if tag.split(' ')[0].rstrip(':') in ['Team', 'team']:
                      team = tag.split(': ')[1]
                      team_key_exists = True
              if not deploy_method_key_exists:
                  deploy_method = 'aws console'
                  print(f"DeployMethod tag does not exist on EC2 Instance {event['InstanceId']}. Adding it...")
                  if not add_tags_to_ec2_resource(ec2_client, event['InstanceId'], [{'Key': 'DeployMethod', 'Value': deploy_method}]):
                      print(f"[ERROR] Could not add tag to EC2 Instance {event['InstanceId']}")
              if not team_key_exists:
                  team = 'unknown'
                  print(f"Team tag does not exist on EC2 Instance {event['InstanceId']}. Adding it...")
                  if not add_tags_to_ec2_resource(ec2_client, event['InstanceId'], [{'Key': 'Team', 'Value': team}]):
                      print(f"[ERROR] Could not add tag to EC2 Instance {event['InstanceId']}")
              if not created_at:
                  created_at = event['LaunchedAt']
              return {
                  'AccountId': event['AccountId'],
                  'Region': event['Region'],
                  'ResourceId': event['InstanceId'],
                  'ResourceType': 'EC2Instance',
                  'InstanceType': event['InstanceType'],
                  'State': event['State'],
                  'DeployMethod': deploy_method,
                  'Team': team,
                  'CreatedBy': created_by,
                  'PublicIp': event['PublicIp'],
                  'CostType': event['CostType'],
                  'CreatedAt': created_at,
                  'LaunchedAt': event['LaunchedAt'],
                  'Platform': event['Platform'],
                  'IsSSMManged': is_ssm_managed,
                  'Tags': event['Tags']
              }
          def is_instance_ssm_managed(client, instance_id: str):
              try:
                  response = client.describe_instance_information(
                      Filters=[{
                          'Key': 'InstanceIds',
                          'Values': [instance_id]
                      }]
                  )
                  instance_info = response['InstanceInformationList']
                  return len(instance_info) > 0
              except Exception as error:
                  raise error
          def add_tags_to_ec2_resource(client, resource: str, tags: list) -> bool:
              try:
                  client.create_tags(
                      Resources=[resource],
                      Tags=tags
                  )
              except client.exceptions.ClientError as error:
                  print(f"[ERROR] {str(error)}")
                  return False
              return True
          def get_resource_details(client, event_name, resource_id):
              max_retry_attempts = 5
              initial_delay = 5
              created_by, created_at, user, cloudtrail_event, next_token = '', '', '', '', ''
              base_kwargs = {
                  'LookupAttributes': [{
                      'AttributeKey': 'ResourceName',
                      'AttributeValue': resource_id
                  }]
