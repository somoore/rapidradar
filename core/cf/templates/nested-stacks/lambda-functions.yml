  GetDeploymentTargetAccounts:
    Condition: CreateGetDeploymentDetailsResources
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.lambda_handler"
      Runtime: python3.11
      Timeout: 900
      FunctionName: !Sub "${ProjectName}-get-deployment-target-accounts"
      Role: !GetAtt GetChildDeploymentAccountsLambdaRole.Arn
      Environment:
        Variables:
          ACTIVE_REGIONS: !Ref ActiveRegions
          CURRENT_ACCOUNT: !Ref AWS::AccountId
          MANAGEMENT_ACCOUNT: !Ref ManagementAccountId
          CHILD_ACCOUNTS_STACKSET_NAME: !Ref ChildAccountsStackSetName
      Code:
        ZipFile: |
          from os import getenv
          import boto3
          ACTIVE_REGIONS = getenv('ACTIVE_REGIONS').replace(' ', '').split(',')
          CURRENT_ACCOUNT = getenv('CURRENT_ACCOUNT')
          MANAGEMENT_ACCOUNT = getenv('MANAGEMENT_ACCOUNT')
          CHILD_ACCOUNTS_STACKSET_NAME = getenv('CHILD_ACCOUNTS_STACKSET_NAME')
          CALL_AS = 'SELF' if CURRENT_ACCOUNT == MANAGEMENT_ACCOUNT else 'DELEGATED_ADMIN'
          def lambda_handler(event, context):
              payload = event.copy()
              active_accounts = []
              if 'ExecutionType' in event and event['ExecutionType'] == 'AUTOMATED':
                  return payload
              child_accounts = get_child_accounts(CHILD_ACCOUNTS_STACKSET_NAME)
              payload['Accounts'] = []
              for child in child_accounts:
                  payload['Accounts'].append({'AccountId': child, 'Regions': ACTIVE_REGIONS})
              return payload
          def get_child_accounts(stackset_name: str):
              account_ids = []
              try:
                  cloudformation = boto3.client('cloudformation')
                  response = cloudformation.list_stack_instances(
                      StackSetName=stackset_name,
                      MaxResults=100,
                      CallAs=CALL_AS
                  )
                  stack_instances = response['Summaries']
                  while 'NextToken' in response:
                      response = cloudformation.list_stack_instances(
                          StackSetName=stackset_name,
                          MaxResults=100,
                          CallAs=CALL_AS,
                          NextToken=response['NextToken']
                      )
                      stack_instances.extend(response['Summaries'])
                  for instance in stack_instances:
                      if instance['StackInstanceStatus']['DetailedStatus'] == 'SUCCEEDED':
                          account_ids.append(instance['Account'])
              except Exception as error:
                  raise error
              return list(set(account_ids))

