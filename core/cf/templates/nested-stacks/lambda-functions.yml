AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates Lambda Functions to be used as triggers by EventBridge Rules, StepFunctions and Custom Resources
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Configuration
        Parameters:
          - ProjectName
          - OrganizationId
          - AwsOrgName
          - CrossAccountRole
          - SlackActionsCrossAccountRole
          - DeploymentTargets
          - ExcludeAccounts
          - ActiveRegions
          - ManagementAccountId
          - LogArchiveAccountId
          - HomeRegion
          - ChildAccountsStackSetName
          - EnableGuardDuty
          - EventsProcessorLambdaEnvVarsSecretName
          - SSOUsersSecretName
      - Label:
          default: DynamoDB Tables
        Parameters:
          - SecurityGroupTableName
          - IAMUsersTableName
          - S3BucketsTableName
          - RootIAMLoginsTableName
          - UnusedEC2InstancesTableName
          - UnusedSecurityGroupsTableName
          - UnusedEBSVolumesTableName
          - RemediatedResourcesTableName
          - ActiveResourcesTableName
          - DeletedResourcesTableName
          - DailyUserCostReportsTableName
          - WeeklyUserCostReportsTableName
          - MonthlyUserCostReportsTableName
          - IPCorrelationTableName
          - SSOUserIPHistoryTableName
          - IAMKeyPairAccessTrackerTableName
          - SSMDocumentAssociationFailureTrackerTableName
      - Label:
          default: Post Deploy SSM Automation
        Parameters:
          - AddSupportforPostDeploySSMAutomation
          - AutoAttachIAMRoleEC2
          - ExistingEC2SSMIAMRoleName
          - AutoAttachMissingPolicies
          - NamesOfAdditionalPoliciesToAutoAttach
          - AutoCreateVPCEndpoints
          - VPCEndpointsList
          - CreateNewManagedPolicy
          - ManagedPolicyName
          - ManagedPolicyDocumentJson
          - EnableEC2InstanceConfigurator
          - TrackSSMDocumentAssociationFailures
      - Label:
          default: User Offboarding Workflow Project
        Parameters:
          - AddSupportforUserOffboardingWorkflow
          - BatchJobQueueARN
          - BatchJobDefinitionARN
          - SSOUserManagerArtifactsBucketName
          - SSOUserManagerArtifactsBucketARN
      - Label:
          default: IAM Secret-Access KeyPair Access Tracker Project
        Parameters:
          - AddSupportforIAMKeyPairAccessTracker
      - Label:
          default: CMDB Project
        Parameters:
          - AddSupportforCMDB
      - Label:
          default: IP Tracker Project
        Parameters:
          - AddSupportforIPTracker
          - TrackTailscaleIPs
          - SSOUsersIpDataBucketName
          - SSOUsersIpDataBucketARN
      - Label:
          default: Auto-Tagger
        Parameters:
          - TagVPCs
          - TagsKeyValueVPCs
          - TagSubnets
          - TagsKeyValueSubnets
          - TagEbsVolumes
          - TagsKeyValueEbsVolumes
          - TagEIPs
          - TagsKeyValueEIPs
          - TagEbsSnapshots
          - TagsKeyValueEbsSnapshots
          - TagAMIs
          - TagsKeyValueAMIs
          - TagEC2Instances
          - TagsKeyValueEC2Instances
          - TagEksClusters
          - TagsKeyValueEksClusters
          - TagRDSClusterInstances
          - TagsKeyValueRDSClusterInstances
          - TagEFS
          - TagsKeyValueEFS
          - TagFSX
          - TagsKeyValueFSX
          - TagSecrets
          - TagsKeyValueSecrets
          - TagBackupPlans
          - TagsKeyValueBackupPlans
          - TagLoadbalancers
          - TagsKeyValueLoadbalancers
      - Label:
          default: Alerts Configuration
        Parameters:
          - EngineerFacingNotificationsConfigsSecretName
          - SecurityAdminFacingNotificationsConfigsSecretName
          - EnableSlackSocketMode
          - SlackBotConfigSecretName
          - SenderEmailAddress
          - ReceiverEmailAddressess
      - Label:
          default: Alerts Customization
        Parameters:
          - UnusedResourcesDetectionBypassTagKey
          - DisableDetectionStoppedEC2Instances
          - DisableDetectionUnusedSecurityGroups
          - DisableDetectionUnusedEBSVolumes
      - Label:
          default: Azure Cloud Configuration
        Parameters:
          - AddSupportforAzureCloud
          - AzureCustomerId
          - AzureSharedKeySSM
          - AzureLogType
    ParameterLabels:
      ProjectName:
        default: Project Name
      OrganizationId:
        default: Organization Id
      AwsOrgName:
        default: AWS Organization Name
      CrossAccountRole:
        default: Cross Account Role Name
      SlackActionsCrossAccountRole:
        default: Cross Account Role Name for taking Slack Actions
      DeploymentTargets:
        default: Account IDs or Organization Unit IDs you're getting this solution deployed to
      ExcludeAccounts:
        default: Accounts you want to exclude from the deployment
      ActiveRegions:
        default: List of AWS regions where this solution is being deployed
      ManagementAccountId:
        default: Management Account ID
      LogArchiveAccountId:
        default: Log Archive account ID (Skip if its a Standalone Deployment)
      HomeRegion:
        default: Home AWS Region
      ChildAccountsStackSetName:
        default: Name of Child Accounts StackSet
      EnableGuardDuty:
        default: Enable GuardDuty?
      EventsProcessorLambdaEnvVarsSecretName:
        default: Name of Secret containing env vars for events-processor Lambda Function
      SSOUsersSecretName:
        default: Name of Secret containing SSO Users ID along with usernames
      SecurityGroupTableName:
        default: DynamoDB Table Name for Security Groups
      IAMUsersTableName:
        default: DynamoDB Table Name for IAM User
      S3BucketsTableName:
        default: DynamoDB Table Name for S3 Buckets
      RootIAMLoginsTableName:
        default: DynamoDB Table Name for Root User and IAM Users Login Metadata
      UnusedEC2InstancesTableName:
        default: DynamoDB Table Name for Unused EC2 Instances
      UnusedSecurityGroupsTableName:
        default: DynamoDB Table Name for Unused Security Groups
      UnusedEBSVolumesTableName:
        default: DynamoDB Table Name for EBS Volumes
      RemediatedResourcesTableName:
        default: DynamoDB Table Name for Remediated Findings of Resources
      ActiveResourcesTableName:
        default: DynamoDB Table Name for Active Resources
      DeletedResourcesTableName:
        default: DynamoDB Table Name for Deleted Resources
      DailyUserCostReportsTableName:
        default: DynamoDB Table Name for Daily User Cost Reports Metadata
      WeeklyUserCostReportsTableName:
        default: DynamoDB Table Name for Weekly User Cost Reports Metadata
      MonthlyUserCostReportsTableName:
        default: DynamoDB Table Name for Monthly User Cost Reports Metadata
      IPCorrelationTableName:
        default: DynamoDB Table Name for IP Correlation
      SSOUserIPHistoryTableName:
        default: DynamoDB Table Name for SSO Users IP History
      IAMKeyPairAccessTrackerTableName:
        default: DynamoDB Table Name for IAM Keypair Access Tracker
      SSMDocumentAssociationFailureTrackerTableName:
        default: DynamoDB Table Name for SSM Document Association Failure Tracker
      AddSupportforPostDeploySSMAutomation:
        default: Enable Post Deploy SSM Automation Project?
      AutoAttachIAMRoleEC2:
        default: Auto-attach IAM Role to EC2 Instance?
      ExistingEC2SSMIAMRoleName:
        default: Name of existing IAM Role to attach to EC2 Instances on creation
      AutoAttachMissingPolicies:
        default: Auto-attach missing IAM Policies to IAM Role attached to EC2 Instance?
      NamesOfAdditionalPoliciesToAutoAttach:
        default: Names of Additional Policies to auto-attach to IAM Role if missing
      AutoCreateVPCEndpoints:
        default: Auto-create VPC endpoints?
      VPCEndpointsList:
        default: List of VPC Endpoints to create
      CreateNewManagedPolicy:
        default: Create new IAM Managed Policy?
      ManagedPolicyName:
        default: Name of the new managed policy
      ManagedPolicyDocumentJson:
        default: Policy Document of new IAM Managed Policy
      EnableEC2InstanceConfigurator:
        default: Apply Custom Configurations to newly launched EC2 Instances?
      TrackSSMDocumentAssociationFailures:
        default: Track Failures for SSM Document Association?
      AddSupportforUserOffboardingWorkflow:
        default: Deploy User Offboarding Workflow Project?
      BatchJobQueueARN:
        default: ARN of Batch Job Queue
      BatchJobDefinitionARN:
        default: ARN of Batch Job Definition
      SSOUserManagerArtifactsBucketName:
        default: Name of SSOUserManagerArtifacts Bucket
      SSOUserManagerArtifactsBucketARN:
        default: ARN of SSOUserManagerArtifacts Bucket
      AddSupportforIAMKeyPairAccessTracker:
        default: Deploy IAM Secret-Access KeyPair Access Tracker Project?
      AddSupportforCMDB:
        default: Deploy CMDB Project?
      AddSupportforIPTracker:
        default: Deploy IP Tracker Project?
      TrackTailscaleIPs:
        default: Track User IP Addresses from Tailscale?
      SSOUsersIpDataBucketName:
        default: Name of SSOUsersIpData Bucket
      SSOUsersIpDataBucketARN:
        default: ARN of SSOUsersIpData Bucket
      TagVPCs:
        default: Enable auto-tagger for VPCs?
      TagsKeyValueVPCs:
        default: Tags Key-Value for VPCs
      TagSubnets:
        default: Enable auto-tagger for Subnets?
      TagsKeyValueSubnets:
        default: Tags Key-Value for Subnets
      TagEbsVolumes:
        default: Enable auto-tagger for EBS Volumes?
      TagsKeyValueEbsVolumes:
        default: Tags Key-Value for EBS Volumes
      TagEIPs:
        default: Enable auto-tagger for Elastic IPs?
      TagsKeyValueEIPs:
        default: Tags Key-Value for Elastic IPs
      TagEbsSnapshots:
        default: Enable auto-tagger for EBS Snapshots?
      TagsKeyValueEbsSnapshots:
        default: Tags Key-Value for EBS Snapshots
      TagAMIs:
        default: Enable auto-tagger for AMIs?
      TagsKeyValueAMIs:
        default: Tags Key-Value for AMIs
      TagEC2Instances:
        default: Enable auto-tagger for EC2 Instances?
      TagsKeyValueEC2Instances:
        default: Tags Key-Value for EC2 Instances
      TagEksClusters:
        default: Enable auto-tagger for EKS Clusters?
      TagsKeyValueEksClusters:
        default: Tags Key-Value for EKS Clusters
      TagRDSClusterInstances:
        default: Enable auto-tagger for RDS Clusters and Instances?
      TagsKeyValueRDSClusterInstances:
        default: Tags Key-Value for RDS Clusters and Instances
      TagEFS:
        default: Enable auto-tagger for EFS?
      TagsKeyValueEFS:
        default: Tags Key-Value for EFS
      TagFSX:
        default: Enable auto-tagger for FSX?
      TagsKeyValueFSX:
        default: Tags Key-Value for FSX
      TagSecrets:
        default: Enable auto-tagger for SecretsManager Secrets?
      TagsKeyValueSecrets:
        default: Tags Key-Value for SecretsManager Secrets
      TagBackupPlans:
        default: Enable auto-tagger for Backup Plans?
      TagsKeyValueBackupPlans:
        default: Tags Key-Value for Backup Plans
      TagLoadbalancers:
        default: Enable auto-tagger for LoadBalancers?
      TagsKeyValueLoadbalancers:
        default: Tags Key-Value for LoadBalancers
      EngineerFacingNotificationsConfigsSecretName:
        default: Name of Secret containing notification configuration for Engineer-Facing Alerts
      SecurityAdminFacingNotificationsConfigsSecretName:
        default: Name of Secret containing notification configuration for Security Admin-Facing Alerts
      EnableSlackSocketMode:
        default: Enable Socket mode for Slack App?
      SlackBotConfigSecretName:
        default: Name of SecretsManager Secret containing Configuration for Slack Bot
      SenderEmailAddress:
        default: Email Address to use to send out Resource Creation Failure Emails to Users
      ReceiverEmailAddressess:
        default: Email Addresses where you want to send reports for Disabled User's Resources and also daily resource reports
      UnusedResourcesDetectionBypassTagKey:
        default: Tag Key that needs to be present on unused resources if detection needs to be bypassed
      DisableDetectionStoppedEC2Instances:
        default: Disable detection for stopped EC2 Instances?
      DisableDetectionUnusedSecurityGroups:
        default: Disable detection for unused Security Groups?
      DisableDetectionUnusedEBSVolumes:
        default: Disable detection for unused EBS Volumes?
      AddSupportforAzureCloud:
        default: Send findings to Azure Log Analytics for further analysis?
      AzureCustomerId:
        default: Azure Customer ID
      AzureSharedKeySSM:
        default: SSM Parameter Name for Azure Shared Key
      AzureLogType:
        default: Azure Log Type

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    MaxLength: 20
  OrganizationId:
    Type: String
    Description: ID of current organization
  AwsOrgName:
    Type: String
    Description: AWS Organization Name
  CrossAccountRole:
    Type: String
    Description: Name of CrossAccountRole in child account to be assumed by lambda Function.
    Default: <ProjectName>-cross-account-role
  SlackActionsCrossAccountRole:
    Type: String
    Description: Name of SlackActionsCrossAccountRole in child account to be assumed by lambda Function.
    Default: <ProjectName>-slack-cross-account-role
  DeploymentTargets:
    Type: String
    Description: Comma-Delimited List
  ExcludeAccounts:
    Type: String
    Description: Comma-Delimited List
  ActiveRegions:
    Type: String
    Description: Comma-Delimited List
  ManagementAccountId:
    Type: String
    Description: Account Id
    MaxLength: 12
    MinLength: 12
  LogArchiveAccountId:
    Type: String
    Description: AWS Account ID of the Control Tower Log Archive account.
  HomeRegion:
    Type: String
    Description: AWS Region
  ChildAccountsStackSetName:
    Type: String
    Description: Name of StackSet which is deployed in all child accounts
  EnableGuardDuty:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable GuardDuty
  EventsProcessorLambdaEnvVarsSecretName:
    Type: String
    Description: SecretsManager Secret Name
  SSOUsersSecretName:
    Type: String
    Description: SecretsManager Secret Name
  SecurityGroupTableName:
    Type: String
    Description: Table Name
  IAMUsersTableName:
    Type: String
    Description: Table Name
  S3BucketsTableName:
    Type: String
    Description: Table Name
  RootIAMLoginsTableName:
    Type: String
    Description: Table Name
  UnusedEC2InstancesTableName:
    Type: String
    Description: Table Name
  UnusedSecurityGroupsTableName:
    Type: String
    Description: Table Name
  UnusedEBSVolumesTableName:
    Type: String
    Description: Table Name
  RemediatedResourcesTableName:
    Type: String
    Description: Table Name
  ActiveResourcesTableName:
    Type: String
    Description: Table Name
  DeletedResourcesTableName:
    Type: String
    Description: Table Name
  DailyUserCostReportsTableName:
    Type: String
    Description: Table Name
  WeeklyUserCostReportsTableName:
    Type: String
    Description: Table Name
  MonthlyUserCostReportsTableName:
    Type: String
    Description: Table Name
  IPCorrelationTableName:
    Type: String
    Description: Table Name
  SSOUserIPHistoryTableName:
    Type: String
    Description: Table Name
  IAMKeyPairAccessTrackerTableName:
    Type: String
    Description: Table Name
  SSMDocumentAssociationFailureTrackerTableName:
    Type: String
    Description: Table Name
  AddSupportforPostDeploySSMAutomation:
    Type: String
    Description: Set to True if you want to enable Post Deploy SSM Automation Project
    AllowedValues:
    - true
    - false
  AutoAttachIAMRoleEC2:
    Type: String
    Description: Set to True if you want to auto-attach IAM Role to EC2 instance if not attached already
    AllowedValues:
    - true
    - false
  ExistingEC2SSMIAMRoleName:
    Type: String
    Description: If not provided, we'll auto-create an IAM Role with required policies attached
  AutoAttachMissingPolicies:
    Type: String
    Description: Set to True if you want to auto-attach missing policies to IAM Role attached to EC2 instance
    AllowedValues:
    - true
    - false
  NamesOfAdditionalPoliciesToAutoAttach:
    Type: String
    Description: Comma-Delimited list of names of managed IAM policies [excluding "AmazonSSMManagedInstanceCore", "AmazonSSMManagedEC2InstanceDefaultPolicy" as these will be attached by default]
  AutoCreateVPCEndpoints:
    Type: String
    Description: "Set to True if you want to auto-create missing VPC Endpoints on EC2 launch. NOTE: If set to false and EnableEC2InstanceConfigurator is set to true, following VPC endpoints should exist: [ssm, ssmmessages, ec2messages]"
    AllowedValues:
    - true
    - false
  VPCEndpointsList:
    Type: String
    Description: Comma-Delimited list [excluding "com.amazonaws.[region].ssm", "com.amazonaws.[region].ssmmessages", "com.amazonaws.[region].ec2messages", as these will be created by default]
  CreateNewManagedPolicy:
    Type: String
    Description: "Set to True if you want to create new IAM managed Policy (This will also be auto-attached to EC2 Roles if AutoAttachMissingPolicies is true)"
    AllowedValues:
    - true
    - false
  ManagedPolicyName:
    Type: String
    Description: Name of the new managed policy to be created
  ManagedPolicyDocumentJson:
    Type: String
    Description: Policy Document of new IAM Policy
  EnableEC2InstanceConfigurator:
    Type: String
    Description: Set to True if you want to apply custom configurations through SSM Documents for EC2 Instances
    AllowedValues:
    - true
    - false
  TrackSSMDocumentAssociationFailures:
    Type: String
    Description: Set to True if you want to track failures for SSM Document Association
    AllowedValues:
    - true
    - false
  AddSupportforUserOffboardingWorkflow:
    Type: String
    Description: Set to True if you want User Offboarding Workflow Project deployed
    AllowedValues:
    - true
    - false
  BatchJobQueueARN:
    Type: String
    Description: Batch Job Queue ARN
  BatchJobDefinitionARN:
    Type: String
    Description: Batch Job Definition ARN
  SSOUserManagerArtifactsBucketName:
    Type: String
    Description: S3 Bucket Name
  SSOUserManagerArtifactsBucketARN:
    Type: String
    Description: S3 Bucket ARN
  AddSupportforIAMKeyPairAccessTracker:
    Type: String
    Description: Set to True if you want IAM Secret-Access KeyPair Access Tracker project deployed
    AllowedValues:
    - true
    - false
  AddSupportforCMDB:
    Type: String
    Description: Set to True if you want CMDB project deployed
    AllowedValues:
    - true
    - false
  AddSupportforIPTracker:
    Type: String
    Description: Set to True if you want IP Tracker project deployed
    AllowedValues:
    - true
    - false
  TrackTailscaleIPs:
    Type: String
    Description: Set to True if you want to track sso user's IP Addresses from tailscale as well along with AWS
    AllowedValues:
    - true
    - false
  SSOUsersIpDataBucketName:
    Type: String
    Description: S3 Bucket Name
  SSOUsersIpDataBucketARN:
    Type: String
    Description: S3 Bucket ARN
  TagVPCs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for VPCs on creation
  TagsKeyValueVPCs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagSubnets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Subnets on creation
  TagsKeyValueSubnets:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEbsVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Volumes on creation
  TagsKeyValueEbsVolumes:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEIPs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Elastic IPs on allocation
  TagsKeyValueEIPs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEbsSnapshots:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Snapshots on creation
  TagsKeyValueEbsSnapshots:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagAMIs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for AMIs on creation
  TagsKeyValueAMIs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EC2 Instances on launch
  TagsKeyValueEC2Instances:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEksClusters:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EKS Clusters on creation
  TagsKeyValueEksClusters:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagRDSClusterInstances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for RDS Clusters and Instances on creation
  TagsKeyValueRDSClusterInstances:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEFS:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EFS on filesystem creation
  TagsKeyValueEFS:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagFSX:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for FSX on filesystem creation
  TagsKeyValueFSX:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagSecrets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for SecretsManager on secret creation
  TagsKeyValueSecrets:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagBackupPlans:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Backup Plans on creation
  TagsKeyValueBackupPlans:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagLoadbalancers:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for LoadBalancers on creation
  TagsKeyValueLoadbalancers:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  EngineerFacingNotificationsConfigsSecretName:
    Type: String
    Description: SecretsManager Secret Name (Should contain NOTIFICATION_APP and WEBHOOK_URL/APP_CONFIG keys)
  SecurityAdminFacingNotificationsConfigsSecretName:
    Type: String
    Description: SecretsManager Secret Name (Should contain NOTIFICATION_APP and WEBHOOK_URL/APP_CONFIG keys)
  EnableSlackSocketMode:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable Socket mode for Slack App
  SlackBotConfigSecretName:
    Type: String
    Description: Contains the Slack bot OAuth token and channel ID for sending alerts and managing responses
  SenderEmailAddress:
    Type: String
    Description: Email Address
  ReceiverEmailAddressess:
    Type: String
    Description: Comma Separated Email Addresses
  UnusedResourcesDetectionBypassTagKey:
    Type: String
    Description: Tag Key
  DisableDetectionStoppedEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for stopped EC2 Instances
  DisableDetectionUnusedSecurityGroups:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused Security Groups
  DisableDetectionUnusedEBSVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused EBS Volumes
  AddSupportforAzureCloud:
    Type: String
    Description: Set to True if you want to send findings to Azure Cloud
    AllowedValues:
    - true
    - false
  AzureCustomerId:
    Type: String
    Description: Customer ID
  AzureSharedKeySSM:
    Type: String
    Description: Name of SSM Parameter Item which contains Shared Key for Azure Cloud
  AzureLogType:
    Type: String
    Description: Log Type

Conditions:
  SlackSocketModeEnabled: !Equals [ !Ref EnableSlackSocketMode, true ]
  SlackBotConfigProvided: !Not [ !Equals [ !Ref SlackBotConfigSecretName, "" ] ]
  EnableSlackInteractivity: !And
  - !Not [ !Condition SlackSocketModeEnabled ]
  - !Condition SlackBotConfigProvided
  DeploySSMAutomationProject: !Equals
  - !Ref AddSupportforPostDeploySSMAutomation
  - true
  DeployUserOffboardingWorkflowProject: !Equals
  - !Ref AddSupportforUserOffboardingWorkflow
  - true
  DeployIAMKeyPairAccessTrackerProject: !Equals
  - !Ref AddSupportforIAMKeyPairAccessTracker
  - true
  DeployCMDBProject: !Equals
  - !Ref AddSupportforCMDB
  - true
  DeployIPTrackerProject: !Equals
  - !Ref AddSupportforIPTracker
  - true
  IsGuardDutyEnabled: !Equals
  - !Ref EnableGuardDuty
  - true

  IsEnabledStoppedEC2InstancesDetection: !Equals
  - !Ref DisableDetectionStoppedEC2Instances
  - false
  IsEnabledUnusedSecurityGroupsDetection: !Equals
  - !Ref DisableDetectionUnusedSecurityGroups
  - false
  IsEnabledUnusedEBSVolumesDetection: !Equals
  - !Ref DisableDetectionUnusedEBSVolumes
  - false

  IsEnabledUnusedResourcesDetection: !Or
  - !Condition IsEnabledStoppedEC2InstancesDetection
  - !Condition IsEnabledUnusedSecurityGroupsDetection
  - !Condition IsEnabledUnusedEBSVolumesDetection

  FoundSecurityFacingAlertsConfig: !Not [ !Equals [ !Ref SecurityAdminFacingNotificationsConfigsSecretName, "" ] ]
  AutoTagVPCs: !Equals
  - !Ref TagVPCs
  - true
  AutoTagSubnets: !Equals
  - !Ref TagSubnets
  - true
  AutoTagEbsVolumes: !Equals
  - !Ref TagEbsVolumes
  - true
