          CROSS_ACCOUNT_ROLE = getenv('CROSS_ACCOUNT_ROLE')
          def lambda_handler(event, context):
              payload = event.copy()
              region = event['Region']
              role_arn = f"arn:aws:iam::{event['AccountId']}:role/{CROSS_ACCOUNT_ROLE}-{region}"
              active_session = assume_role(role_arn, region)
              client = active_session.client('ec2', region_name=region)
