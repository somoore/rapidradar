      Code:
        ZipFile: |
          import json
          import ast
          import requests
          import boto3
          from os import getenv
          CURRENT_REGION = getenv('CURRENT_REGION')
          def flatten(d, parent_key=''):
              items = []
              for k, v in d.items():
                  try:
                      items.extend(flatten(v, '%s%s.' % (parent_key, k)).items())
                  except AttributeError:
                      items.append(('%s%s' % (parent_key, k), v))
              return dict(items)
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              kwargs = {}
              for key, value in props['KwArgs'].items():
                  try:
                      kwargs[key] = ast.literal_eval(value)
                  except Exception as e:
                      print(str(e))
                      kwargs[key] = value
              if event_type in ['Create', 'Update']:
                  regions = kwargs['ActiveRegions'].replace(" ", "").split(",")
                  regions_minus_home_region = regions.copy()
                  regions_minus_home_region.remove(CURRENT_REGION)
                  try:
                      if regions_minus_home_region:
                          finding_aggregator_arns: list = []
                          paginator = client.get_paginator("list_finding_aggregators")
                          try:
                              for page in paginator.paginate():
                                  for finding_aggregator in page["FindingAggregators"]:
                                      finding_aggregator_arns.append(finding_aggregator["FindingAggregatorArn"])
                          except client.exceptions.InternalException:
                              print("No existing finding aggregator")
                          region_linking_mode = "SPECIFIED_REGIONS"
                          if finding_aggregator_arns:
                              print("...Updating finding aggregator")
                              update_finding_aggregator(client, region_linking_mode, regions_minus_home_region, finding_aggregator_arns)
                          else:
                              print("...Creating finding aggregator")
                              response = client.create_finding_aggregator(RegionLinkingMode=region_linking_mode, Regions=regions_minus_home_region)
                              api_call_details = {"API_Call": "securityhub:CreateFindingAggregator", "API_Response": response}
                              print(api_call_details)
                      else:
                          print("Region aggregator not created due to only one governed region.")
                  except Exception as error:
                      status = 'FAILED'
                      reason = str(error)
                      data = {}
              elif event_type in ['Delete']:
                  finding_aggregator_arns: list = []
                  try:
                      paginator = client.get_paginator("list_finding_aggregators")
                      for page in paginator.paginate():
                          for finding_aggregator in page["FindingAggregators"]:
                              finding_aggregator_arns.append(finding_aggregator["FindingAggregatorArn"])
                  except client.exceptions.InternalException:
                      print("No existing finding aggregator")
                  except client.exceptions.InvalidAccessException:
                      print("This account is not subscribed to AWS Security Hub")
                  for finding_aggregator_arn in finding_aggregator_arns:
                      try:
                          response = client.delete_finding_aggregator(FindingAggregatorArn=finding_aggregator_arn)
                          api_call_details = {"API_Call": "securityhub:DeleteFindingAggregator", "API_Response": response}
                          print(api_call_details)
                      except client.exceptions.InvalidAccessException:
                          print("This account is not subscribed to AWS Security Hub")
                      except Exception as error:
                          status = 'FAILED'
                          reason = str(error)
                          data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': flatten(data)
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def update_finding_aggregator(securityhub_client, region_linking_mode: str, regions: list, finding_aggregator_arns: list) -> None:
              for finding_aggregator_arn in finding_aggregator_arns:
                  response = securityhub_client.get_finding_aggregator(FindingAggregatorArn=finding_aggregator_arn)
                  api_call_details = {"API_Call": "securityhub:GetFindingAggregator", "API_Response": response}
                  print(api_call_details)
                  if response["RegionLinkingMode"] != region_linking_mode or not compare_lists(regions, response["Regions"]):
                      print(f"Update finding aggregator: {finding_aggregator_arn}")
                      if region_linking_mode != "ALL_REGIONS":
                          securityhub_client.update_finding_aggregator(
                              FindingAggregatorArn=finding_aggregator_arn, RegionLinkingMode=region_linking_mode, Regions=regions
                          )
                          api_call_details = {"API_Call": "securityhub:UpdateFindingAggregator", "API_Response": response}
                          print(api_call_details)
                      else:
                          securityhub_client.update_finding_aggregator(FindingAggregatorArn=finding_aggregator_arn, RegionLinkingMode=region_linking_mode)
                          api_call_details = {"API_Call": "securityhub:UpdateFindingAggregator", "API_Response": response}
                          print(api_call_details)
          def compare_lists(list1: list, list2: list) -> bool:
              if len(list1) != len(list2):
                  return False
              if set(list1) == set(list2):
                  return True
              return False

  EnableSecurityHubLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-securityhub-enabler"
      Handler: "index.handler"
      Runtime: python3.11
      Timeout: 300
      Role: !GetAtt SecurityHubEnablerLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AutomationAccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Environment:
