      Code:
        ZipFile: |
          import json
          from os import getenv
          from time import sleep
          import ast
          import requests
          import boto3
          ADMIN_ACCOUNT_ID = str(getenv('ADMIN_ACCOUNT_ID'))
          ACCOUNT_ID = str(getenv('ACCOUNT_ID'))
          CURRENT_REGION = getenv('CURRENT_REGION')
          def flatten(d, parent_key=''):
              items = []
              for k, v in d.items():
                  try:
                      items.extend(flatten(v, '%s%s.' % (parent_key, k)).items())
                  except AttributeError:
                      items.append(('%s%s' % (parent_key, k), v))
              return dict(items)
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              config_client=boto3.client("config")
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              kwargs = {}
              if event_type in ['Create', 'Update']:
                  method=getattr(client, 'enable_security_hub')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  try:
                      standard_dict: dict = get_standard_dictionary(
                          kwargs["SecurityBestPracticesVersion"],
                          kwargs["CISVersion"],
                          kwargs["PCIVersion"],
                          kwargs["NISTVersion"]
                      )
                      try:
                          print("Enabling SecurityHub...")
                          data = method(EnableDefaultStandards=False)
                      except client.exceptions.ResourceConflictException:
                          print(f"SecurityHub already enabled in {ACCOUNT_ID} {CURRENT_REGION}")
                      print("Checking if Config is enabled...")
                      if is_config_enabled(config_client):
                          process_standards(client, standard_dict, kwargs["StandardsToEnable"])
                      print("Waiting 20 seconds before exiting..")
                      sleep(20)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              elif event_type in ['Delete']:
                  method=getattr(client, 'disable_security_hub')
                  try:
                      data = method()
                      api_call_details = {"API_Call": "securityhub:DisableSecurityHub", "API_Response": data}
                      print(api_call_details)
                      print(f"SecurityHub disabled in {CURRENT_REGION}")
                  except client.exceptions.ResourceNotFoundException:
                      print(f"SecurityHub is not enabled in {CURRENT_REGION}")
                  except client.exceptions.ClientError as error:
                      if error.response['Error']['Code'] == 'InvalidInputException' and 'Cannot disable Security Hub on the Security Hub administrator' in str(error):
                          print(f"cannot disable securityhub on administrator")
                      else:
                          status = 'FAILED'
                          reason = str(e)
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': flatten(data)
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def is_config_enabled(config_client) -> bool:
              if len(config_client.describe_configuration_recorders()["ConfigurationRecorders"]) > 0 and config_client.describe_configuration_recorder_status()["ConfigurationRecordersStatus"][0]["recording"]:
                  return True
              return False
          def get_standard_dictionary(sbp_version: str, cis_version: str, pci_version: str, nist_version: str) -> dict:
              cis_standard_arn: str = f"arn:aws:securityhub:::ruleset/cis-aws-foundations-benchmark/v/{cis_version}"
              if cis_version != "1.2.0":
                  cis_standard_arn = f"arn:aws:securityhub:{CURRENT_REGION}::standards/cis-aws-foundations-benchmark/v/{cis_version}"
              return {
                  "cis": {
                      "name": "CIS AWS Foundations Benchmark Security Standard",
                      "enabled": False,
                      "standard_arn": cis_standard_arn,
                      "subscription_arn": f"arn:aws:securityhub:{CURRENT_REGION}:{ACCOUNT_ID}:subscription/cis-aws-foundations-benchmark/v/{cis_version}",
                  },
                  "pci": {
                      "name": "Payment Card Industry Data Security Standard (PCI DSS)",
                      "enabled": False,
                      "standard_arn": f"arn:aws:securityhub:{CURRENT_REGION}::standards/pci-dss/v/{pci_version}",
                      "subscription_arn": f"arn:aws:securityhub:{CURRENT_REGION}:{ACCOUNT_ID}:subscription/pci-dss/v/{pci_version}",
                  },
                  "nist": {
                      "name": "National Institute of Standards and Technology (NIST) SP 800-53 Rev. 5",
                      "enabled": False,
                      "standard_arn": f"arn:aws:securityhub:{CURRENT_REGION}::standards/nist-800-53/v/{nist_version}",
                      "subscription_arn": f"arn:aws:securityhub:{CURRENT_REGION}:{ACCOUNT_ID}:subscription/nist-800-53/v/{nist_version}",
                  },
                  "sbp": {
                      "name": "AWS Foundational Security Best Practices Standard",
                      "enabled": False,
                      "standard_arn": f"arn:aws:securityhub:{CURRENT_REGION}::standards/aws-foundational-security-best-practices/v/{sbp_version}",
                      "subscription_arn": (
                          f"arn:aws:securityhub:{CURRENT_REGION}:{ACCOUNT_ID}:subscription/aws-foundational-security-best-practices/v/{sbp_version}"
                      ),
                  },
              }
          def process_standards(securityhub_client, standard_dict: dict, standards_to_enable: dict) -> None:
              formatted_standards_to_enable = {}
              for key, value in standards_to_enable.items():
                  if value.lower() == 'true':
                      formatted_standards_to_enable[key] = True
                  elif value.lower() == 'false':
                      formatted_standards_to_enable[key] = False
              standard_dict = get_current_enabled_standards(securityhub_client, standard_dict)
              for standard, status in standard_dict.items():
                  process_standard(securityhub_client, formatted_standards_to_enable, status, standard)
          def get_current_enabled_standards(securityhub_client, standard_dict: dict) -> dict:
              standards_subscriptions = get_enabled_standards(securityhub_client)
              if all_standards_in_status(standards_subscriptions, "READY", securityhub_client):
                  for item in standards_subscriptions:
                      if standard_dict["sbp"]["standard_arn"] == item["StandardsArn"]:
                          standard_dict["sbp"]["enabled"] = True
                      if standard_dict["cis"]["standard_arn"] == item["StandardsArn"]:
                          standard_dict["cis"]["enabled"] = True
                      if standard_dict["pci"]["standard_arn"] == item["StandardsArn"]:
                          standard_dict["pci"]["enabled"] = True
                      if standard_dict["nist"]["standard_arn"] == item["StandardsArn"]:
                          standard_dict["nist"]["enabled"] = True
              return standard_dict
          def get_enabled_standards(securityhub_client) -> list:
              standards_subscriptions = []
              try:
                  paginator = securityhub_client.get_paginator("get_enabled_standards")
                  for page in paginator.paginate():
                      for standards_subscription in page["StandardsSubscriptions"]:
                          standards_subscriptions.append(standards_subscription)
              except securityhub_client.exceptions.InvalidAccessException:
                  print("Security Hub is not enabled.")
              return standards_subscriptions
          def all_standards_in_status(standards_subscriptions: list, standards_status: str, securityhub_client) -> bool:
              for standards_subscription in standards_subscriptions:
                  print("entered all_standards_in_status function...")
                  print(f"standard - {standards_subscription} : {standards_subscription.get('StandardsStatus')}")
                  incomplete_status_resolved = True
                  if standards_subscription.get("StandardsStatus") == "INCOMPLETE":
                      incomplete_status_resolved = disable_then_enable_standard(
                          securityhub_client, standards_subscription.get("StandardsSubscriptionArn"), standards_subscription.get("StandardsArn")
                      )
                  if standards_subscription.get("StandardsStatus") != standards_status and standards_subscription.get("StandardsStatus") != "INCOMPLETE":
                      return False
                  if incomplete_status_resolved is False:
                      return False
              return True
          def disable_then_enable_standard(securityhub_client, standards_subscription_arn: str, standards_arn: str) -> bool:
              print("Entered disable_then_enable_standard function...")
              print(f"...disabling {standards_subscription_arn} standard")
              securityhub_client.batch_disable_standards(StandardsSubscriptionArns=[standards_subscription_arn])
              sleep(5)
              standard_enable_retry_sleep = 5
              standard_enable_retry = 0
              while standard_enable_retry < 10:
                  try:
                      print(f"...enabling {standards_subscription_arn} standard")
                      securityhub_client.batch_enable_standards(StandardsSubscriptionRequests=[{
                          "StandardsArn": standards_arn,
                      }])
                      return True
                  except securityhub_client.exceptions.InvalidInputException as error:
                      standard_enable_retry = standard_enable_retry + 1
                      print(
                          f"Retry {standard_enable_retry} due to InvalidInputException "
                          + f"while enabling standard: {error.response['Error']['Code']} - {error.response['Error']['Message']}"
                      )
                      sleep(standard_enable_retry_sleep)
              return False
          def all_standards_ready(securityhub_client) -> bool:
              for i in range(10):
                  standards_subscriptions = get_enabled_standards(securityhub_client)
                  if all_standards_in_status(standards_subscriptions, "READY", securityhub_client):
                      return True
                  print(f"Waiting 20 seconds before checking if standards are in READY status. {i} of 10")
                  sleep(20)
              return False
          def process_standard(securityhub_client, standards_to_enable: dict, standard_definition: dict, standard_short_name: str) -> bool:
              if all_standards_ready(securityhub_client):
                  try:
                      if standards_to_enable[standard_short_name]:
                          if not standard_definition["enabled"]:
                              response = securityhub_client.batch_enable_standards(
                                  StandardsSubscriptionRequests=[{"StandardsArn": standard_definition["standard_arn"]}]
                              )
                              api_call_details = {"API_Call": "securityhub:BatchEnableStandards", "API_Response": response}
                              print(api_call_details)
                              print(f"Enabled {standard_definition['name']}")
                          else:
                              print(f"{standard_definition['name']} is already enabled")
                      else:
                          if standard_definition["enabled"]:
                              print(f"Disabling {standard_definition['name']} in Account")
                              response = securityhub_client.batch_disable_standards(StandardsSubscriptionArns=[standard_definition["subscription_arn"]])
                              api_call_details = {"API_Call": "securityhub:BatchDisableStandards", "API_Response": response}
                              print(api_call_details)
                              print(f"Disabled {standard_definition['name']} in Account")
                          else:
                              print(f"{standard_definition['name']} is already disabled")
                  except securityhub_client.exceptions.InvalidInputException:
                      print("InvalidInputException while enabling or disabling standard")
              return True

