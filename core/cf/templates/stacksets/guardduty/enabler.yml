                      update_member_response = guardduty_client.update_member_detectors(**configuration_params)
                      if "UnprocessedAccounts" in update_member_response and update_member_response["UnprocessedAccounts"]:
                          unprocessed_accounts = update_member_response["UnprocessedAccounts"]
                          if retry_count == 5:
                              unprocessed = False

                  if unprocessed_accounts:
                      print(f"Update Member Detectors Unprocessed Member Accounts: {unprocessed_accounts}")
                      raise ValueError("Unprocessed Member Accounts while Updating Member Detectors")
          def get_remaining_accounts(update_member_response, account_ids: list) -> list:
              remaining_accounts: list = []
              for unprocessed_account in update_member_response["UnprocessedAccounts"]:
                  if unprocessed_account["AccountId"] in account_ids:
                      remaining_accounts.append(unprocessed_account["AccountId"])
              return remaining_accounts

  CreateEventBusRuleGuardDutyFindingsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: EventsReadWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EventsAccess
            Effect: Allow
            Action:
            - events:PutRule
            - events:PutTargets
            - events:DeleteRule
            - events:RemoveTargets
            - events:ListTargetsByRule
            - iam:PassRole
            Resource: "*"

  CreateEventBusRuleGuardDutyFindingsLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-create-guardduty-findings-event-rule"
      Timeout: 30
      Role: !GetAtt CreateEventBusRuleGuardDutyFindingsLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AutomationAccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: !Sub |
          import json
          import ast
          import boto3
          import requests
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              kwargs = {}
              for key, value in props['KwArgs'].items():
                  try:
                      kwargs[key] = ast.literal_eval(value)
                  except Exception as e:
                      print(str(e))
                      kwargs[key] = value
              guardduty_security_levels = kwargs['EventPattern']['detail']['severity']
              targets = []
              if 'Targets' in kwargs:
                  targets.extend(kwargs['Targets'])
                  del kwargs['Targets']
              event_rule_name = kwargs['Name']
              if event_type in ['Create', 'Update']:
                  severity_levels = []
                  method=getattr(client, 'put_rule')
                  try:
                      severity_levels.extend(get_severity_levels(guardduty_security_levels))
                      kwargs['EventPattern']['detail']['severity'] = severity_levels
                      kwargs['EventPattern'] = json.dumps(kwargs['EventPattern'])
                      print(f"...Creating EventBridge Rule for GuardDuty Findings with args: {kwargs}")
                      data = method(**kwargs)
                      print({"API_Call": "events:PutRule", "Response": data})
                      print(f"...Adding following target to EventBridge Rule named {event_rule_name}: {targets}")
                      response = client.put_targets(
                          Rule=event_rule_name,
                          Targets=targets
                      )
                      print({"API_Call": "events:PutTargets", "Response": response})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_rule')
                  try:
                      targets = get_event_rule_targets(client, event['PhysicalResourceId'])
                      if targets:
                          print(f"...Removing targets [ {(',').join(targets)} ] from EventBridge Rule named {event['PhysicalResourceId']}")
                          response = client.remove_targets(
                              Rule=event['PhysicalResourceId'],
                              Ids=targets
                          )
                          print({"API_Call": "events:DeleteTargets", "Response": response})
                      print(f"...Deleting EventBridge Rule named {event['PhysicalResourceId']}")
                      data = method(Name=event['PhysicalResourceId'])
                      print({"API_Call": "events:DeleteRule", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except client.exceptions.ResourceNotFoundException:
                      print("EventRule not found to delete. Skipping...")
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event_rule_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def get_severity_levels(severities: list):
              severity_levels = []
              if 'ALL' in severities:
                  severity_levels.extend(get_numbers_within_range(10, 90))
              else:
                  if 'LOW' in severities:
                      severity_levels.extend(get_numbers_within_range(10, 40))
                  if 'MEDIUM' in severities:
                      severity_levels.extend(get_numbers_within_range(40, 70))
                  if 'HIGH' in severities:
                      severity_levels.extend(get_numbers_within_range(70, 90))
              return sorted(severity_levels)
          def get_numbers_within_range(min, max):
              numbers = []
              for x in range(min, max):
                  num = x / 10
                  if num.is_integer():
                      numbers.append(int(num))
                  numbers.append(num)
              return numbers
          def get_event_rule_targets(client, rule_name):
              targets = []
              try:
                  response = client.list_targets_by_rule(Rule=rule_name)
                  if 'Targets' in response:
                      for target in response['Targets']:
                          targets.append(target['Id'])
              except client.exceptions.ResourceNotFoundException:
                  print("EventRule not found to delete. Skipping...")
              except Exception as error:
                  print(str(error))
              return targets

  CreateDetector:
    Condition: GuardDutyAdminAccountIdEmpty
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: guardduty
      ServiceToken: !GetAtt CreateDetectorLambda.Arn

  GetDetector:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: guardduty
      ServiceToken: !GetAtt GetDetectorLambda.Arn

  CreatePublishingDestinations:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: guardduty
      ServiceToken: !GetAtt CreatePublishingDestinationLambda.Arn
      KwArgs:
        DetectorId: !GetAtt GetDetector.Id
        DestinationArn: !Join ['-', [ !Sub "arn:aws:s3:::${GuardDutyDeliveryBucketPrefix}", !If [ LogArchiveAccountIdEmpty, !Ref AWS::AccountId, !Ref LogArchiveAccountId ], !If [ CentralLoggingBucket, !Ref HomeRegion, !Ref AWS::Region ] ]]

  UpdateConfiguration:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: guardduty
      ServiceToken: !GetAtt UpdateConfigurationLambda.Arn
      KwArgs:
        IsOrgSetup: !If [GuardDutyAdminAccountIdNotEmpty, !Ref CreateMembers, !Ref AWS::NoValue]
        DeploymentTargets: !Ref DeploymentTargets
        ExcludeAccount: !If [GuardDutyAdminAccountIdEmpty, !Ref AWS::NoValue, !Ref AWS::AccountId]
        DetectorId: !GetAtt GetDetector.Id
        FindingPublishingFrequency: !Ref FindingPublishingFrequency
        gdFeatures:
          autoEnableS3Logs: !Ref AutoEnableS3Logs
          enableEksAuditLogs: !Ref EnableEKSAuditLogs
          autoEnableMalwareProtection: !Ref AutoEnableMalwareProtection
          enableRdsLoginEvents: !Ref EnableRDSLoginEvents
          enableEKSRuntimeMonitoring: !Ref EnableEKSRuntimeMonitoring
          enableEksAddonManagement: !Ref EnableEKSAddonManagement
          enableLambdaNetworkLogs: !Ref EnableLambdaNetworkLogs
          enableEcsFargateAgentManagement: !Ref EnableEcsFargateAgentManagement
          enableEc2AgentManagement: !Ref EnableEc2AgentManagement

  CreateMembers:
    Condition: GuardDutyAdminAccountIdNotEmpty
    DependsOn: CreatePublishingDestinations
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: guardduty
      ServiceToken: !GetAtt CreateMembersLambda.Arn
      KwArgs:
        DeploymentTargets: !Ref DeploymentTargets
        ExcludeAccount: !If [GuardDutyAdminAccountIdEmpty, !Ref AWS::NoValue, !Ref AWS::AccountId]
        DetectorId: !GetAtt GetDetector.Id

  CreateEventBusRuleGuardDutyFindings:
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: events
      ServiceToken: !GetAtt CreateEventBusRuleGuardDutyFindingsLambda.Arn
      KwArgs:
        Name: !Sub "${ProjectName}-guardduty-findings-rule"
        Description: Trigger Parent Event Bus whenever there is a guardduty finding
        EventPattern:
          source:
          - aws.guardduty
          detail-type:
          - GuardDuty Finding
          detail:
            severity: !Ref GuardDutySeverityLevels
        State: ENABLED
        Targets: [
          {
            'Arn': !Sub 'arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}',
            'Id': !Sub 'guardduty-findings-${AWS::AccountId}',
            'RoleArn': !GetAtt EventBusRoleChild.Arn
          }
        ]

  EventBusRoleChild:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-guardduty-send-finding-events-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - events.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: guardduty-send-finding-events-policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SendEvents
            Effect: Allow
            Action:
            - events:PutEvents
            Resource: !Sub arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}
