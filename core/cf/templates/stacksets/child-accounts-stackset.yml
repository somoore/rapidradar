  SSMTagTemplateGeneratorLambda:
    Condition: CreateTagTemplateGeneratorResources
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-ssm-tag-template-generator"
      Timeout: 300
      Role: !GetAtt SSMTagTemplateGeneratorLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AutomationAccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import json
          import ast
          import time
          import requests
          MAX_RETRY_ATTEMPTS = 5
          DELAY_SECONDS = 3
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              parameter_name = None
              if event_type in ['Create', 'Update']:
                  method=getattr(client, 'put_parameter')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          if key == 'Value':
                              tag_template = {}
                              tag_keys = value.replace(' ', '').split(',')
                              for tag_key in tag_keys:
                                  tag_template[tag_key] = f"< {tag_key.upper()} >"
                              kwargs[key] = json.dumps(tag_template)
                          else:
                              kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  parameter_name = kwargs['Name']
                  retry_attempts = 0
                  delay = DELAY_SECONDS
                  while retry_attempts < MAX_RETRY_ATTEMPTS:
                      try:
                          print(f"...Creating SSM parameter named {parameter_name} with args: {kwargs}")
                          data = method(**kwargs)
                          print({"API_Call": "ssm:PutParameter", "Response": data})
                          status = 'SUCCESS'
                          reason = ''
                          break
                      except client.exceptions.ClientError as error:
                          if retry_attempts < MAX_RETRY_ATTEMPTS:
                              retry_attempts += 1
                              print(f"{str(error)}. Retrying in {delay} seconds...")
                              time.sleep(delay)
                              delay *= 2
                              continue
                          print(str(error))
                          status = 'FAILED'
                          reason = str(error)
                          data = {}
                          break
                      except Exception as e:
                          status = 'FAILED'
                          reason = str(e)
                          data = {}
                          break
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_parameter')
                  parameter_name = event['PhysicalResourceId']
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  try:
                      print(f"...Deleting SSM parameter named {parameter_name}")
                      data = method(Name=parameter_name)
                      print({"API_Call": "ssm:DeleteParameter", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except client.exceptions.ParameterNotFound:
                      print(f"[INFO] SSM paramater named {parameter_name} not found")
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': parameter_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return

