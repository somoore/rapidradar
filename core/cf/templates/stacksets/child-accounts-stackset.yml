  EnableDefaultEBSEncryptionLambdaRole:
    Condition: DefaultEBSEncryptionEnabled
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-enable-default-ebs-encryption-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: BasicLambdaExecutionPolicyForLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: LogsAccess
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
      - PolicyName: EC2WritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: EC2Access
            Effect: Allow
            Action:
            - ec2:GetEbsEncryptionByDefault
            - ec2:EnableEbsEncryptionByDefault
            - ec2:DisableEbsEncryptionByDefault
            Resource: "*"

  EnableDefaultEBSEncryptionLambda:
    Condition: DefaultEBSEncryptionEnabled
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-enable-default-ebs-encryption"
      Timeout: 30
      Role: !GetAtt EnableDefaultEBSEncryptionLambdaRole.Arn
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AutomationAccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import json
          import ast
          import requests
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              data = {}
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              if event_type in ['Create']:
                  method=getattr(client, 'enable_ebs_encryption_by_default')
                  kwargs = {}
                  try:
                      print("...Enabling EBS Encryption by default")
                      data = method(**kwargs)
                      print({"API_Call": "ec2:EnableEbsEncryptionByDefault", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Delete']:
                  method=getattr(client, 'disable_ebs_encryption_by_default')
                  kwargs = {}
                  try:
                      print("...Disabling EBS Encryption by default")
                      data = method()
                      print({"API_Call": "ec2:DisableEbsEncryptionByDefault", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return

  EnableDefaultEBSEncryption:
    Condition: DefaultEBSEncryptionEnabled
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: ec2
      ServiceToken: !GetAtt EnableDefaultEBSEncryptionLambda.Arn

