          import boto3
          import json
          import ast
          import requests
          from botocore.exceptions import ClientError
          def delete_tags(vpc_ids, key, value):
              client = boto3.client('ec2')
              try:
                  client.delete_tags(
                      Resources=vpc_ids,
                      Tags=[{
                          'Key': key,
                          'Value': value
                      }]
                  )
              except Exception as error:
                  print(f"[Exception] {str(error)}")
                  return False
              return True
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              data = {}
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              provider_arn = None
              if event_type in ['Create']:
                  method=getattr(client, 'create_tags')
                  kwargs = {}
                  kwargs['Tags'] = {}
                  for key, value in props['KwArgs'].items():
                      if 'VpcFlowLogsTagKeyValue' == key and '=' in value:
                          tags_key_value = value.split('=')
                          kwargs['Tags'] = [{ 'Key': tags_key_value[0], 'Value': tags_key_value[1] }]
                  provider_arn = '${VpcFlowLogsTagKeyValue}'
                  try:
                      vpcs = client.describe_vpcs()
                      kwargs['Resources'] = [ vpc['VpcId'] for vpc in vpcs['Vpcs'] ]
                      if len(kwargs['Resources']) > 0:
                          print(f"...Creating Tags for VPCs with args: {kwargs}")
                          data = method(**kwargs)
                          print({"API_Call": "ec2:CreateTags", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Update']:
                  method=getattr(client, 'create_tags')
                  provider_arn = event['PhysicalResourceId']
                  kwargs = {}
                  kwargs['Tags'] = {}
                  for key, value in props['KwArgs'].items():
                      if 'VpcFlowLogsTagKeyValue' == key and '=' in value:
                          tags_key_value = value.split('=')
                          kwargs['Tags'] = [{ 'Key': tags_key_value[0], 'Value': tags_key_value[1] }]
                  try:
                      vpcs = client.describe_vpcs()
                      kwargs['Resources'] = [ vpc['VpcId'] for vpc in vpcs['Vpcs'] ]
                      if len(kwargs['Resources']) > 0:
                          if '=' in provider_arn:
                              tags_key_value = provider_arn.split('=')
                              if not delete_tags(kwargs['Resources'], tags_key_value[0], tags_key_value[1]):
                                  print("[ERROR] Could not delete older tags from VPCs")
                          print(f"...Creating Tags for VPCs with args: {kwargs}")
                          data = method(**kwargs)
                          print({"API_Call": "ec2:CreateTags", "Response": data})
                      provider_arn = '${VpcFlowLogsTagKeyValue}'
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_tags')
                  provider_arn = event['PhysicalResourceId']
                  kwargs = {}
                  kwargs['Tags'] = {}
                  for key, value in props['KwArgs'].items():
                      if 'VpcFlowLogsTagKeyValue' == key and '=' in value:
                          tags_key_value = value.split('=')
                          kwargs['Tags'] = [{ 'Key': tags_key_value[0], 'Value': tags_key_value[1] }]
                  try:
                      vpcs = client.describe_vpcs()
                      kwargs['Resources'] = [ vpc['VpcId'] for vpc in vpcs['Vpcs'] ]
                      if len(kwargs['Resources']) > 0:
                          print(f"...Deleting Tags for VPCs with args: {kwargs}")
                          data = method(**kwargs)
                          print({"API_Call": "ec2:DeleteTags", "Response": data})
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
