  DetectUnusedResources:
    Condition: IsEnabledUnusedResourcesDetection
    Type: AWS::Lambda::Function
    Properties:
      Description: Function that detects unused resources daily and sends alerts
      FunctionName: !Sub "${ProjectName}-detect-unused-resources"
      Handler: index.lambda_handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt DetectUnusedResourcesRole.Arn
      Environment:
        Variables:
          UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY: !Ref UnusedResourcesDetectionBypassTagKey
          DISABLE_DETECTION_STOPPED_EC2_INSTANCES: !Ref DisableDetectionStoppedEC2Instances
          DISABLE_DETECTION_UNUSED_SECURITY_GROUPS: !Ref DisableDetectionUnusedSecurityGroups
          DISABLE_DETECTION_UNUSED_EBS_VOLUMES: !Ref DisableDetectionUnusedEBSVolumes
      Code:
        ZipFile: |
          import json
          import re
          from os import getenv
          from time import sleep
          import datetime
          from dateutil.parser import parse
          import boto3
          from botocore.exceptions import ClientError

          MAX_RETRY_ATTEMPTS = 5
          DELAY_SECONDS = 3
          CLOUDTRAIL_THROTTLE_PERIOD = 0.5
          UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY = getenv('UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY')
          DISABLE_DETECTION_STOPPED_EC2_INSTANCES = json.loads(getenv('DISABLE_DETECTION_STOPPED_EC2_INSTANCES'))
          DISABLE_DETECTION_UNUSED_SECURITY_GROUPS = json.loads(getenv('DISABLE_DETECTION_UNUSED_SECURITY_GROUPS'))
          DISABLE_DETECTION_UNUSED_EBS_VOLUMES = json.loads(getenv('DISABLE_DETECTION_UNUSED_EBS_VOLUMES'))
          def lambda_handler(event, context):
              ec2_client = boto3.client('ec2')
              cloudtrail_client = boto3.client('cloudtrail')
              events = boto3.client('events')
              if not DISABLE_DETECTION_STOPPED_EC2_INSTANCES:
                  stopped_instances = get_stopped_instances(ec2_client)
                  print("...Sending events for Unused EC2 Instances")
                  for instance in stopped_instances:
                      instance['ResourceType'] = 'EC2Instance'
                      instance['CreatedBy'], instance['CreatedAt'] = get_resource_details(cloudtrail_client, 'RunInstances', instance['InstanceId'])
                      response = events.put_events(
                          Entries=[{
                              'Source': 'detect-unused-resources',
                              'DetailType': 'Detect Unused Resources',
                              'Detail': json.dumps(instance)
                          }]
                      )
                      print({"API_Call": "events:PutEvents", "Data": json.dumps(instance), "Response": response})
              if not DISABLE_DETECTION_UNUSED_SECURITY_GROUPS:
                  unused_security_groups = get_unused_sgs(ec2_client)
                  print("...Sending events for Unused Security Groups")
                  for sg in unused_security_groups:
                      sg['ResourceType'] = 'SecurityGroup'
                      sg['CreatedBy'], sg['CreatedAt'] = get_resource_details(cloudtrail_client, 'CreateSecurityGroup', sg['GroupId'])
                      response = events.put_events(
                          Entries=[{
                              'Source': 'detect-unused-resources',
                              'DetailType': 'Detect Unused Resources',
                              'Detail': json.dumps(sg)
                          }]
                      )
                      print({"API_Call": "events:PutEvents", "Data": json.dumps(sg), "Response": response})
              if not DISABLE_DETECTION_UNUSED_EBS_VOLUMES:
                  available_volumes = get_avaliable_volumes(ec2_client)
                  print("...Sending events for available EBS Volumes")
                  for vol in available_volumes:
                      vol['ResourceType'] = 'EBSVolume'
                      vol['CreatedBy'], vol['CreatedAt'] = get_resource_details(cloudtrail_client, 'CreateVolume', vol['VolumeId'])
                      response = events.put_events(
                          Entries=[{
                              'Source': 'detect-unused-resources',
                              'DetailType': 'Detect Unused Resources',
                              'Detail': json.dumps(vol)
                          }]
                      )
                      print({"API_Call": "events:PutEvents", "Data": json.dumps(vol), "Response": response})
          def get_stopped_instances(client):
              stopped_instances = []
              try:
                  reservations = client.describe_instances()['Reservations']
                  for reservation in reservations:
                      for instance in reservation['Instances']:
                          if 'State' in instance and instance['State']['Name'] == 'stopped':
                              skip_resource = False
                              if 'Tags' in instance:
                                  for tag in instance['Tags']:
                                      if tag['Key'] == UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY:
                                          skip_resource = True
                              last_stopped_at = get_last_stopped_at_timestamp(instance['StateTransitionReason'])
                              difference = datetime.datetime.now(datetime.timezone.utc) - last_stopped_at
                              hour_diff = int(difference.total_seconds() / 3600)
                              if hour_diff >= 120 and not skip_resource:
                                  stopped_instances.append({'InstanceId': instance['InstanceId'], 'LastStoppedAt': get_cst_cdt_date(last_stopped_at)})
              except Exception as error:
                  print(f"[ERROR] {str(error)}")
              return stopped_instances
          def get_resource_details(client, event_name, resource_id):
              created_by = ''
              created_at = ''
              retry_attempts = 0
              delay = DELAY_SECONDS
              next_token = ''
              base_kwargs = {
                  'LookupAttributes': [{
                      'AttributeKey': 'ResourceName',
                      'AttributeValue': resource_id
                  }]
              }
              while retry_attempts < MAX_RETRY_ATTEMPTS:
                  try:
                      while next_token is not None:
                          kwargs = base_kwargs.copy()
                          if next_token != '':
                              kwargs.update({'NextToken': next_token})
                          response = client.lookup_events(**kwargs)
                          for trail_event in response['Events']:
                              if trail_event['EventName'] == event_name:
                                  if 'Username' in trail_event and 'EventTime' in trail_event:
                                      created_by = trail_event['Username']
                                      created_at = get_cst_cdt_date(trail_event['EventTime'])
                                  break
                          sleep(CLOUDTRAIL_THROTTLE_PERIOD)
                          next_token = response['NextToken'] if 'NextToken' in response else None
                      break
                  except client.exceptions.ClientError as error:
                      if retry_attempts < MAX_RETRY_ATTEMPTS:
                          retry_attempts += 1
                          LOGGER.info("%s. Retrying in %s seconds...", str(error), delay)
                          time.sleep(delay)
                          delay *= 2
                          continue
                      raise error
              return created_by, created_at
          def get_unused_sgs(client):
              unused_group_ids = []
              try:
                  security_groups = client.describe_security_groups()['SecurityGroups']
                  for sg in security_groups:
                      skip_resource = False
                      if 'Tags' in sg:
                          for tag in sg['Tags']:
                              if tag['Key'] == UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY:
                                  skip_resource = True
                      if not skip_resource:
                          result = client.describe_network_interfaces(Filters=[{'Name': 'group-id','Values': [sg['GroupId']]}])['NetworkInterfaces']
                          if len(result) == 0 and sg['GroupName'] != 'default':
                              unused_group_ids.append({'GroupId': sg['GroupId'], 'GroupName': sg['GroupName']})
              except Exception as error:
                  print(f"[ERROR] {str(error)}")
              return unused_group_ids
          def get_avaliable_volumes(client):
              avail_volumes = []
              try:
                  volumes = client.describe_volumes()['Volumes']
                  for vol in volumes:
                      skip_resource = False
                      if 'Tags' in vol:
                          for tag in vol['Tags']:
                              if tag['Key'] == UNUSED_RESOURCES_DETECTION_BYPASS_TAG_KEY:
                                  skip_resource = True
                      if vol['State'] == 'available' and not skip_resource:
                          avail_volumes.append({'VolumeId': vol['VolumeId']})
              except Exception as error:
                  print(f"[ERROR] {str(error)}")
              return avail_volumes
          def get_last_stopped_at_timestamp(timestamp_str):
              last_stopped_at = ''
              re_match = re.search(
                  "([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} [A-Z]{3})",
                  timestamp_str)
              if re_match is not None:
                  last_stopped_at = parse(re_match.group(0))
              return last_stopped_at.astimezone(datetime.timezone.utc)
          def get_cst_cdt_date(timestamp: datetime.datetime):
              cst_offset = datetime.timedelta(hours=-6)
              cdt_offset = datetime.timedelta(hours=-5)
              is_dst = bool(timestamp.dst())
              timezone_abbreviation = ''
              if is_dst:
                  cst_cdt_time = timestamp + cdt_offset
                  timezone_abbreviation = 'CDT'
              else:
                  cst_cdt_time = timestamp + cst_offset
                  timezone_abbreviation = 'CST'
              return cst_cdt_time.strftime(f'%b %d, %Y %I:%M %p {timezone_abbreviation}')

