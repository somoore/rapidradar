  StateManagerDocAssociationWaiterLambdaRole:
    Condition: CreateSSMDocumentResources
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-state-manager-doc-assoc-waiter-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: BasicLambdaExecutionPolicyForLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: LogsAccess
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*
      - PolicyName: SSMReadPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SSMAccess
            Effect: Allow
            Action: ssm:GetDocument
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AutomationAccountId}:document/${SSMDocumentName}"

  StateManagerDocAssociationWaiterLambda:
    Condition: CreateSSMDocumentResources
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-state-manager-doc-assoc-waiter"
      Timeout: 600
      Role: !GetAtt StateManagerDocAssociationWaiterLambdaRole.Arn
      Environment:
        Variables:
          SSM_DOCUMENT: !If [ARNDocument, !Sub "arn:aws:ssm:${AWS::Region}:${AutomationAccountId}:document/${SSMDocumentName}", !Ref SSMDocumentName]
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AutomationAccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import json
          from os import getenv
          import requests
          from time import sleep
          SSM_DOCUMENT = getenv('SSM_DOCUMENT')
          SLEEP_SECONDS = 30
          MAX_RETRY = 10
          def lookup_ssm_document():
              client = boto3.client('ssm')
              try:
                  client.get_document(Name=SSM_DOCUMENT)
                  return True
              except client.exceptions.InvalidDocument:
                  return False
              except Exception as error:
                  print(f"{str(error)}")
                  return False
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              if event_type in ['Create']:
                  retry_count = 0
                  found_ssm_document = lookup_ssm_document()
                  while not found_ssm_document and retry_count != MAX_RETRY:
                      retry_count += 1
                      print(f"Retry attempt: {retry_count}")
                      print(f"Sleeping for {SLEEP_SECONDS} seconds before retry")
                      sleep(SLEEP_SECONDS)
                      found_ssm_document = lookup_ssm_document()
                  if not found_ssm_document:
                      status = 'FAILED'
                      reason = f"SSM Document named {SSM_DOCUMENT} not found."
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return

  StateManagerDocAssociationWaiter:
    Condition: CreateSSMDocumentResources
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: lambda
      ServiceToken: !GetAtt StateManagerDocAssociationWaiterLambda.Arn

  StateManagerDocAssociation:
    Condition: CreateSSMDocumentResources
    DependsOn: StateManagerDocAssociationWaiter
    Type: AWS::SSM::Association
    Properties:
      Name: !If [ARNDocument, !Sub "arn:aws:ssm:${AWS::Region}:${AutomationAccountId}:document/${SSMDocumentName}", !Ref SSMDocumentName]
      MaxConcurrency: !Ref StateManagerMaxConcurrency
      MaxErrors: !Ref StateManagerMaxErrors
      ComplianceSeverity: HIGH
      AssociationName: !Sub "${ProjectName}-automation-document-association"
      Targets:
        - Key: InstanceIds
          Values:
            - "*"

