        ZipFile: |
          import boto3
          from os import getenv
          import json
          import ast
          import requests
          HOME_REGION = getenv('HOME_REGION')
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              old_props = event['OldResourceProperties'] if 'OldResourceProperties' in event else {}
              client=boto3.client(props['Service'], region_name=HOME_REGION)
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              if event_type in ['Create', 'Update']:
                  method=getattr(client, 'invoke')
                  kwargs = {}
                  trigger_lambda = False if old_props else True
                  is_capture_existing_resources_sfn = False
                  is_auto_tagger_sfn = False
                  for key, value in props['KwArgs'].items():
                      try:
                          if key == 'Payload':
                              if 'capture-existing-resources' in value['KwArgs']['stateMachineArn']:
                                  is_capture_existing_resources_sfn = True
                              elif 'auto-tagger' in value['KwArgs']['stateMachineArn']:
                                  is_auto_tagger_sfn = True
                              kwargs[key] = json.dumps(value).encode('utf-8')
                          else:
                              kwargs[key] = ast.literal_eval(value)
                      except Exception:
                          kwargs[key] = value
                  old_kwargs = {}
                  if old_props:
                      for key, value in old_props['KwArgs'].items():
                          try:
                              old_kwargs[key] = ast.literal_eval(value)
                          except Exception:
                              old_kwargs[key] = value
                      if is_capture_existing_resources_sfn:
                          if old_kwargs['AddSupportforCMDB'] == 'false' and kwargs['AddSupportforCMDB'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['AddSupportforIAMKeyPairAccessTracker'] == 'false' and kwargs['AddSupportforIAMKeyPairAccessTracker'] == 'true':
                              trigger_lambda = True
                      if is_auto_tagger_sfn:
                          if old_kwargs['TagVPCs'] == 'false' and kwargs['TagVPCs'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagSubnets'] == 'false' and kwargs['TagSubnets'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEbsVolumes'] == 'false' and kwargs['TagEbsVolumes'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEIPs'] == 'false' and kwargs['TagEIPs'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEbsSnapshots'] == 'false' and kwargs['TagEbsSnapshots'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagAMIs'] == 'false' and kwargs['TagAMIs'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEC2Instances'] == 'false' and kwargs['TagEC2Instances'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEksClusters'] == 'false' and kwargs['TagEksClusters'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagRDSClusterInstances'] == 'false' and kwargs['TagRDSClusterInstances'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagEFS'] == 'false' and kwargs['TagEFS'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagFSX'] == 'false' and kwargs['TagFSX'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagSecrets'] == 'false' and kwargs['TagSecrets'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagBackupPlans'] == 'false' and kwargs['TagBackupPlans'] == 'true':
                              trigger_lambda = True
                          if old_kwargs['TagLoadbalancers'] == 'false' and kwargs['TagLoadbalancers'] == 'true':
                              trigger_lambda = True
                  try:
                      if trigger_lambda:
                          lambda_args = {
                              'FunctionName': kwargs['FunctionName'],
                              'InvocationType': kwargs['InvocationType'],
                              'Payload': kwargs['Payload']
                          }
                          print(f"Triggering cross account Lambda Function for {'capture-existing-resources' if is_capture_existing_resources_sfn else 'autotagger'} SFN with args: {lambda_args}")
                          data = method(**lambda_args)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return

