AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates EventBridge Rules which communicate with Automation Event Bus,
  Creates Cross Account Role

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Configuration
        Parameters:
          - ProjectName
          - IsControlTowerEnabled
          - AutomationAccountId
          - AutomationEventBusName
          - LogArchiveAccountId
          - HomeRegion
          - EnableEBSDefaultEncryption
          - SlackBotTokenProvided
          - StepFunctionExecutorLambdaARN
          - CaptureExistingResourcesSfnARN
          - AutoTaggerSfnARN
      - Label:
          default: VPC FlowLogs
        Parameters:
          - EnableVpcFlowLogs
          - FlowLogsDeliveryBucketPrefix
          - VpcFlowLogsTagKeyValue
      - Label:
          default: CloudTrail Data Trail Configuration
        Parameters:
          - CreateManagementTrail
          - CreateDataTrail
      - Label:
          default: Post Deploy SSM Automation
        Parameters:
          - AddSupportforPostDeploySSMAutomation
          - EnableEC2InstanceConfigurator
          - SSMDocumentName
          - TrackSSMDocumentAssociationFailures
          - StateManagerMaxConcurrency
          - StateManagerMaxErrors
      - Label:
          default: IAM Secret-Access KeyPair Access Tracker Project
        Parameters:
          - AddSupportforIAMKeyPairAccessTracker
      - Label:
          default: CMDB Project
        Parameters:
          - AddSupportforCMDB
          - EnableCostOptimizerRecommendations
      - Label:
          default: Auto-Tagger
        Parameters:
          - TagVPCs
          - TagVPCUsingTagTemplateForTerraformDeployment
          - VPCTagKeysForTagTemplateGeneration
          - TagSubnets
          - TagSubnetUsingTagTemplateForTerraformDeployment
          - SubnetTagKeysForTagTemplateGeneration
          - TagEbsVolumes
          - TagEbsVolumeUsingTagTemplateForTerraformDeployment
          - EbsVolumeTagKeysForTagTemplateGeneration
          - TagEIPs
          - TagEIPUsingTagTemplateForTerraformDeployment
          - EIPTagKeysForTagTemplateGeneration
          - TagEbsSnapshots
          - TagEbsSnapshotUsingTagTemplateForTerraformDeployment
          - EbsSnapshotTagKeysForTagTemplateGeneration
          - TagAMIs
          - TagAMIUsingTagTemplateForTerraformDeployment
          - AMITagKeysForTagTemplateGeneration
          - TagEC2Instances
          - TagEC2InstanceUsingTagTemplateForTerraformDeployment
          - EC2InstanceTagKeysForTagTemplateGeneration
          - TagEksClusters
          - TagEksClusterUsingTagTemplateForTerraformDeployment
          - EksClusterTagKeysForTagTemplateGeneration
          - TagRDSClusterInstances
          - TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment
          - RDSClusterInstanceTagKeysForTagTemplateGeneration
          - TagEFS
          - TagEfsUsingTagTemplateForTerraformDeployment
          - EFSTagKeysForTagTemplateGeneration
          - TagFSX
          - TagFsxUsingTagTemplateForTerraformDeployment
          - FSXTagKeysForTagTemplateGeneration
          - TagSecrets
          - TagSecretUsingTagTemplateForTerraformDeployment
          - SecretTagKeysForTagTemplateGeneration
          - TagBackupPlans
          - TagBackupPlanUsingTagTemplateForTerraformDeployment
          - BackupPlanTagKeysForTagTemplateGeneration
          - TagLoadbalancers
          - TagLoadbalancerUsingTagTemplateForTerraformDeployment
          - LoadbalancerTagKeysForTagTemplateGeneration
      - Label:
          default: Alerts Customization
        Parameters:
          - UnusedResourcesDetectionBypassTagKey
          - DisableDetectionStoppedEC2Instances
          - DisableDetectionUnusedSecurityGroups
          - DisableDetectionUnusedEBSVolumes
    ParameterLabels:
      ProjectName:
        default: Project Name
      IsControlTowerEnabled:
        default: Is Control Tower enabled in your Organization?
      AutomationAccountId:
        default: Automation Account ID
      AutomationEventBusName:
        default: Event Bus Name in Automation Account
      LogArchiveAccountId:
        default: Log Archive account ID (Skip if its a Standalone Deployment)
      HomeRegion:
        default: Home AWS Region
      StepFunctionExecutorLambdaARN:
        default: ARN of StepFunction Executor Lambda Function
      CaptureExistingResourcesSfnARN:
        default: ARN of Capture Existing Active Resources Step Function
      AutoTaggerSfnARN:
        default: ARN of Auto-Tagger Step Function
      EnableEBSDefaultEncryption:
        default: Enable default EBS encryption to use the default KMS key within all provided regions?
      SlackBotTokenProvided:
        default: Slack Bot Token provided for Slack Interactive alerts?
      EnableVpcFlowLogs:
        default: Enable VPC FlowLogs?
      FlowLogsDeliveryBucketPrefix:
        default: Flow Logs Delivery Bucket Prefix
      VpcFlowLogsTagKeyValue:
        default: Tags Key-Value for VPC Flow Logs
      CreateManagementTrail:
        default: Create Management CloudTrail Trail?
      CreateDataTrail:
        default: Create Data CloudTrail Trail?
      AddSupportforPostDeploySSMAutomation:
        default: Enable Post Deploy SSM Automation Project?
      AddSupportforIAMKeyPairAccessTracker:
        default: Deploy IAM Secret-Access KeyPair Access Tracker Project?
      AddSupportforCMDB:
        default: Deploy CMDB Project?
      EnableCostOptimizerRecommendations:
        default: Enable AWS Cost Optimizer Recommendations?
      TagVPCs:
        default: Enable auto-tagger for VPCs?
      TagVPCUsingTagTemplateForTerraformDeployment:
        default: Tag VPCs using SSM Tag Template for Terraform Deployments?
      VPCTagKeysForTagTemplateGeneration:
        default: Tag Keys for VPCs for Tag Template Generation
      TagSubnets:
        default: Enable auto-tagger for Subnets?
      TagSubnetUsingTagTemplateForTerraformDeployment:
        default: Tag Subnets using SSM Tag Template for Terraform Deployments?
      SubnetTagKeysForTagTemplateGeneration:
        default: Tag Keys for Subnets for Tag Template Generation
      TagEbsVolumes:
        default: Enable auto-tagger for EBS Volumes?
      TagEbsVolumeUsingTagTemplateForTerraformDeployment:
        default: Tag EBS Volumes using SSM Tag Template for Terraform Deployments?
      EbsVolumeTagKeysForTagTemplateGeneration:
        default: Tag Keys for EBS Volumes for Tag Template Generation
      TagEIPs:
        default: Enable auto-tagger for Elastic IPs?
      TagEIPUsingTagTemplateForTerraformDeployment:
        default: Tag Elastic IPs using SSM Tag Template for Terraform Deployments?
      EIPTagKeysForTagTemplateGeneration:
        default: Tag Keys for Elastic IPs for Tag Template Generation
      TagEbsSnapshots:
        default: Enable auto-tagger for EBS Snapshots?
      TagEbsSnapshotUsingTagTemplateForTerraformDeployment:
        default: Tag EBS Snapshots using SSM Tag Template for Terraform Deployments?
      EbsSnapshotTagKeysForTagTemplateGeneration:
        default: Tag Keys for EBS Snapshots for Tag Template Generation
      TagAMIs:
        default: Enable auto-tagger for AMIs?
      TagAMIUsingTagTemplateForTerraformDeployment:
        default: Tag AMIs using SSM Tag Template for Terraform Deployments?
      AMITagKeysForTagTemplateGeneration:
        default: Tag Keys for AMIs for Tag Template Generation
      TagEC2Instances:
        default: Enable auto-tagger for EC2 Instances?
      TagEC2InstanceUsingTagTemplateForTerraformDeployment:
        default: Tag EC2 Instances using SSM Tag Template for Terraform Deployments?
      EC2InstanceTagKeysForTagTemplateGeneration:
        default: Tag Keys for EC2 Instances for Tag Template Generation
      TagEksClusters:
        default: Enable auto-tagger for EKS Clusters?
      TagEksClusterUsingTagTemplateForTerraformDeployment:
        default: Tag EKS Clusters using SSM Tag Template for Terraform Deployments?
      EksClusterTagKeysForTagTemplateGeneration:
        default: Tag Keys for EKS Clusters for Tag Template Generation
      TagRDSClusterInstances:
        default: Enable auto-tagger for RDS Clusters and Instances?
      TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment:
        default: Tag RDS Clusters and Instances using SSM Tag Template for Terraform Deployments?
      RDSClusterInstanceTagKeysForTagTemplateGeneration:
        default: Tag Keys for RDS Clusters and Instances for Tag Template Generation
      TagEFS:
        default: Enable auto-tagger for EFS?
      TagEfsUsingTagTemplateForTerraformDeployment:
        default: Tag EFS using SSM Tag Template for Terraform Deployments?
      EFSTagKeysForTagTemplateGeneration:
        default: Tag Keys for EFS for Tag Template Generation
      TagFSX:
        default: Enable auto-tagger for FSX?
      TagFsxUsingTagTemplateForTerraformDeployment:
        default: Tag FSX using SSM Tag Template for Terraform Deployments?
      FSXTagKeysForTagTemplateGeneration:
        default: Tag Keys for FSX for Tag Template Generation
      TagSecrets:
        default: Enable auto-tagger for SecretsManager Secrets?
      TagSecretUsingTagTemplateForTerraformDeployment:
        default: Tag SecretsManager Secret using SSM Tag Template for Terraform Deployments?
      SecretTagKeysForTagTemplateGeneration:
        default: Tag Keys for SecretsManager Secret for Tag Template Generation
      TagBackupPlans:
        default: Enable auto-tagger for Backup Plans?
      TagBackupPlanUsingTagTemplateForTerraformDeployment:
        default: Tag Backup Plans using SSM Tag Template for Terraform Deployments?
      BackupPlanTagKeysForTagTemplateGeneration:
        default: Tag Keys for Backup Plans for Tag Template Generation
      TagLoadbalancers:
        default: Enable auto-tagger for LoadBalancers?
      TagLoadbalancerUsingTagTemplateForTerraformDeployment:
        default: Tag LoadBalancers using SSM Tag Template for Terraform Deployments?
      LoadbalancerTagKeysForTagTemplateGeneration:
        default: Tag Keys for LoadBalancers for Tag Template Generation
      EnableEC2InstanceConfigurator:
        default: Apply Custom Configurations to newly launched EC2 Instances?
      SSMDocumentName:
        default: SSM Document Name
      TrackSSMDocumentAssociationFailures:
        default: Track Failures for SSM Document Association?
      StateManagerMaxConcurrency:
        default: Maximum number of targets allowed to run the association at the same time
      StateManagerMaxErrors:
        default: Number of errors allowed before the system stops sending requests to run the association on additional targets
      UnusedResourcesDetectionBypassTagKey:
        default: Tag Key that needs to be present on unused resources if detection needs to be bypassed
      DisableDetectionStoppedEC2Instances:
        default: Disable detection for stopped EC2 Instances?
      DisableDetectionUnusedSecurityGroups:
        default: Disable detection for unused Security Groups?
      DisableDetectionUnusedEBSVolumes:
        default: Disable detection for unused EBS Volumes?

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    MaxLength: 20
  IsControlTowerEnabled:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if control tower is enabled in your organization
  AutomationAccountId:
    Type: String
    Description: Account Id
    MaxLength: 12
    MinLength: 12
  AutomationEventBusName:
    Description: Name of the Event Bus in the Automation account to which events are sent (see Automation Stack outputs)
    Type: String
    Default: <ProjectName>-eventbus
  LogArchiveAccountId:
    Type: String
    Description: AWS Account ID of the Control Tower Log Archive account.
  HomeRegion:
    Type: String
    Description: AWS Region
  StepFunctionExecutorLambdaARN:
    Type: String
    Description: Lambda Function ARN
  CaptureExistingResourcesSfnARN:
    Type: String
    Description: Step Function ARN
  AutoTaggerSfnARN:
    Type: String
    Description: Step Function ARN
  EnableEBSDefaultEncryption:
    Type: String
    Description: Set to True if you want to enable EBS encryption by default
    AllowedValues:
    - true
    - false
  SlackBotTokenProvided:
    Type: String
    Description: Set to True if slack bot token has been provided for slack interactive alerts
    AllowedValues:
    - true
    - false
  EnableVpcFlowLogs:
    Type: String
    Description: Set to True if you want to enable VPC FlowLogs
    AllowedValues:
    - true
    - false
  FlowLogsDeliveryBucketPrefix:
    Type: String
    Description: Bucket Prefix
  VpcFlowLogsTagKeyValue:
    Type: String
    Description: Tags Key-Value (e.g. Key=Value)
  CreateManagementTrail:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to create management CloudTrail Trail
  CreateDataTrail:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to create data CloudTrail Trail
  AddSupportforPostDeploySSMAutomation:
    Type: String
    Description: Set to True if you want to enable Post Deploy SSM Automation Project
    AllowedValues:
    - true
    - false
  AddSupportforIAMKeyPairAccessTracker:
    Type: String
    Description: Set to True if you want IAM Secret-Access KeyPair Access Tracker project deployed
    AllowedValues:
    - true
    - false
  AddSupportforCMDB:
    Type: String
    Description: Set to True if you want CMDB project deployed
    AllowedValues:
    - true
    - false
  EnableCostOptimizerRecommendations:
    Type: String
    Description: Set to True if you want to enable Cost Optimizer Recommendations for Daily, Weekly and Monthly Cost Reports
    AllowedValues:
    - true
    - false
  TagVPCs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for VPCs on creation
  TagVPCUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag VPCs using SSM tag template if deployment is using Terraform
  VPCTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagSubnets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Subnets on creation
  TagSubnetUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag Subnets using SSM tag template if deployment is using Terraform
  SubnetTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEbsVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Volumes on creation
  TagEbsVolumeUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag EBS Volumes using SSM tag template if deployment is using Terraform
  EbsVolumeTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEIPs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Elastic IPs on allocation
  TagEIPUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag Elastic IPs using SSM tag template if deployment is using Terraform
  EIPTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEbsSnapshots:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Snapshots on creation
  TagEbsSnapshotUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag EBS Snapshots using SSM tag template if deployment is using Terraform
  EbsSnapshotTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagAMIs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for AMIs on creation
  TagAMIUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag AMIs using SSM tag template if deployment is using Terraform
  AMITagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EC2 Instances on launch
  TagEC2InstanceUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag EC2 Instances using SSM tag template if deployment is using Terraform
  EC2InstanceTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEksClusters:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EKS Clusters on creation
  TagEksClusterUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag EKS Clusters using SSM tag template if deployment is using Terraform
  EksClusterTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagRDSClusterInstances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for RDS Clusters and Instances on creation
  TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag RDS Clusters and Instances using SSM tag template if deployment is using Terraform
  RDSClusterInstanceTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagEFS:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EFS on filesystem creation
  TagEfsUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag EFS using SSM tag template if deployment is using Terraform
  EFSTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagFSX:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for FSX on filesystem creation
  TagFsxUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag FSX using SSM tag template if deployment is using Terraform
  FSXTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagSecrets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for SecretsManager on secret creation
  TagSecretUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag SecretsManager Secret using SSM tag template if deployment is using Terraform
  SecretTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagBackupPlans:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Backup Plans on creation
  TagBackupPlanUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag Backup Plans using SSM tag template if deployment is using Terraform
  BackupPlanTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  TagLoadbalancers:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for LoadBalancers on creation
  TagLoadbalancerUsingTagTemplateForTerraformDeployment:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True of you want to auto-tag LoadBalancers using SSM tag template if deployment is using Terraform
  LoadbalancerTagKeysForTagTemplateGeneration:
    Type: String
    Description: Comma Separated Tag Keys
  EnableEC2InstanceConfigurator:
    Type: String
    Description: Set to True if you want to apply custom configurations through SSM Documents for EC2 Instances
    AllowedValues:
    - true
    - false
  SSMDocumentName:
    Description: Name of SSM Document which is to be run automatically based on tags using State Manager
    Type: String
  TrackSSMDocumentAssociationFailures:
    Type: String
    Description: Set to True if you want to track failures for SSM Document Association
    AllowedValues:
    - true
    - false
  StateManagerMaxConcurrency:
    Description: You can specify a number, for example 10, or a percentage of the target set, for example 10%
    Type: String
    Default: '50'
  StateManagerMaxErrors:
    Description: You can specify a number, for example 10, or a percentage of the target set, for example 10%
    Type: String
    Default: 10%
  UnusedResourcesDetectionBypassTagKey:
    Type: String
    Description: Tag Key
  DisableDetectionStoppedEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for stopped EC2 Instances
  DisableDetectionUnusedSecurityGroups:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused Security Groups
  DisableDetectionUnusedEBSVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused EBS Volumes

Conditions:
  ControlTowerDisabled: !Equals
  - !Ref IsControlTowerEnabled
  - false

  ManagementTrailCreation: !And
  - !Equals [ !Ref CreateManagementTrail, true ]
  - !Condition ControlTowerDisabled
  DataTrailCreation: !And
  - !Equals [ !Ref CreateDataTrail, true ]
  - !Condition ControlTowerDisabled

  CreateTrailResources: !Or
  - !Condition ManagementTrailCreation
  - !Condition DataTrailCreation

  CreateSlackActionsCrossAccountRole: !Equals
  - !Ref SlackBotTokenProvided
  - true

  TrackSSMAssociationFailures: !Equals
  - !Ref TrackSSMDocumentAssociationFailures
  - true

  DeploySSMAutomationProject: !Equals
  - !Ref AddSupportforPostDeploySSMAutomation
  - true
  DeployIAMKeyPairAccessTrackerProject: !Equals
  - !Ref AddSupportforIAMKeyPairAccessTracker
  - true
  DeployCMDBProject: !Equals
  - !Ref AddSupportforCMDB
  - true
  DefaultEBSEncryptionEnabled: !Equals
  - !Ref EnableEBSDefaultEncryption
  - true
  FlowLogsEnabled: !Equals
  - !Ref EnableVpcFlowLogs
  - true
  CostOptimizerEnabled: !Equals
  - !Ref EnableCostOptimizerRecommendations
  - true

  IsEnabledUnusedResourcesDetection: !Or
  - !Equals [ !Ref DisableDetectionStoppedEC2Instances, false ]
  - !Equals [ !Ref DisableDetectionUnusedSecurityGroups, false ]
  - !Equals [ !Ref DisableDetectionUnusedEBSVolumes, false ]

  CreateCaptureExistingResourcesRule: !Or
  - !Condition DeployIAMKeyPairAccessTrackerProject
  - !Condition DeployCMDBProject

  AutoTagVPCs: !Equals
  - !Ref TagVPCs
  - true
  AutoTagSubnets: !Equals
  - !Ref TagSubnets
  - true
  AutoTagEbsVolumes: !Equals
  - !Ref TagEbsVolumes
  - true
  AutoTagEIPs: !Equals
  - !Ref TagEIPs
  - true
  AutoTagEbsSnapshots: !Equals
  - !Ref TagEbsSnapshots
  - true
  AutoTagAMIs: !Equals
  - !Ref TagAMIs
  - true
  AutoTagFSX: !Equals
  - !Ref TagFSX
  - true
  AutoTagSecrets: !Equals
  - !Ref TagSecrets
  - true
  AutoTagBackupPlans: !Equals
  - !Ref TagBackupPlans
  - true
  AutoTagLoadbalancers: !Equals
  - !Ref TagLoadbalancers
  - true
  AutoTagEC2Instances: !Equals
  - !Ref TagEC2Instances
  - true
  AutoTagEKSClusters: !Equals
  - !Ref TagEksClusters
  - true
  AutoTagRDSClustersInstances: !Equals
  - !Ref TagRDSClusterInstances
  - true
  AutoTagEFS: !Equals
  - !Ref TagEFS
  - true
  CreateAutoTaggerResources0: !Or
  - !Condition AutoTagVPCs
  - !Condition AutoTagSubnets
  - !Condition AutoTagEbsVolumes
  - !Condition AutoTagEIPs
  - !Condition AutoTagEbsSnapshots
  - !Condition AutoTagAMIs
  - !Condition AutoTagEC2Instances
  - !Condition AutoTagEKSClusters
  - !Condition AutoTagRDSClustersInstances
  - !Condition AutoTagEFS
  CreateAutoTaggerResources1: !Or
  - !Condition AutoTagFSX
  - !Condition AutoTagSecrets
  - !Condition AutoTagBackupPlans
  - !Condition AutoTagLoadbalancers

  CreateAutoTaggerResources: !Or
  - !Condition CreateAutoTaggerResources0
  - !Condition CreateAutoTaggerResources1
  CreateCommonResource: !Or
  - !Condition DeployCMDBProject
  - !Condition CreateAutoTaggerResources
  - !Condition DeployIAMKeyPairAccessTrackerProject

  CreateVpcTagTemplate: !Equals
  - !Ref TagVPCUsingTagTemplateForTerraformDeployment
  - true
  CreateSubnetTagTemplate: !Equals
  - !Ref TagSubnetUsingTagTemplateForTerraformDeployment
  - true
  CreateEbsVolumeTagTemplate: !Equals
  - !Ref TagEbsVolumeUsingTagTemplateForTerraformDeployment
  - true
  CreateEIPTagTemplate: !Equals
  - !Ref TagEIPUsingTagTemplateForTerraformDeployment
  - true
  CreateEbsSnapshotTagTemplate: !Equals
  - !Ref TagEbsSnapshotUsingTagTemplateForTerraformDeployment
  - true
  CreateAMITagTemplate: !Equals
  - !Ref TagAMIUsingTagTemplateForTerraformDeployment
  - true
  CreateEC2InstanceTagTemplate: !Equals
  - !Ref TagEC2InstanceUsingTagTemplateForTerraformDeployment
  - true
  CreateEksClusterTagTemplate: !Equals
  - !Ref TagEksClusterUsingTagTemplateForTerraformDeployment
  - true
  CreateRdsTagTemplate: !Equals
  - !Ref TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment
  - true
  CreateEfsTagTemplate: !Equals
  - !Ref TagEfsUsingTagTemplateForTerraformDeployment
  - true
  CreateFsxTagTemplate: !Equals
  - !Ref TagFsxUsingTagTemplateForTerraformDeployment
  - true
  CreateSecretsTagTemplate: !Equals
  - !Ref TagSecretUsingTagTemplateForTerraformDeployment
  - true
  CreateBackupPlanTagTemplate: !Equals
  - !Ref TagBackupPlanUsingTagTemplateForTerraformDeployment
  - true
  CreateLoadBalancerTagTemplate: !Equals
  - !Ref TagLoadbalancerUsingTagTemplateForTerraformDeployment
  - true
  ARNDocument:
    Fn::Not:
      - Fn::Equals:
          - !Ref AutomationAccountId
          - !Ref AWS::AccountId
  ApplyEC2InstancesConfigurations: !Equals
  - !Ref EnableEC2InstanceConfigurator
  - true

  CreateSSMDocumentResources: !And
  - !Condition DeploySSMAutomationProject
  - !Condition ApplyEC2InstancesConfigurations

  CreateTagTemplateGeneratorResources0: !Or
  - !Condition CreateVpcTagTemplate
  - !Condition CreateSubnetTagTemplate
  - !Condition CreateEbsVolumeTagTemplate
  - !Condition CreateEIPTagTemplate
  - !Condition CreateEbsSnapshotTagTemplate
  - !Condition CreateAMITagTemplate
  - !Condition CreateEC2InstanceTagTemplate
  - !Condition CreateEksClusterTagTemplate
  - !Condition CreateRdsTagTemplate
  - !Condition CreateEfsTagTemplate
  CreateTagTemplateGeneratorResources1: !Or
  - !Condition CreateFsxTagTemplate
  - !Condition CreateSecretsTagTemplate
  - !Condition CreateBackupPlanTagTemplate
  - !Condition CreateLoadBalancerTagTemplate

  CreateTagTemplateGeneratorResources: !Or
  - !Condition CreateTagTemplateGeneratorResources0
  - !Condition CreateTagTemplateGeneratorResources1

Resources:
  CloudTrailLogGroup:
    Condition: CreateTrailResources
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "${ProjectName}/CloudtrailLogs"
      RetentionInDays: 365

  CloudTrailLogsBucket:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: CreateTrailResources
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}-cloudtrail-logs"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudTrailLogsBucketPolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: CreateTrailResources
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
            - !GetAtt CloudTrailLogsBucket.Arn
            - !Sub "${CloudTrailLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AWSCloudTrailBucketExistenceCheck
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "s3:ListBucket"
            Resource: !GetAtt CloudTrailLogsBucket.Arn
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "s3:GetBucketAcl"
            Resource: !GetAtt CloudTrailLogsBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailLogsBucket.Arn}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  CloudTrailRole:
    DependsOn: CloudTrailLogsBucketPolicy
    Condition: CreateTrailResources
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-cloudtrail-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: "Allow"
          Principal:
            Service:
            - cloudtrail.amazonaws.com
          Action:
            - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: CloudTrailRolePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: CloudTrailAccess
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:*:*:log-group:${CloudTrailLogGroup}:*"

  Trail:
    Condition: CreateTrailResources
    Type: AWS::CloudTrail::Trail
    Properties:
      EventSelectors:
        - Fn::If:
            - DataTrailCreation
            - DataResources:
                - Type: AWS::S3::Object
                  Values:
                    - "arn:aws:s3"
              IncludeManagementEvents: false
              ReadWriteType: WriteOnly
            - !Ref AWS::NoValue
        - Fn::If:
            - ManagementTrailCreation
            - IncludeManagementEvents: true
              ReadWriteType: All
            - !Ref AWS::NoValue
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: false
      IsOrganizationTrail: false
      S3BucketName: !Ref CloudTrailLogsBucket
      S3KeyPrefix: !Ref AWS::AccountId
      TrailName: !Sub "${ProjectName}-${AWS::AccountId}-trail"
      CloudWatchLogsLogGroupArn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${CloudTrailLogGroup}:*"
      CloudWatchLogsRoleArn: !GetAtt CloudTrailRole.Arn

  EventBusRuleChildEC2ResourcesManager:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ec2-resources-manager"
      Description: Trigger Automation EventBus whenever an EC2 Resource is created/modfied/deleted
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - ec2.amazonaws.com
          eventName:
            - AuthorizeSecurityGroupIngress
            - ModifySecurityGroupRules
            - ModifyNetworkInterfaceAttribute
            - CreateSecurityGroup
            - DeleteSecurityGroup
            - RunInstances
            - !If [ DeployCMDBProject, TerminateInstances, !Ref AWS::NoValue ]
            - !If [ DeploySSMAutomationProject, AssociateIamInstanceProfile, !Ref AWS::NoValue ]
            - !If [ DeploySSMAutomationProject, ReplaceIamInstanceProfileAssociation, !Ref AWS::NoValue ]
            - !If [ DeploySSMAutomationProject, DisassociateIamInstanceProfile, !Ref AWS::NoValue ]
            - CreateVpc
            - CreateSubnet
            - CreateVolume
            - AllocateAddress
            - AssociateAddress
            - CreateSnapshot
            - ModifySnapshotAttribute
            - ModifyImageAttribute
            - CreateImage
            - CreateTags
            - DeleteTags
      State: ENABLED
      Targets: [
        {
          'Arn': !Sub 'arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}',
          'Id': !Sub 'ec2-resources-manager-${AWS::AccountId}',
          'RoleArn': !GetAtt EventBusRoleChild.Arn
