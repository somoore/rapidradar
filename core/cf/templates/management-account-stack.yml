        }
      ]

  EventBusRuleManagementSSOUserLogin:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-sso-user-login-detection"
      Description: Trigger Automation EventBus whenever an SSO User logs in
      EventPattern:
        source:
          - aws.sso
        detail-type:
          - AWS Service Event via CloudTrail
        detail:
          eventSource:
            - sso.amazonaws.com
          eventName:
            - Authenticate
      State: ENABLED
      Targets: [
        {
          'Arn': !Sub 'arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}',
          'Id': !Sub 'sso-user-login-${AWS::AccountId}',
          'RoleArn': !GetAtt EventBusRoleManagement.Arn
        }
      ]

  EventBusRuleManagementOrgAccountCreation:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-org-aws-account-creation"
      Description: Trigger Automation EventBus whenever a new AWS Account is created through AWS Organizations
      EventPattern:
        source:
          - aws.organizations
        detail-type:
          - AWS Service Event via CloudTrail
        detail:
          eventSource:
            - organizations.amazonaws.com
          eventName:
            - CreateAccountResult
          serviceEventDetails:
            createAccountStatus:
              state:
              - SUCCEEDED
      State: ENABLED
      Targets: [
        {
          'Arn': !Sub 'arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}',
          'Id': !Sub 'org-aws-account-creation-${AWS::AccountId}',
          'RoleArn': !GetAtt EventBusRoleManagement.Arn
        }
      ]

  EventBusRuleManagementCTAccountCreation:
    Condition: ControlTowerEnabled
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ct-aws-account-creation"
      Description: Trigger Automation EventBus whenever a new AWS Account is created through AWS Control Tower Account Factory
      EventPattern:
        source:
          - aws.controltower
        detail-type:
          - AWS Service Event via CloudTrail
        detail:
          eventSource:
            - controltower.amazonaws.com
          eventName:
            - CreateManagedAccount
          serviceEventDetails:
            createManagedAccountStatus:
              state:
              - SUCCEEDED
      State: ENABLED
      Targets: [
        {
          'Arn': !Sub 'arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}',
          'Id': !Sub 'ct-aws-account-creation-${AWS::AccountId}',
          'RoleArn': !GetAtt EventBusRoleManagement.Arn
        }
      ]

  EventBusRoleManagement:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-send-automation-events"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - events.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: EventsAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SendEvents
            Effect: Allow
            Action:
            - events:PutEvents
            Resource: !Sub arn:aws:events:us-east-1:${AutomationAccountId}:event-bus/${AutomationEventBusName}

  AttachSCPPoliciesToOrg:
    Condition: CreateBlockResourcesSCP
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: organizations
      ServiceToken: !GetAtt OrgScpAttachmentLambda.Arn
      KwArgs:
        PolicyId: !GetAtt DenyServicesActionsSCP.Ids
        TargetId: !Ref DeploymentTargets
        ExcludeAccounts: !Ref ExcludeAccounts

Outputs:
  SSOCrossAccountRoleArn:
    Description: ARN of SSO Cross Account Role
    Value: !GetAtt SSOCrossAccountAssumeRole.Arn
  ServiceControlPolicyIds:
    Condition: CreateBlockResourcesSCP
    Description: IDs of Service Control Policies
    Value: !GetAtt DenyServicesActionsSCP.Ids