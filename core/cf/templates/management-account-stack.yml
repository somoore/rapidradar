  DenyServicesActionsSCP:
    Condition: CreateBlockResourcesSCP
    Type: 'AWS::CloudFormation::CustomResource'
    Properties:
      Service: organizations
      ServiceToken: !GetAtt OrgPolicyCreatorLambda.Arn
      KwArgs:
        Name: !Sub "${ProjectName}-deny-services-actions"
        Description: >
          This SCP denies some services' actions if certain conditions are not met.
        Type: SERVICE_CONTROL_POLICY
        Content:
          Version: "2012-10-17"
          Statement:
          - Fn::If:
            - CreateBlockEC2LaunchWithoutIMDSV2SCP
            - Sid: "DenyRunInstancesWithoutIMDSV2"
              Effect: "Deny"
              Action:
              - "ec2:RunInstances"
              Resource:
              - "arn:aws:ec2:*:*:instance/*"
              Condition: {
                "StringNotEquals": {"ec2:MetadataHttpTokens": "required"},
                "ForAllValues:StringNotEquals": {"aws:TagKeys": [!Ref SCPBypassTagKeyEC2LaunchWithoutIMDSV2]}
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockEC2LaunchWithPublicIPSCP
            - Sid: "DenyRunInstancesWithPublicIp"
              Effect: "Deny"
              Action:
              - "ec2:RunInstances"
              Resource:
              - "arn:aws:ec2:*:*:instance/*"
              - "arn:aws:ec2:*:*:network-interface/*"
              Condition: {
                "Bool": { "ec2:AssociatePublicIpAddress": "true" },
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyEC2LaunchWithPublicIP] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockEC2LaunchWithoutCertainTagsSCP
            - Sid: "DenyRunInstancesWithoutTags"
              Effect: "Deny"
              Action: "ec2:RunInstances"
              Resource: "arn:aws:ec2:*:*:instance/*"
              Condition: {
                "Custom:TrueIfAllTagsPresent": { # Custom Condition (multiple statements get created on the basis of aws:TagKeys array with condition operator 'ForAllValues:StringNotEquals')
                  "aws:TagKeys": !Ref EC2InstanceLaunchSCPTagKeys
                }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockEksClusterCreationWithoutCertainTagsSCP
            - Sid: "DenyEksCreateClusterWithoutTags"
              Effect: "Deny"
              Action: "eks:CreateCluster"
              Resource: "arn:aws:eks:*:*:cluster/*"
              Condition: {
                "Custom:TrueIfAllTagsPresent": { # Custom Condition (multiple statements get created on the basis of aws:TagKeys array with condition operator 'ForAllValues:StringNotEquals')
                  "aws:TagKeys": !Ref EksClusterCreationSCPTagKeys
                }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockRdsClusterInstanceCreationWithoutCertainTagsSCP
            - Sid: "DenyRdsCreateDBClusterInstanceWithoutTags"
              Effect: "Deny"
              Action:
              - "rds:CreateDBCluster"
              - "rds:CreateDBInstance"
              Resource:
              - "arn:aws:rds:*:*:cluster:*"
              - "arn:aws:rds:*:*:db:*"
              Condition: {
                "Custom:TrueIfAllTagsPresent": { # Custom Condition (multiple statements get created on the basis of aws:TagKeys array with condition operator 'ForAllValues:StringNotEquals')
                  "aws:TagKeys": !Ref RdsClusterInstanceCreationSCPTagKeys
                }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockEfsFileSystemCreationWithoutCertainTagsSCP
            - Sid: "DenyEfsCreateFileSystemWithoutTags"
              Effect: "Deny"
              Action: "elasticfilesystem:CreateFileSystem"
              Resource: "arn:aws:elasticfilesystem:*:*:file-system/*"
              Condition: {
                "Custom:TrueIfAllTagsPresent": { # Custom Condition (multiple statements get created on the basis of aws:TagKeys array with condition operator 'ForAllValues:StringNotEquals')
                  "aws:TagKeys": !Ref EfsFileSystemCreationSCPTagKeys
                }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockUnencryptedEBSVolumeCreationSCP
            - Sid: "DenyRunInstancesWithUnencryptedVol"
              Effect: "Deny"
              Action:
              - "ec2:RunInstances"
              Resource:
              - "arn:aws:ec2:*:*:instance/*"
              - "arn:aws:ec2:*:*:volume/*"
              Condition: {
                "Bool": {
                  "ec2:Encrypted": "false"
                },
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyEBSVolumeCreation] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockUnencryptedEBSVolumeCreationSCP
            - Sid: "DenyCreateVolumeWithoutEncryption"
              Effect: "Deny"
              Action: "ec2:CreateVolume"
              Resource: "*"
              Condition: {
                "Bool": { "ec2:Encrypted": "false" },
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyEBSVolumeCreation] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockLoadBalancerCreationSCP
            - Sid: "DenyCreateLoadBalancerWithoutBypassTag"
              Effect: "Deny"
              Action: "elasticloadbalancing:CreateLoadBalancer"
              Resource: "arn:aws:elasticloadbalancing:*:*:loadbalancer/*"
              Condition: {
                "ForAllValues:StringNotEquals": {"aws:TagKeys": [!Ref SCPBypassTagKeyLoadBalancerCreation]}
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockEIPAllocationSCP
            - Sid: "DenyAllocateEIPWithoutBypassTag"
              Effect: "Deny"
              Action:
              - "ec2:AllocateAddress"
              Resource:
              - "arn:aws:ec2:*:*:elastic-ip/*"
              Condition: {
                "ForAllValues:StringNotEquals": {"aws:TagKeys": [!Ref SCPBypassTagKeyEIPAllocation]}
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockMakeEBSSnapshotPublicSCP
            - Sid: "DenyMakeSnapshotPublic"
              Effect: "Deny"
              Action: "ec2:ModifySnapshotAttribute"
              Resource: "arn:aws:ec2:*::snapshot/*"
              Condition: {
                "StringEquals": { "ec2:Add/group": "all" }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockUnencryptedRDSCreationSCP
            - Sid: "DenyCreateRDSInstanceWithoutEncryption"
              Effect: "Deny"
              Action: "rds:CreateDBInstance"
              Resource: "*"
              Condition: {
                "StringNotLike": { "rds:DatabaseEngine": "aurora*" },
                "Bool": { "rds:StorageEncrypted": "false" },
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyUnencryptedRDSCreation] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockUnencryptedRDSCreationSCP
            - Sid: "DenyCreateRDSClusterWithoutEncryption"
              Effect: "Deny"
              Action: "rds:CreateDBCluster"
              Resource: "*"
              Condition: {
                "Bool": { "rds:StorageEncrypted": "false" },
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyUnencryptedRDSCreation] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockIAMUsersCreationSCP
            - Sid: "DenyCreateIAMUser"
              Effect: "Deny"
              Action: "iam:CreateUser"
              Resource: "*"
              Condition: {
                "ForAllValues:StringNotEquals": { "aws:TagKeys": [!Ref SCPBypassTagKeyIAMUsersCreation] }
              }
            - !Ref AWS::NoValue
          - Fn::If:
            - CreateBlockIAMUserCreationWithoutCertainTagsSCP
            - Sid: "DenyCreateIAMUserWithoutTags"
              Effect: "Deny"
              Action: "iam:CreateUser"
              Resource: "*"
              Condition: {
                "Custom:TrueIfAllTagsPresent": { # Custom Condition (multiple statements get created on the basis of aws:TagKeys array with condition operator 'ForAllValues:StringNotEquals')
                  "aws:TagKeys": !Ref IAMUsersCreationSCPTagKeys
                }
              }
            - !Ref AWS::NoValue

