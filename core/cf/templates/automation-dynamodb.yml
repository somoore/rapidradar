  RootIAMLoginsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-root-iam-logins"
      AttributeDefinitions:
      - AttributeName: event_id
        AttributeType: 'S'
      - AttributeName: account_id
        AttributeType: 'S'
      - AttributeName: ip_address
        AttributeType: 'S'
      - AttributeName: user
        AttributeType: 'S'
      - AttributeName: status
        AttributeType: 'S'
      KeySchema:
      - AttributeName: event_id
        KeyType: HASH
      - AttributeName: account_id
        KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AccountIPIndex
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
            - AttributeName: ip_address
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
        - IndexName: UserStatusIndex
          KeySchema:
            - AttributeName: user
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
