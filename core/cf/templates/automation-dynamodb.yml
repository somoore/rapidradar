      ScalingTargetId: !Ref UnusedEBSVolumesTableReadCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  UnusedEBSVolumesTableWriteScalingPolicy:
    Condition: IsEnabledUnusedEBSVolumesDetection
