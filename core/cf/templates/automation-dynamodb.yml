  S3BucketsTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${S3BucketsTable}-read-autoscaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref S3BucketsTableReadCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  S3BucketsTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${S3BucketsTable}-write-autoscaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref S3BucketsTableWriteCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
