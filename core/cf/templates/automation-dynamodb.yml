  UnusedEBSVolumesTableReadCapacityScalableTarget:
    Condition: IsEnabledUnusedEBSVolumesDetection
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${UnusedEBSVolumesTable}"
