AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates DynamoDB Tables

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Configuration
        Parameters:
          - ProjectName
      - Label:
          default: Post Deploy SSM Automation
        Parameters:
          - TrackSSMDocumentAssociationFailures
      - Label:
          default: IAM Secret-Access KeyPair Access Tracker Project
        Parameters:
          - AddSupportforIAMKeyPairAccessTracker
      - Label:
          default: CMDB Project
        Parameters:
          - AddSupportforCMDB
      - Label:
          default: IP Tracker Project
        Parameters:
          - AddSupportforIPTracker
      - Label:
          default: Alerts Customization
        Parameters:
          - DisableDetectionStoppedEC2Instances
          - DisableDetectionUnusedSecurityGroups
          - DisableDetectionUnusedEBSVolumes
    ParameterLabels:
      ProjectName:
        default: Project Name
      TrackSSMDocumentAssociationFailures:
        default: Track Failures for SSM Document Association?
      AddSupportforIAMKeyPairAccessTracker:
        default: Deploy IAM Secret-Access KeyPair Access Tracker Project?
      AddSupportforCMDB:
        default: Deploy CMDB Project?
      AddSupportforIPTracker:
        default: Deploy IP Tracker Project?
      DisableDetectionStoppedEC2Instances:
        default: Disable detection for stopped EC2 Instances?
      DisableDetectionUnusedSecurityGroups:
        default: Disable detection for unused Security Groups?
      DisableDetectionUnusedEBSVolumes:
        default: Disable detection for unused EBS Volumes?

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    MaxLength: 20
  TrackSSMDocumentAssociationFailures:
    Type: String
    Description: Set to True if you want to track failures for SSM Document Association
    AllowedValues:
    - true
    - false
  AddSupportforIAMKeyPairAccessTracker:
    Type: String
    Description: Set to True if you want IAM Secret-Access KeyPair Access Tracker project deployed
    AllowedValues:
    - true
    - false
  AddSupportforCMDB:
    Type: String
    Description: Set to True if you want CMDB project deployed
    AllowedValues:
    - true
    - false
  AddSupportforIPTracker:
    Type: String
    Description: Set to True if you want IP Tracker project deployed
    AllowedValues:
    - true
    - false
  DisableDetectionStoppedEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for stopped EC2 Instances
  DisableDetectionUnusedSecurityGroups:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused Security Groups
  DisableDetectionUnusedEBSVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused EBS Volumes

Conditions:
  TrackSSMAssociationFailures: !Equals
  - !Ref TrackSSMDocumentAssociationFailures
  - true
  DeployIAMKeyPairAccessTrackerProject: !Equals
  - !Ref AddSupportforIAMKeyPairAccessTracker
  - true
  DeployCMDBProject: !Equals
  - !Ref AddSupportforCMDB
  - true
  DeployIPTrackerProject: !Equals
  - !Ref AddSupportforIPTracker
  - true

  IsEnabledStoppedEC2InstancesDetection: !Equals
  - !Ref DisableDetectionStoppedEC2Instances
  - false
  IsEnabledUnusedSecurityGroupsDetection: !Equals
  - !Ref DisableDetectionUnusedSecurityGroups
  - false
  IsEnabledUnusedEBSVolumesDetection: !Equals
  - !Ref DisableDetectionUnusedEBSVolumes
  - false

Resources:
  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAutoscalingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                Resource:
                - !Sub "${SecurityGroupTable.Arn}*"
                - !GetAtt IAMUsersTable.Arn
                - !GetAtt S3BucketsTable.Arn
                - !Sub "${RootIAMLoginsTable.Arn}*"
                - !If [ IsEnabledStoppedEC2InstancesDetection, !GetAtt UnusedEC2InstancesTable.Arn, !Ref AWS::NoValue ]
                - !If [ IsEnabledUnusedSecurityGroupsDetection, !GetAtt UnusedSecurityGroupsTable.Arn, !Ref AWS::NoValue ]
                - !If [ IsEnabledUnusedEBSVolumesDetection, !GetAtt UnusedEBSVolumesTable.Arn, !Ref AWS::NoValue ]
                - !GetAtt RemediatedResourcesTable.Arn
                - !If [ DeployCMDBProject, !Sub "${ActiveResourcesTable.Arn}*", !Ref AWS::NoValue ]
                - !If [ DeployCMDBProject, !GetAtt DeletedResourcesTable.Arn, !Ref AWS::NoValue ]
                - !If [ DeployCMDBProject, !GetAtt WeeklyUserCostReportsTable.Arn, !Ref AWS::NoValue ]
                - !If [ DeployCMDBProject, !GetAtt DailyUserCostReportsTable.Arn, !Ref AWS::NoValue ]
                - !If [ DeployCMDBProject, !GetAtt MonthlyUserCostReportsTable.Arn, !Ref AWS::NoValue ]
                - !If [ DeployIPTrackerProject, !Sub "${IPCorrelationTable.Arn}*", !Ref AWS::NoValue ]
                - !If [ DeployIPTrackerProject, !Sub "${SSOUserIPHistoryTable.Arn}*", !Ref AWS::NoValue ]
                - !If [ DeployIAMKeyPairAccessTrackerProject, !Sub "${IAMKeyPairAccessTrackerTable.Arn}*", !Ref AWS::NoValue ]
                - !If [ TrackSSMAssociationFailures, !Sub "${SSMDocumentAssociationFailureTrackerTable.Arn}*", !Ref AWS::NoValue ]
              - Effect: Allow
                Action: application-autoscaling:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:SetAlarmState
                  - cloudwatch:DeleteAlarms
                Resource: "*"

  SecurityGroupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-security-groups"
      AttributeDefinitions:
      - AttributeName: account_id
        AttributeType: 'S'
      - AttributeName: security_group_id
        AttributeType: 'S'
      KeySchema:
      - AttributeName: account_id
        KeyType: HASH
      - AttributeName: security_group_id
        KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SecurityGroupIndex
          KeySchema:
            - AttributeName: security_group_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  SecurityGroupTableReadCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${SecurityGroupTable}"
      ScalableDimension: dynamodb:table:ReadCapacityUnits
      MinCapacity: 1
      MaxCapacity: 80
      RoleARN: !GetAtt AutoScalingRole.Arn

  SecurityGroupTableReadCapacityScalableTargetGSI:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${SecurityGroupTable}/index/SecurityGroupIndex"
      ScalableDimension: dynamodb:index:ReadCapacityUnits
      MinCapacity: 1
      MaxCapacity: 80
      RoleARN: !GetAtt AutoScalingRole.Arn

  SecurityGroupTableWriteCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${SecurityGroupTable}"
      ScalableDimension: dynamodb:table:WriteCapacityUnits
      MinCapacity: 1
      MaxCapacity: 80
      RoleARN: !GetAtt AutoScalingRole.Arn

  SecurityGroupTableWriteCapacityScalableTargetGSI:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${SecurityGroupTable}/index/SecurityGroupIndex"
      ScalableDimension: dynamodb:index:WriteCapacityUnits
      MinCapacity: 1
      MaxCapacity: 80
      RoleARN: !GetAtt AutoScalingRole.Arn

  SecurityGroupTableReadScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${SecurityGroupTable}-read-autoscaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SecurityGroupTableReadCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  SecurityGroupTableReadScalingPolicyGSI:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${SecurityGroupTable}-read-autoscaling-policy-gsi
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SecurityGroupTableReadCapacityScalableTargetGSI
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBReadCapacityUtilization

  SecurityGroupTableWriteScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${SecurityGroupTable}-write-autoscaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SecurityGroupTableWriteCapacityScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization

  SecurityGroupTableWriteScalingPolicyGSI:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${SecurityGroupTable}-write-autoscaling-policy-gsi
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SecurityGroupTableWriteCapacityScalableTargetGSI
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: DynamoDBWriteCapacityUtilization

  IAMUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-iam-users"
      AttributeDefinitions:
      - AttributeName: account_id
        AttributeType: 'S'
      - AttributeName: iam_user
        AttributeType: 'S'
      KeySchema:
      - AttributeName: account_id
        KeyType: HASH
      - AttributeName: iam_user
        KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  IAMUsersTableReadCapacityScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: dynamodb
      ResourceId: !Sub "table/${IAMUsersTable}"
      ScalableDimension: dynamodb:table:ReadCapacityUnits
