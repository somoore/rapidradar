  SSMDocumentAssociationFailureTrackerTable:
    Condition: TrackSSMAssociationFailures
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-ssm-doc-assoc-failure-tracker"
      AttributeDefinitions:
      - AttributeName: ssm_document_name
        AttributeType: 'S'
      - AttributeName: instance_id
        AttributeType: 'S'
      KeySchema:
      - AttributeName: ssm_document_name
        KeyType: HASH
      - AttributeName: instance_id
        KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EC2InstanceIndex
          KeySchema:
            - AttributeName: instance_id
