AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates Lambda Functions to be used as triggers by EventBridge Rules, StepFunctions and Custom Resources
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Configuration
        Parameters:
          - ProjectName
          - ManagementAccountId
          - EnableGuardDuty
      - Label:
          default: VPC FlowLogs
        Parameters:
          - EnableVpcFlowLogs
          - FlowLogsDeliveryBucketPrefix
          - VpcFlowLogsTagKeyValue
      - Label:
          default: DynamoDB Tables
        Parameters:
          - SecurityGroupTableName
          - IAMUsersTableName
          - S3BucketsTableName
          - RootIAMLoginsTableName
          - UnusedEC2InstancesTableName
          - UnusedSecurityGroupsTableName
          - UnusedEBSVolumesTableName
          - RemediatedResourcesTableName
          - ActiveResourcesTableName
          - DeletedResourcesTableName
          - DailyUserCostReportsTableName
          - WeeklyUserCostReportsTableName
          - MonthlyUserCostReportsTableName
          - IPCorrelationTableName
          - SSOUserIPHistoryTableName
          - IAMKeyPairAccessTrackerTableName
          - SSMDocumentAssociationFailureTrackerTableName
      - Label:
          default: Post Deploy SSM Automation
        Parameters:
          - AutoAttachIAMRoleEC2
          - ExistingEC2SSMIAMRoleName
          - AutoAttachMissingPolicies
          - NamesOfAdditionalPoliciesToAutoAttach
          - CreateNewManagedPolicy
          - ManagedPolicyName
          - EnableEC2InstanceConfigurator
          - SSMDocumentName
          - TrackSSMDocumentAssociationFailures
          - CreatePagerDutyIncidentsForSSMFailures
          - EnableHourlySSMFailureReminders
      - Label:
          default: IAM Secret-Access KeyPair Access Tracker Project
        Parameters:
          - AddSupportforIAMKeyPairAccessTracker
      - Label:
          default: CMDB Project
        Parameters:
          - AddSupportforCMDB
          - EnableCostOptimizerRecommendations
      - Label:
          default: IP Tracker Project
        Parameters:
          - AddSupportforIPTracker
          - TrackTailscaleIPs
          - TailnetName
          - OAuthClientId
          - OAuthClientSecretSSM
      - Label:
          default: What SCPs have you deployed in management account?
        Parameters:
          - BlockEC2LaunchWithoutCertainTags
          - EC2InstanceLaunchSCPTagKeys
          - BlockEksClusterCreationWithoutCertainTags
          - EksClusterCreationSCPTagKeys
          - BlockRdsClusterInstanceCreationWithoutCertainTags
          - RdsClusterInstanceCreationSCPTagKeys
          - BlockEfsFileSystemCreationWithoutCertainTags
          - EfsFileSystemCreationSCPTagKeys
          - BlockEC2LaunchWithoutIMDSV2
          - SCPBypassTagKeyEC2LaunchWithoutIMDSV2
          - AlertOnEC2LaunchIMDSV2Bypass
          - BlockEC2LaunchWithPublicIP
          - SCPBypassTagKeyEC2LaunchWithPublicIP
          - AlertOnEC2LaunchPublicIPBypass
          - BlockUnencryptedEBSVolumeCreation
          - SCPBypassTagKeyEBSVolumeCreation
          - AlertOnUnencryptedEBSVolumeCreationBypass
          - BlockLoadBalancerCreation
          - SCPBypassTagKeyLoadBalancerCreation
          - AlertOnLoadBalancerCreationBypass
          - BlockEIPAllocation
          - SCPBypassTagKeyEIPAllocation
          - AlertOnEIPAllocationBypass
          - BlockMakeEBSSnapshotPublic
          - BlockUnencryptedRDSCreation
          - SCPBypassTagKeyUnencryptedRDSCreation
          - AlertOnUnencryptedRDSCreationBypass
          - BlockIAMUsersCreation
          - SCPBypassTagKeyIAMUsersCreation
          - AlertOnIAMUsersCreationBypass
          - BlockIAMUserCreationWithoutCertainTags
          - IAMUsersCreationSCPTagKeys
          - AWSServiceDeploymentAction
      - Label:
          default: Auto-Tagger
        Parameters:
          - TagVPCs
          - TagVPCUsingTagTemplateForTerraformDeployment
          - TagsKeyValueVPCs
          - SendMissingTagsNotificationVPCs
          - TagSubnets
          - TagSubnetUsingTagTemplateForTerraformDeployment
          - TagsKeyValueSubnets
          - SendMissingTagsNotificationSubnets
          - TagEbsVolumes
          - TagEbsVolumeUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEbsVolumes
          - SendMissingTagsNotificationEbsVolumes
          - TagEIPs
          - TagEIPUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEIPs
          - SendMissingTagsNotificationEIPs
          - TagEbsSnapshots
          - TagEbsSnapshotUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEbsSnapshots
          - SendMissingTagsNotificationEbsSnapshots
          - TagAMIs
          - TagAMIUsingTagTemplateForTerraformDeployment
          - TagsKeyValueAMIs
          - SendMissingTagsNotificationAMIs
          - TagEC2Instances
          - TagEC2InstanceUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEC2Instances
          - SendMissingTagsNotificationEC2Instances
          - TagEksClusters
          - TagEksClusterUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEksClusters
          - SendMissingTagsNotificationEksClusters
          - TagRDSClusterInstances
          - TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment
          - TagsKeyValueRDSClusterInstances
          - SendMissingTagsNotificationRDSClusterInstances
          - TagEFS
          - TagEfsUsingTagTemplateForTerraformDeployment
          - TagsKeyValueEFS
          - SendMissingTagsNotificationEFS
          - TagFSX
          - TagFsxUsingTagTemplateForTerraformDeployment
          - TagsKeyValueFSX
          - SendMissingTagsNotificationFSX
          - TagSecrets
          - TagSecretUsingTagTemplateForTerraformDeployment
          - TagsKeyValueSecrets
          - SendMissingTagsNotificationSecrets
          - TagBackupPlans
          - TagBackupPlanUsingTagTemplateForTerraformDeployment
          - TagsKeyValueBackupPlans
          - SendMissingTagsNotificationBackupPlans
          - TagLoadbalancers
          - TagLoadbalancerUsingTagTemplateForTerraformDeployment
          - TagsKeyValueLoadbalancers
          - SendMissingTagsNotificationLoadbalancers
      - Label:
          default: Auto-Remediation
        Parameters:
          - AllTrafficSGRulesRemediation
          - RemoteAccessPortsSGRulesRemediation
          - TrafficPortsSGRulesRemediation
          - LaunchWizardSGRemediation
          - S3AccountPublicBlockRemediation
          - EBSPublicSnapshotsRemediation
          - PublicAMIsRemediation
          - PublicRDSSnapshotsRemediation
          - AttachedOverPermissiveRolesRemediation
          - UnusedSecretAccessKeypairRemediation
          - InactiveCriteriaDays
      - Label:
          default: Alerts Configuration
        Parameters:
          - SenderEmailAddress
          - ReceiverEmailAddressess
          - SendHourlyAlertsForSeverityTypes
          - AlertSuppressionResourceTagKeyValue
          - AlertSuppressionPermissionSetTagKeyValue
      - Label:
          default: Alerts Customization
        Parameters:
          - EC2SecurityGroupIngressTrafficPorts
          - EC2SecurityGroupIngressRemoteAccessPorts
          - EC2SecurityGroupIngressIgnorePorts
          - LoadBalancerSecurityGroupIngressTrafficPorts
          - LoadBalancerSecurityGroupIngressRemoteAccessPorts
          - LoadBalancerSecurityGroupIngressIgnorePorts
          - EIPAssociationOverrideTagKeyBase64
          - EC2InstanceIAMRoleDetectionBypassTagKey
          - DisableFindingEC2LaunchWithoutIMDSv2
          - DisableFindingEC2LaunchWithPublicIP
          - DisableFindingUnencryptedEBSVolume
          - DisbleIAMSecretAccessKeyExpiryReminders
          - IAMSecretAccessKeyExpiryInDays
      - Label:
          default: PagerDuty Configuration
        Parameters:
          - AddSupportforPagerDuty
          - CreateIncidentForSeverityTypes
          - PagerDutyIntegrationType
          - PagerDutyRoutingKeySSM
          - PagerDutyApiTokenSSM
          - PagerDutyServiceId
          - PagerDutyUserEmailAddress
      - Label:
          default: Azure Cloud Configuration
        Parameters:
          - AddSupportforAzureCloud
          - AzureCustomerId
          - AzureSharedKeySSM
          - AzureLogType
    ParameterLabels:
      ProjectName:
        default: Project Name
      ManagementAccountId:
        default: Management Account ID
      EnableGuardDuty:
        default: Enable GuardDuty?
      EnableVpcFlowLogs:
        default: Enable VPC FlowLogs?
      FlowLogsDeliveryBucketPrefix:
        default: Flow Logs Delivery Bucket Prefix
      VpcFlowLogsTagKeyValue:
        default: Tags Key-Value for VPC Flow Logs
      SecurityGroupTableName:
        default: DynamoDB Table Name for Security Groups
      IAMUsersTableName:
        default: DynamoDB Table Name for IAM User
      S3BucketsTableName:
        default: DynamoDB Table Name for S3 Buckets
      RootIAMLoginsTableName:
        default: DynamoDB Table Name for Root User and IAM Users Login Metadata
      UnusedEC2InstancesTableName:
        default: DynamoDB Table Name for Unused EC2 Instances
      UnusedSecurityGroupsTableName:
        default: DynamoDB Table Name for Unused Security Groups
      UnusedEBSVolumesTableName:
        default: DynamoDB Table Name for EBS Volumes
      RemediatedResourcesTableName:
        default: DynamoDB Table Name for Remediated Findings of Resources
      ActiveResourcesTableName:
        default: DynamoDB Table Name for Active Resources
      DeletedResourcesTableName:
        default: DynamoDB Table Name for Deleted Resources
      DailyUserCostReportsTableName:
        default: DynamoDB Table Name for Daily User Cost Reports Metadata
      WeeklyUserCostReportsTableName:
        default: DynamoDB Table Name for Weekly User Cost Reports Metadata
      MonthlyUserCostReportsTableName:
        default: DynamoDB Table Name for Monthly User Cost Reports Metadata
      IPCorrelationTableName:
        default: DynamoDB Table Name for IP Correlation
      SSOUserIPHistoryTableName:
        default: DynamoDB Table Name for SSO Users IP History
      IAMKeyPairAccessTrackerTableName:
        default: DynamoDB Table Name for IAM Keypair Access Tracker
      SSMDocumentAssociationFailureTrackerTableName:
        default: DynamoDB Table Name for SSM Document Association Failure Tracker
      AutoAttachIAMRoleEC2:
        default: Auto-attach IAM Role to EC2 Instance?
      ExistingEC2SSMIAMRoleName:
        default: Name of existing IAM Role to attach to EC2 Instances on creation
      AutoAttachMissingPolicies:
        default: Auto-attach missing IAM Policies to IAM Role attached to EC2 Instance?
      NamesOfAdditionalPoliciesToAutoAttach:
        default: Names of Additional Policies to auto-attach to IAM Role if missing
      CreateNewManagedPolicy:
        default: Create new IAM Managed Policy?
      ManagedPolicyName:
        default: Name of the new managed policy
      EnableEC2InstanceConfigurator:
        default: Apply Custom Configurations to newly launched EC2 Instances?
      SSMDocumentName:
        default: SSM Document Name
      TrackSSMDocumentAssociationFailures:
        default: Track Failures for SSM Document Association?
      CreatePagerDutyIncidentsForSSMFailures:
        default: Create PagerDuty incidents for SSM Document Association failures?
      EnableHourlySSMFailureReminders:
        default: Enable hourly reminders for all SSM document association failures?
      AddSupportforIAMKeyPairAccessTracker:
        default: Deploy IAM Secret-Access KeyPair Access Tracker Project?
      AddSupportforCMDB:
        default: Deploy CMDB Project?
      EnableCostOptimizerRecommendations:
        default: Enable AWS Cost Optimizer Recommendations?
      AddSupportforIPTracker:
        default: Deploy IP Tracker Project?
      TrackTailscaleIPs:
        default: Track User IP Addresses from Tailscale?
      TailnetName:
        default: Tailnet Name
      OAuthClientId:
        default: Tailscale OAUTH Client ID
      OAuthClientSecretSSM:
        default: SSM Parameter Name for Tailscale OAUTH Client Secret
      BlockEC2LaunchWithoutCertainTags:
        default: SCP to Block EC2 Instance Launch without certain Tag Keys
      EC2InstanceLaunchSCPTagKeys:
        default: Tag Keys for EC2 Instance without which the launch should be blocked by SCP?
      BlockEksClusterCreationWithoutCertainTags:
        default: SCP to Block EKS Clusters creation without certain Tag Keys
      EksClusterCreationSCPTagKeys:
        default: Tag Keys for EKS Clusters without which the creation should be blocked by SCP?
      BlockRdsClusterInstanceCreationWithoutCertainTags:
        default: SCP to Block RDS Clusters and Instances creation without certain Tag Keys?
      RdsClusterInstanceCreationSCPTagKeys:
        default: Tag Keys for RDS Clusters and Instances without which the creation should be blocked by SCP?
      BlockEfsFileSystemCreationWithoutCertainTags:
        default: SCP to Block EFS FileSystem creation without certain Tag Keys?
      EfsFileSystemCreationSCPTagKeys:
        default: Tag Keys for EFS FileSystems without which the creation should be blocked by SCP?
      BlockEC2LaunchWithoutIMDSV2:
        default: SCP to Block EC2 Instance Launch if IMDSv2 is not enabled
      SCPBypassTagKeyEC2LaunchWithoutIMDSV2:
        default: Tag Key to bypass SCP for blocking EC2 Launch if IMDSv2 is disabled
      AlertOnEC2LaunchIMDSV2Bypass:
        default: Send alert if EC2 Instance is launched without IMDSv2 using bypass tag?
      BlockEC2LaunchWithPublicIP:
        default: SCP to Block EC2 Instance Launch if Public IP is associated
      SCPBypassTagKeyEC2LaunchWithPublicIP:
        default: Tag Key to bypass SCP for blocking EC2 Launch if Public IP is associated
      AlertOnEC2LaunchPublicIPBypass:
        default: Send alert if EC2 Instance is launched with Public IP using bypass tag?
      BlockUnencryptedEBSVolumeCreation:
        default: SCP to Block EBS Volume Creation without Encryption enabled?
      SCPBypassTagKeyEBSVolumeCreation:
        default: Tag Key to bypass SCP for blocking unencrypted EBS Volume Creation
      AlertOnUnencryptedEBSVolumeCreationBypass:
        default: Send alert if unencrypted EBS Volume is created using bypass tag?
      BlockLoadBalancerCreation:
        default: SCP to Block LoadBalancers Creation without bypass tags
      SCPBypassTagKeyLoadBalancerCreation:
        default: Tag Key to bypass SCP for blocking LoadBalancers Creation
      AlertOnLoadBalancerCreationBypass:
        default: Send alert if LoadBalancer is created using bypass tag?
      BlockEIPAllocation:
        default: SCP to Block EIP Allocation without bypass tags
      SCPBypassTagKeyEIPAllocation:
        default: Tag Key to bypass SCP for blocking EIP Allocation
      AlertOnEIPAllocationBypass:
        default: Send alert if EIP is allocated using bypass tag?
      BlockMakeEBSSnapshotPublic:
        default: SCP to Block Making EBS Snapshot Public
      BlockUnencryptedRDSCreation:
        default: SCP to Block RDS Instance/Cluster Creation if storage is not encrypted
      SCPBypassTagKeyUnencryptedRDSCreation:
        default: Tag Key to bypass SCP for blocking RDS Instance/Cluster Creation if storage is not encrypted
      AlertOnUnencryptedRDSCreationBypass:
        default: Send alert if RDS Instance/Cluster is created without its storage encryption enabled using bypass tag?
      BlockIAMUsersCreation:
        default: SCP to Block Creation of IAM Users without bypass tag
      SCPBypassTagKeyIAMUsersCreation:
        default: Tag Key to bypass SCP for blocking creation of IAM Users
      AlertOnIAMUsersCreationBypass:
        default: Send alert if IAM User is created using bypass tag?
      BlockIAMUserCreationWithoutCertainTags:
        default: SCP to Block IAM Users creation without certain Tag Keys
      IAMUsersCreationSCPTagKeys:
        default: Tag Keys for IAM Users without which the creation should be blocked by SCP?
      AWSServiceDeploymentAction:
        default: What to do if an AWS Service deploys on your behalf?
      TagVPCs:
        default: Enable auto-tagger for VPCs?
      TagVPCUsingTagTemplateForTerraformDeployment:
        default: Tag VPCs using SSM Tag Template for Terraform Deployments?
      TagsKeyValueVPCs:
        default: Tags Key-Value for VPCs
      SendMissingTagsNotificationVPCs:
        default: Send Notification if given tags are missing on VPC's creation?
      TagSubnets:
        default: Enable auto-tagger for Subnets?
      TagSubnetUsingTagTemplateForTerraformDeployment:
        default: Tag Subnets using SSM Tag Template for Terraform Deployments?
      TagsKeyValueSubnets:
        default: Tags Key-Value for Subnets
      SendMissingTagsNotificationSubnets:
        default: Send Notification if given tags are missing on Subnet's creation?
      TagEbsVolumes:
        default: Enable auto-tagger for EBS Volumes?
      TagEbsVolumeUsingTagTemplateForTerraformDeployment:
        default: Tag EBS Volumes using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEbsVolumes:
        default: Tags Key-Value for EBS Volumes
      SendMissingTagsNotificationEbsVolumes:
        default: Send Notification if given tags are missing on EBS Volume's creation?
      TagEIPs:
        default: Enable auto-tagger for Elastic IPs?
      TagEIPUsingTagTemplateForTerraformDeployment:
        default: Tag Elastic IPs using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEIPs:
        default: Tags Key-Value for Elastic IPs
      SendMissingTagsNotificationEIPs:
        default: Send Notification if given tags are missing on Elastic IP's creation?
      TagEbsSnapshots:
        default: Enable auto-tagger for EBS Snapshots?
      TagEbsSnapshotUsingTagTemplateForTerraformDeployment:
        default: Tag EBS Snapshots using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEbsSnapshots:
        default: Tags Key-Value for EBS Snapshots
      SendMissingTagsNotificationEbsSnapshots:
        default: Send Notification if given tags are missing on EBS Snapshot's creation?
      TagAMIs:
        default: Enable auto-tagger for AMIs?
      TagAMIUsingTagTemplateForTerraformDeployment:
        default: Tag AMIs using SSM Tag Template for Terraform Deployments?
      TagsKeyValueAMIs:
        default: Tags Key-Value for AMIs
      SendMissingTagsNotificationAMIs:
        default: Send Notification if given tags are missing on AMI's creation?
      TagEC2Instances:
        default: Enable auto-tagger for EC2 Instances?
      TagEC2InstanceUsingTagTemplateForTerraformDeployment:
        default: Tag EC2 Instances using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEC2Instances:
        default: Tags Key-Value for EC2 Instances
      SendMissingTagsNotificationEC2Instances:
        default: Send Notification if given tags are missing on EC2 Instance's creation?
      TagEksClusters:
        default: Enable auto-tagger for EKS Clusters?
      TagEksClusterUsingTagTemplateForTerraformDeployment:
        default: Tag EKS Clusters using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEksClusters:
        default: Tags Key-Value for EKS Clusters
      SendMissingTagsNotificationEksClusters:
        default: Send Notification if given tags are missing on EKS Cluster's creation?
      TagRDSClusterInstances:
        default: Enable auto-tagger for RDS Clusters and Instances?
      TagRDSClusterInstanceUsingTagTemplateForTerraformDeployment:
        default: Tag RDS Clusters and Instances using SSM Tag Template for Terraform Deployments?
      TagsKeyValueRDSClusterInstances:
        default: Tags Key-Value for RDS Clusters and Instances
      SendMissingTagsNotificationRDSClusterInstances:
        default: Send Notification if given tags are missing on RDS Cluster's and Instance's creation?
      TagEFS:
        default: Enable auto-tagger for EFS?
      TagEfsUsingTagTemplateForTerraformDeployment:
        default: Tag EFS using SSM Tag Template for Terraform Deployments?
      TagsKeyValueEFS:
        default: Tags Key-Value for EFS
      SendMissingTagsNotificationEFS:
        default: Send Notification if given tags are missing on EFS Filesystem's creation?
      TagFSX:
        default: Enable auto-tagger for FSX?
      TagFsxUsingTagTemplateForTerraformDeployment:
        default: Tag FSX using SSM Tag Template for Terraform Deployments?
      TagsKeyValueFSX:
        default: Tags Key-Value for FSX
      SendMissingTagsNotificationFSX:
        default: Send Notification if given tags are missing on FSX Filesystem's creation?
      TagSecrets:
        default: Enable auto-tagger for SecretsManager Secrets?
      TagSecretUsingTagTemplateForTerraformDeployment:
        default: Tag SecretsManager Secrets using SSM Tag Template for Terraform Deployments?
      TagsKeyValueSecrets:
        default: Tags Key-Value for SecretsManager Secrets
      SendMissingTagsNotificationSecrets:
        default: Send Notification if given tags are missing on SecretsManager secret's creation?
      TagBackupPlans:
        default: Enable auto-tagger for Backup Plans?
      TagBackupPlanUsingTagTemplateForTerraformDeployment:
        default: Tag Backup Plans using SSM Tag Template for Terraform Deployments?
      TagsKeyValueBackupPlans:
        default: Tags Key-Value for Backup Plans
      SendMissingTagsNotificationBackupPlans:
        default: Send Notification if given tags are missing on Backup Plan's creation?
      TagLoadbalancers:
        default: Enable auto-tagger for LoadBalancers?
      TagLoadbalancerUsingTagTemplateForTerraformDeployment:
        default: Tag LoadBalancers using SSM Tag Template for Terraform Deployments?
      TagsKeyValueLoadbalancers:
        default: Tags Key-Value for LoadBalancers
      SendMissingTagsNotificationLoadbalancers:
        default: Send Notification if given tags are missing on LoadBalancer's creation?
      AllTrafficSGRulesRemediation:
        default: Enable Auto-Remediation for Security Group Rules with "All Traffic" open to 0.0.0.0/0?
      RemoteAccessPortsSGRulesRemediation:
        default: Enable Auto-Remediation for Remote Access Ports Rules (Remote Access Ports open to 0.0.0.0/0) of Security Groups?
      TrafficPortsSGRulesRemediation:
        default: Enable Auto-Remediation for Traffic Ports Rules (Traffic Ports open to 0.0.0.0/0) of Security Groups?
      LaunchWizardSGRemediation:
        default: Enable Auto-Remediation for Launch Wizard Security Groups?
      S3AccountPublicBlockRemediation:
        default: Enable Auto-Remediation for S3 Account Block Public Access?
      EBSPublicSnapshotsRemediation:
        default: Enable Auto-Remediation for Public EBS Snapshots?
      PublicAMIsRemediation:
        default: Enable Auto-Remediation for Public AMIs?
      PublicRDSSnapshotsRemediation:
        default: Enable Auto-Remediation for Public RDS Instance and Cluster Snapshots?
      AttachedOverPermissiveRolesRemediation:
        default: Enable Auto-Remediation for Over-Permissive IAM Roles attached to EC2 Instances?
      UnusedSecretAccessKeypairRemediation:
        default: Enable Auto-Remediation for Unused Secret-Access Keypairs?
      InactiveCriteriaDays:
        default: Number of days to wait before making unused Secret-Access Keypair inactive
      SenderEmailAddress:
        default: Email Address to use to send out Resource Creation Failure Emails to Users
      ReceiverEmailAddressess:
        default: Email Addresses where you want to send reports for Disabled User's Resources and also daily resource reports
      SendHourlyAlertsForSeverityTypes:
        default: What severity type of findings do you want to get hourly reminders for?
      AlertSuppressionResourceTagKeyValue:
        default: Resource Tag Key-Value for Suppression of Alerts
      AlertSuppressionPermissionSetTagKeyValue:
        default: Permission Set Tag Key-Value for Suppression of Alerts
      EC2SecurityGroupIngressTrafficPorts:
        default: Traffic Ports for Ingress of EC2 Attached Security Groups
      EC2SecurityGroupIngressRemoteAccessPorts:
        default: Remote Access Ports for Ingress of EC2 Attached Security Groups (WILL BE TREATED AS CRITICAL PORTS)
      EC2SecurityGroupIngressIgnorePorts:
        default: Ignore Ports for Ingress of EC2 Attached Security Groups if added
      LoadBalancerSecurityGroupIngressTrafficPorts:
        default: Traffic Ports for Ingress of LoadBalancer Attached Security Groups
      LoadBalancerSecurityGroupIngressRemoteAccessPorts:
        default: Remote Access Ports for Ingress of LoadBalancer Attached Security Groups (WILL BE TREATED AS CRITICAL PORTS)
      LoadBalancerSecurityGroupIngressIgnorePorts:
        default: Ignore Ports for Ingress of LoadBalancer Attached Security Groups if added
      EIPAssociationOverrideTagKeyBase64:
        default: Tag Key that needs to be present on Resource while associating Elastic IP to it
      EC2InstanceIAMRoleDetectionBypassTagKey:
        default: Tag Key that needs to be present on IAM Role if detection needs to be bypassed
      DisableFindingEC2LaunchWithoutIMDSv2:
        default: Completely Disable finding for EC2 Instance launch without IMDSv2?
      DisableFindingEC2LaunchWithPublicIP:
        default: Completely Disable finding for EC2 Instance launch with Public IP?
      DisableFindingUnencryptedEBSVolume:
        default: Completely Disable finding for EBS Volumes Creation without encryption enabled?
      DisbleIAMSecretAccessKeyExpiryReminders:
        default: Completely Disable reminders for Secret Access Key Expiry?
      IAMSecretAccessKeyExpiryInDays:
        default: IAM Secret Access Key Expiry In Days
      AddSupportforPagerDuty:
        default: Enable PagerDuty?
      CreateIncidentForSeverityTypes:
        default: What severity type of findings should be sent to PagerDuty?
      PagerDutyIntegrationType:
        default: Select the Integration Type for PagerDuty
      PagerDutyRoutingKeySSM:
        default: SSM Parameter Name for PagerDuty API Routing/Integration Key
      PagerDutyApiTokenSSM:
        default: SSM Parameter Name for PagerDuty API Token
      PagerDutyServiceId:
        default: PagerDuty Service ID
      PagerDutyUserEmailAddress:
        default: Email Address of PagerDuty User associated with API Token
      AddSupportforAzureCloud:
        default: Send findings to Azure Log Analytics for further analysis?
      AzureCustomerId:
        default: Azure Customer ID
      AzureSharedKeySSM:
        default: SSM Parameter Name for Azure Shared Key
      AzureLogType:
        default: Azure Log Type

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    MaxLength: 20
  ManagementAccountId:
    Type: String
    Description: Account Id
    MaxLength: 12
    MinLength: 12
  EnableGuardDuty:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable GuardDuty
  EnableVpcFlowLogs:
    Type: String
    Description: Set to True if you want to enable VPC FlowLogs
    AllowedValues:
    - true
    - false
  FlowLogsDeliveryBucketPrefix:
    Type: String
    Description: Bucket Prefix
  VpcFlowLogsTagKeyValue:
    Type: String
    Description: Tags Key-Value (e.g. Key=Value)
  SecurityGroupTableName:
    Type: String
    Description: Table Name
  IAMUsersTableName:
    Type: String
    Description: Table Name
  S3BucketsTableName:
    Type: String
    Description: Table Name
  RootIAMLoginsTableName:
    Type: String
    Description: Table Name
  UnusedEC2InstancesTableName:
    Type: String
    Description: Table Name
  UnusedSecurityGroupsTableName:
    Type: String
    Description: Table Name
  UnusedEBSVolumesTableName:
    Type: String
    Description: Table Name
  RemediatedResourcesTableName:
    Type: String
    Description: Table Name
  ActiveResourcesTableName:
    Type: String
    Description: Table Name
  DeletedResourcesTableName:
    Type: String
    Description: Table Name
  DailyUserCostReportsTableName:
    Type: String
    Description: Table Name
  WeeklyUserCostReportsTableName:
    Type: String
    Description: Table Name
  MonthlyUserCostReportsTableName:
    Type: String
    Description: Table Name
  IPCorrelationTableName:
    Type: String
    Description: Table Name
  SSOUserIPHistoryTableName:
    Type: String
    Description: Table Name
  IAMKeyPairAccessTrackerTableName:
    Type: String
    Description: Table Name
  SSMDocumentAssociationFailureTrackerTableName:
    Type: String
    Description: Table Name
  AutoAttachIAMRoleEC2:
    Type: String
    Description: Set to True if you want to auto-attach IAM Role to EC2 instance if not attached already
    AllowedValues:
    - true
    - false
  ExistingEC2SSMIAMRoleName:
    Type: String
    Description: If not provided, we'll auto-create an IAM Role with required policies attached
