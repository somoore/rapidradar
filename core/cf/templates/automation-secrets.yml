Resources:
  SSOUsersSecretLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sso-users-secret-creator"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: AssumeRolePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: StsAccess
            Effect: Allow
            Action:
            - sts:AssumeRole
            Resource: "*"
      - PolicyName: SecretsManagerWritePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: SSMAccess
            Effect: Allow
            Action:
            - secretsmanager:CreateSecret
            - secretsmanager:DeleteSecret
            - secretsmanager:PutSecretValue
            - secretsmanager:UpdateSecret
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*

  SSOUsersSecretLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: "index.handler"
      Runtime: python3.11
      FunctionName: !Sub "${ProjectName}-sso-users-secret-creator"
      Timeout: 300
      MemorySize: 128
      Role: !GetAtt SSOUsersSecretLambdaRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          SSO_CROSS_ACCOUNT_ROLE_ARN: !Sub "arn:aws:iam::${ManagementAccountId}:role/${ProjectName}-sso-cross-account-role"
      Layers:
      - !Sub '{{resolve:secretsmanager:arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${ProjectName}/SHARED_LAMBDA_LAYERS_ARN:SecretString:REQUESTS_LAYER_ARN:AWSCURRENT}}'
      Code:
        ZipFile: |
          import boto3
          import json
          import ast
          import requests
          from os import getenv
          PROJECT_NAME = getenv('PROJECT_NAME')
          SSO_CROSS_ACCOUNT_ROLE_ARN = getenv('SSO_CROSS_ACCOUNT_ROLE_ARN')
          def handler(event, context):
              print(event)
              props = event['ResourceProperties']
              data = {}
              client=boto3.client(props['Service'])
              event_type = event['RequestType']
              status = 'SUCCESS'
              reason = ''
              data = {}
              sso_users = {}
              provider_arn = None
              if event_type in ['Create']:
                  method=getattr(client, 'create_secret')
                  kwargs = {}
                  for key, value in props['KwArgs'].items():
                      try:
                          kwargs[key] = ast.literal_eval(value)
                      except Exception as e:
                          print(str(e))
                          kwargs[key] = value
                  kwargs['SecretString'] = json.dumps(get_all_sso_users())
                  try:
                      data = method(**kwargs)
                      provider_arn = data['Name']
                      status = 'SUCCESS'
                      reason = ''
                  except client.exceptions.ResourceExistsException:
                      print(f"Secret with name {kwargs['Name']} already exists. Updating its value...")
                      data = client.put_secret_value(
                          SecretId=kwargs['Name'],
                          SecretString=kwargs['SecretString']
                      )
                      provider_arn = data['Name']
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Update']:
                  method=getattr(client, 'put_secret_value')
                  provider_arn = event['PhysicalResourceId']
                  try:
                      data = client.put_secret_value(
                          SecretId=provider_arn,
                          SecretString=json.dumps(get_all_sso_users())
                      )
                      provider_arn = data['Name']
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              elif event_type in ['Delete']:
                  method=getattr(client, 'delete_secret')
                  provider_arn = event['PhysicalResourceId']
                  try:
                      data = method(SecretId=provider_arn,ForceDeleteWithoutRecovery=True)
                      status = 'SUCCESS'
                      reason = ''
                  except Exception as e:
                      status = 'FAILED'
                      reason = str(e)
                      data = {}
              response_data = {
                  'Status': status,
                  'Reason': reason,
                  'PhysicalResourceId': provider_arn if provider_arn is not None else event['LogicalResourceId'],
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }
              print(response_data)
              resp = requests.put(event['ResponseURL'], data=json.dumps(response_data))
              if resp.status_code != 200:
                  print(resp.text)
                  raise Exception(resp.text)
              return
          def __assume_role(arn):
              sts = boto3.client('sts')
              response = sts.assume_role(RoleArn=arn, RoleSessionName=PROJECT_NAME)
              session = boto3.Session(aws_access_key_id=response['Credentials']['AccessKeyId'],
                              aws_secret_access_key=response['Credentials']['SecretAccessKey'],
                              aws_session_token=response['Credentials']['SessionToken'])
              return session
          def __get_identity_store_id(active_session: boto3.Session):
              sso_admin = active_session.client(service_name='sso-admin', region_name='us-east-1')
              identity_store_id = ''
              try:
                  response = sso_admin.list_instances()
                  if response['Instances']:
                      identity_store_id = response['Instances'][0]['IdentityStoreId']
              except Exception as error:
                  raise error
              return identity_store_id
          def get_all_sso_users():
              active_session = __assume_role(SSO_CROSS_ACCOUNT_ROLE_ARN)
              identity_store_id = __get_identity_store_id(active_session)
              identity_store = active_session.client(service_name='identitystore',region_name='us-east-1')
              sso_users = {}
              next_token = ''
              base_kwargs = {
                  'IdentityStoreId': identity_store_id
              }
              try:
                  while next_token is not None:
                      kwargs = base_kwargs.copy()
                      if next_token != '':
                          kwargs.update({'NextToken': next_token})
                      response = identity_store.list_users(**kwargs)
                      for user in response['Users']:
                          username = user['UserName']
                          user_id = user['UserId']
                          sso_users[user_id] = username
                      next_token = response['NextToken'] if 'NextToken' in response else None
              except Exception as error:
                  print(f"[ERROR] {str(error)}")
              return sso_users

  SSOUsersSecret:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      Service: secretsmanager
      ServiceToken: !GetAtt SSOUsersSecretLambda.Arn
      KwArgs:
