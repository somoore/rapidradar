AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates EventBus, Event Rules and Lambda functions alongwith StepFunctions to deploy an organization-wide Cloud Security and Cost management solution.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Configuration
        Parameters:
          - ProjectName
          - AwsOrgName
          - OrganizationId
          - IsControlTowerEnabled
          - CrossAccountRole
          - SlackActionsCrossAccountRole
          - DeploymentTargets
          - ExcludeAccounts
          - ActiveRegions
          - ManagementAccountId
          - LogArchiveAccountId
          - IsOrganizationTrail
          - CentralizedLogsS3BucketName
          - HomeRegion
          - ChildAccountsStackSetName
          - UserOffboardingWorkflowECRImageURI
          - EnableGuardDuty
          - GuardDutySeverityLevels
          - SSOUsersSecretName
          - EventsProcessorLambdaEnvVarsSecretName
      - Label:
          default: Slack Interactivity API Configuration
        Parameters:
          - SlackApiDomainName
          - SlackApiDomainCertificateArn
      - Label:
          default: VPC FlowLogs
        Parameters:
          - EnableVpcFlowLogs
          - FlowLogsDeliveryBucketPrefix
      - Label:
          default: DynamoDB Tables
        Parameters:
          - SecurityGroupTableName
          - IAMUsersTableName
          - S3BucketsTableName
          - RootIAMLoginsTableName
          - UnusedEC2InstancesTableName
          - UnusedSecurityGroupsTableName
          - UnusedEBSVolumesTableName
          - RemediatedResourcesTableName
          - ActiveResourcesTableName
          - DeletedResourcesTableName
          - DailyUserCostReportsTableName
          - WeeklyUserCostReportsTableName
          - MonthlyUserCostReportsTableName
          - IPCorrelationTableName
          - SSOUserIPHistoryTableName
          - IAMKeyPairAccessTrackerTableName
          - SSMDocumentAssociationFailureTrackerTableName
      - Label:
          default: Post Deploy SSM Automation
        Parameters:
          - AddSupportforPostDeploySSMAutomation
          - AutoAttachIAMRoleEC2
          - ExistingEC2SSMIAMRoleName
          - AutoAttachMissingPolicies
          - NamesOfAdditionalPoliciesToAutoAttach
          - AutoCreateVPCEndpoints
          - VPCEndpointsList
          - CreateNewManagedPolicy
          - ManagedPolicyName
          - ManagedPolicyDocumentJsonSSM
          - EnableEC2InstanceConfigurator
          - TrackSSMDocumentAssociationFailures
      - Label:
          default: User Offboarding Workflow Project
        Parameters:
          - AddSupportforUserOffboardingWorkflow
      - Label:
          default: IAM Secret-Access KeyPair Access Tracker Project
        Parameters:
          - AddSupportforIAMKeyPairAccessTracker
      - Label:
          default: CMDB Project
        Parameters:
          - AddSupportforCMDB
      - Label:
          default: IP Tracker Project
        Parameters:
          - AddSupportforIPTracker
          - TrackTailscaleIPs
      - Label:
          default: Auto-Tagger
        Parameters:
          - TagVPCs
          - TagsKeyValueVPCs
          - TagSubnets
          - TagsKeyValueSubnets
          - TagEbsVolumes
          - TagsKeyValueEbsVolumes
          - TagEIPs
          - TagsKeyValueEIPs
          - TagEbsSnapshots
          - TagsKeyValueEbsSnapshots
          - TagAMIs
          - TagsKeyValueAMIs
          - TagEC2Instances
          - TagsKeyValueEC2Instances
          - TagEksClusters
          - TagsKeyValueEksClusters
          - TagRDSClusterInstances
          - TagsKeyValueRDSClusterInstances
          - TagEFS
          - TagsKeyValueEFS
          - TagFSX
          - TagsKeyValueFSX
          - TagSecrets
          - TagsKeyValueSecrets
          - TagBackupPlans
          - TagsKeyValueBackupPlans
          - TagLoadbalancers
          - TagsKeyValueLoadbalancers
      - Label:
          default: Alerts Configuration
        Parameters:
          - EngineerFacingNotificationsConfigsSecretName
          - SecurityAdminFacingNotificationsConfigsSecretName
          - EnableSlackSocketMode
          - SlackSocketAppEcrImageURI
          - SlackBotConfigSecretName
          - SenderEmailAddress
          - ReceiverEmailAddressess
      - Label:
          default: Alerts Customization
        Parameters:
          - UnusedResourcesDetectionBypassTagKey
          - DisableDetectionStoppedEC2Instances
          - DisableDetectionUnusedSecurityGroups
          - DisableDetectionUnusedEBSVolumes
      - Label:
          default: Azure Cloud Configuration
        Parameters:
          - AddSupportforAzureCloud
          - AzureCustomerId
          - AzureSharedKeySSM
          - AzureLogType
    ParameterLabels:
      ProjectName:
        default: Project Name
      AwsOrgName:
        default: AWS Organization Name
      OrganizationId:
        default: Organization Id
      IsControlTowerEnabled:
        default: Is Control Tower enabled in your Organization?
      CrossAccountRole:
        default: Cross Account Role Name
      SlackActionsCrossAccountRole:
        default: Cross Account Role Name for taking Slack Actions
      DeploymentTargets:
        default: Account IDs or Organization Unit IDs you're getting this solution deployed to
      ExcludeAccounts:
        default: Accounts you want to exclude from the deployment
      ActiveRegions:
        default: List of AWS regions where this solution is being deployed
      ManagementAccountId:
        default: Management Account ID
      LogArchiveAccountId:
        default: Log Archive account ID (Skip if its a Standalone Deployment)
      IsOrganizationTrail:
        default: Specify whether the trails apply to all accounts in an organization in AWS Organizations, or only for the current AWS account
      CentralizedLogsS3BucketName:
        default: Name of S3 Bucket to store the Cloudtrail logs (Skip if Data Trail is not being created organization-wide)
      HomeRegion:
        default: Home AWS Region
      ChildAccountsStackSetName:
        default: Name of Child Accounts StackSet
      UserOffboardingWorkflowECRImageURI:
        default: ECR Image URI for app to generate reports batch job (User Offboarding Workdlow)
      EnableGuardDuty:
        default: Enable GuardDuty?
      GuardDutySeverityLevels:
        default: Specify the severity levels of GuardDuty findings to be processed
      SSOUsersSecretName:
        default: Name of Secret containing SSO Users ID along with usernames
      EventsProcessorLambdaEnvVarsSecretName:
        default: Name of Secret containing env vars for events-processor Lambda Function
      SlackApiDomainName:
        default: Domain Name for Slack API
      SlackApiDomainCertificateArn:
        default: ACM Certificate ARN for given Domain Name
      EnableVpcFlowLogs:
        default: Enable VPC FlowLogs?
      FlowLogsDeliveryBucketPrefix:
        default: Flow Logs Delivery Bucket Prefix
      SecurityGroupTableName:
        default: DynamoDB Table Name for Security Groups
      IAMUsersTableName:
        default: DynamoDB Table Name for IAM User
      S3BucketsTableName:
        default: DynamoDB Table Name for S3 Buckets
      RootIAMLoginsTableName:
        default: DynamoDB Table Name for Root User and IAM Users Login Metadata
      UnusedEC2InstancesTableName:
        default: DynamoDB Table Name for Unused EC2 Instances
      UnusedSecurityGroupsTableName:
        default: DynamoDB Table Name for Unused Security Groups
      UnusedEBSVolumesTableName:
        default: DynamoDB Table Name for EBS Volumes
      RemediatedResourcesTableName:
        default: DynamoDB Table Name for Remediated Findings of Resources
      ActiveResourcesTableName:
        default: DynamoDB Table Name for Active Resources
      DeletedResourcesTableName:
        default: DynamoDB Table Name for Deleted Resources
      DailyUserCostReportsTableName:
        default: DynamoDB Table Name for Daily User Cost Reports Metadata
      WeeklyUserCostReportsTableName:
        default: DynamoDB Table Name for Weekly User Cost Reports Metadata
      MonthlyUserCostReportsTableName:
        default: DynamoDB Table Name for Monthly User Cost Reports Metadata
      IPCorrelationTableName:
        default: DynamoDB Table Name for IP Correlation
      SSOUserIPHistoryTableName:
        default: DynamoDB Table Name for SSO Users IP History
      IAMKeyPairAccessTrackerTableName:
        default: DynamoDB Table Name for IAM Keypair Access Tracker
      SSMDocumentAssociationFailureTrackerTableName:
        default: DynamoDB Table Name for SSM Document Association Failure Tracker
      AddSupportforPostDeploySSMAutomation:
        default: Enable Post Deploy SSM Automation Project?
      AutoAttachIAMRoleEC2:
        default: Auto-attach IAM Role to EC2 Instance?
      ExistingEC2SSMIAMRoleName:
        default: Name of existing IAM Role to attach to EC2 Instances on creation
      AutoAttachMissingPolicies:
        default: Auto-attach missing IAM Policies to IAM Role attached to EC2 Instance?
      NamesOfAdditionalPoliciesToAutoAttach:
        default: Names of Additional Policies to auto-attach to IAM Role if missing
      AutoCreateVPCEndpoints:
        default: Auto-create VPC endpoints?
      VPCEndpointsList:
        default: List of VPC Endpoints to create
      CreateNewManagedPolicy:
        default: Create new IAM Managed Policy?
      ManagedPolicyName:
        default: Name of the new managed policy
      ManagedPolicyDocumentJsonSSM:
        default: Name of SSM Parameter containing Policy Document of new IAM Managed Policy
      EnableEC2InstanceConfigurator:
        default: Apply Custom Configurations to newly launched EC2 Instances?
      TrackSSMDocumentAssociationFailures:
        default: Track Failures for SSM Document Association?
      AddSupportforUserOffboardingWorkflow:
        default: Deploy User Offboarding Workflow Project?
      AddSupportforIAMKeyPairAccessTracker:
        default: Deploy IAM Secret-Access KeyPair Access Tracker Project?
      AddSupportforCMDB:
        default: Deploy CMDB Project?
      AddSupportforIPTracker:
        default: Deploy IP Tracker Project?
      TrackTailscaleIPs:
        default: Track User IP Addresses from Tailscale?
      TagVPCs:
        default: Enable auto-tagger for VPCs?
      TagsKeyValueVPCs:
        default: Tags Key-Value for VPCs
      TagSubnets:
        default: Enable auto-tagger for Subnets?
      TagsKeyValueSubnets:
        default: Tags Key-Value for Subnets
      TagEbsVolumes:
        default: Enable auto-tagger for EBS Volumes?
      TagsKeyValueEbsVolumes:
        default: Tags Key-Value for EBS Volumes
      TagEIPs:
        default: Enable auto-tagger for Elastic IPs?
      TagsKeyValueEIPs:
        default: Tags Key-Value for Elastic IPs
      TagEbsSnapshots:
        default: Enable auto-tagger for EBS Snapshots?
      TagsKeyValueEbsSnapshots:
        default: Tags Key-Value for EBS Snapshots
      TagAMIs:
        default: Enable auto-tagger for AMIs?
      TagsKeyValueAMIs:
        default: Tags Key-Value for AMIs
      TagEC2Instances:
        default: Enable auto-tagger for EC2 Instances?
      TagsKeyValueEC2Instances:
        default: Tags Key-Value for EC2 Instances
      TagEksClusters:
        default: Enable auto-tagger for EKS Clusters?
      TagsKeyValueEksClusters:
        default: Tags Key-Value for EKS Clusters
      TagRDSClusterInstances:
        default: Enable auto-tagger for RDS Clusters and Instances?
      TagsKeyValueRDSClusterInstances:
        default: Tags Key-Value for RDS Clusters and Instances
      TagEFS:
        default: Enable auto-tagger for EFS?
      TagsKeyValueEFS:
        default: Tags Key-Value for EFS
      TagFSX:
        default: Enable auto-tagger for FSX?
      TagsKeyValueFSX:
        default: Tags Key-Value for FSX
      TagSecrets:
        default: Enable auto-tagger for SecretsManager Secrets?
      TagsKeyValueSecrets:
        default: Tags Key-Value for SecretsManager Secrets
      TagBackupPlans:
        default: Enable auto-tagger for Backup Plans?
      TagsKeyValueBackupPlans:
        default: Tags Key-Value for Backup Plans
      TagLoadbalancers:
        default: Enable auto-tagger for LoadBalancers?
      TagsKeyValueLoadbalancers:
        default: Tags Key-Value for LoadBalancers
      EngineerFacingNotificationsConfigsSecretName:
        default: Name of Secret containing notification configuration for Engineer-Facing Alerts
      SecurityAdminFacingNotificationsConfigsSecretName:
        default: Name of Secret containing notification configuration for Security Admin-Facing Alerts
      EnableSlackSocketMode:
        default: Enable Socket mode for Slack App?
      SlackSocketAppEcrImageURI:
        default: ECR Image URI for Slack App to run in socket mode
      SlackBotConfigSecretName:
        default: Name of SecretsManager Secret containing Configuration for Slack Bot
      SenderEmailAddress:
        default: Email Address to use to send out Resource Creation Failure Emails to Users
      ReceiverEmailAddressess:
        default: Email Addresses where you want to send reports for Disabled User's Resources and also daily resource reports
      UnusedResourcesDetectionBypassTagKey:
        default: Tag Key that needs to be present on unused resources if detection needs to be bypassed
      DisableDetectionStoppedEC2Instances:
        default: Disable detection for stopped EC2 Instances?
      DisableDetectionUnusedSecurityGroups:
        default: Disable detection for unused Security Groups?
      DisableDetectionUnusedEBSVolumes:
        default: Disable detection for unused EBS Volumes?
      AddSupportforAzureCloud:
        default: Send findings to Azure Log Analytics for further analysis?
      AzureCustomerId:
        default: Azure Customer ID
      AzureSharedKeySSM:
        default: SSM Parameter Name for Azure Shared Key
      AzureLogType:
        default: Azure Log Type

Parameters:
  ProjectName:
    Type: String
    Description: Project Name
    MaxLength: 20
  AwsOrgName:
    Type: String
    Description: AWS Organization Name
  OrganizationId:
    Type: String
    Description: ID of current organization to allow the child accounts to send events to event bus
  IsControlTowerEnabled:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if control tower is enabled in your organization
  CrossAccountRole:
    Type: String
    Description: Name of CrossAccountRole in child account to be assumed by lambda Function.
    Default: <ProjectName>-cross-account-role
  SlackActionsCrossAccountRole:
    Type: String
    Description: Name of SlackActionsCrossAccountRole in child account to be assumed by lambda Function.
    Default: <ProjectName>-slack-cross-account-role
  DeploymentTargets:
    Type: String
    Description: Comma-Delimited List
  ExcludeAccounts:
    Type: String
    Description: Comma-Delimited List
  ActiveRegions:
    Type: String
    Description: Comma-Delimited List
  ManagementAccountId:
    Type: String
    Description: Account Id
    MaxLength: 12
    MinLength: 12
  LogArchiveAccountId:
    Type: String
    Description: AWS Account ID of the Control Tower Log Archive account.
  IsOrganizationTrail:
    Type: String
    Description: Set to True if you want to apply trails to all accounts in your organization
    AllowedValues:
    - true
    - false
  CentralizedLogsS3BucketName:
    Type: String
    Description: ControlTower bucket name follows this naming convention `aws-controltower-logs-<LogArchiveAccountID>-<region>`. If ControlTower is not enabled, provide S3 Bucket name in current region.
  HomeRegion:
    Type: String
    Description: AWS Region
  ChildAccountsStackSetName:
    Type: String
    Description: Name of StackSet which is deployed in all child accounts
  UserOffboardingWorkflowECRImageURI:
    Type: String
    Description: ECR Image URI of the image to run using Batch for generating reports for deleted/disabled SSO User
  EnableGuardDuty:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable GuardDuty
  GuardDutySeverityLevels:
    Type: List<String>
    Description: Comma-Separated list of severity levels (e.g., 'HIGH,MEDIUM')
    AllowedValues: [HIGH, MEDIUM, LOW, ALL]
    ConstraintDescription: "Must be one or more of the following values: ALL, HIGH, MEDIUM, LOW."
  SSOUsersSecretName:
    Type: String
    Description: SecretsManager Secret Name
  EventsProcessorLambdaEnvVarsSecretName:
    Type: String
    Description: SecretsManager Secret Name
  SlackApiDomainName:
    Type: String
    Description: "The custom domain name for the API (e.g., api.myexample.com)"
  SlackApiDomainCertificateArn:
    Type: String
    Description: "The ARN of the ACM certificate for the custom domain"
  EnableVpcFlowLogs:
    Type: String
    Description: Set to True if you want to enable VPC FlowLogs
    AllowedValues:
    - true
    - false
  FlowLogsDeliveryBucketPrefix:
    Type: String
    Description: Bucket Prefix
  SecurityGroupTableName:
    Type: String
    Description: Table Name
  IAMUsersTableName:
    Type: String
    Description: Table Name
  S3BucketsTableName:
    Type: String
    Description: Table Name
  RootIAMLoginsTableName:
    Type: String
    Description: Table Name
  UnusedEC2InstancesTableName:
    Type: String
    Description: Table Name
  UnusedSecurityGroupsTableName:
    Type: String
    Description: Table Name
  UnusedEBSVolumesTableName:
    Type: String
    Description: Table Name
  RemediatedResourcesTableName:
    Type: String
    Description: Table Name
  ActiveResourcesTableName:
    Type: String
    Description: Table Name
  DeletedResourcesTableName:
    Type: String
    Description: Table Name
  DailyUserCostReportsTableName:
    Type: String
    Description: Table Name
  WeeklyUserCostReportsTableName:
    Type: String
    Description: Table Name
  MonthlyUserCostReportsTableName:
    Type: String
    Description: Table Name
  IPCorrelationTableName:
    Type: String
    Description: Table Name
  SSOUserIPHistoryTableName:
    Type: String
    Description: Table Name
  IAMKeyPairAccessTrackerTableName:
    Type: String
    Description: Table Name
  SSMDocumentAssociationFailureTrackerTableName:
    Type: String
    Description: Table Name
  AddSupportforPostDeploySSMAutomation:
    Type: String
    Description: Set to True if you want to enable Post Deploy SSM Automation Project
    AllowedValues:
    - true
    - false
  AutoAttachIAMRoleEC2:
    Type: String
    Description: Set to True if you want to auto-attach IAM Role to EC2 instance if not attached already
    AllowedValues:
    - true
    - false
  ExistingEC2SSMIAMRoleName:
    Type: String
    Description: If not provided, we'll auto-create an IAM Role with required policies attached
  AutoAttachMissingPolicies:
    Type: String
    Description: Set to True if you want to auto-attach missing policies to IAM Role attached to EC2 instance
    AllowedValues:
    - true
    - false
  NamesOfAdditionalPoliciesToAutoAttach:
    Type: String
    Description: Comma-Delimited list of names of managed IAM policies [excluding "AmazonSSMManagedInstanceCore", "AmazonSSMManagedEC2InstanceDefaultPolicy" as these will be attached by default]
  AutoCreateVPCEndpoints:
    Type: String
    Description: "Set to True if you want to auto-create missing VPC Endpoints on EC2 launch. NOTE: If set to false and EnableEC2InstanceConfigurator is set to true, following VPC endpoints should exist: [ssm, ssmmessages, ec2messages]"
    AllowedValues:
    - true
    - false
  VPCEndpointsList:
    Type: String
    Description: Comma-Delimited list [excluding "com.amazonaws.[region].ssm", "com.amazonaws.[region].ssmmessages", "com.amazonaws.[region].ec2messages", as these will be created by default]
  CreateNewManagedPolicy:
    Type: String
    Description: "Set to True if you want to create new IAM managed Policy (This will also be auto-attached to EC2 Roles if AutoAttachMissingPolicies is true)"
    AllowedValues:
    - true
    - false
  ManagedPolicyName:
    Type: String
    Description: Name of the new managed policy to be created
  ManagedPolicyDocumentJsonSSM:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of SSM Parameter Item containing Policy Document of new IAM Policy in JSON format
  EnableEC2InstanceConfigurator:
    Type: String
    Description: Set to True if you want to apply custom configurations through SSM Documents for EC2 Instances
    AllowedValues:
    - true
    - false
  TrackSSMDocumentAssociationFailures:
    Type: String
    Description: Set to True if you want to track failures for SSM Document Association
    AllowedValues:
    - true
    - false
  AddSupportforUserOffboardingWorkflow:
    Type: String
    Description: Set to True if you want User Offboarding Workflow Project deployed
    AllowedValues:
    - true
    - false
  AddSupportforIAMKeyPairAccessTracker:
    Type: String
    Description: Set to True if you want IAM Secret-Access KeyPair Access Tracker project deployed
    AllowedValues:
    - true
    - false
  AddSupportforCMDB:
    Type: String
    Description: Set to True if you want CMDB project deployed
    AllowedValues:
    - true
    - false
  AddSupportforIPTracker:
    Type: String
    Description: Set to True if you want IP Tracker project deployed
    AllowedValues:
    - true
    - false
  TrackTailscaleIPs:
    Type: String
    Description: Set to True if you want to track sso user's IP Addresses from tailscale as well along with AWS
    AllowedValues:
    - true
    - false
  TagVPCs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for VPCs on creation
  TagsKeyValueVPCs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagSubnets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Subnets on creation
  TagsKeyValueSubnets:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEbsVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Volumes on creation
  TagsKeyValueEbsVolumes:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEIPs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Elastic IPs on allocation
  TagsKeyValueEIPs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEbsSnapshots:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EBS Snapshots on creation
  TagsKeyValueEbsSnapshots:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagAMIs:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for AMIs on creation
  TagsKeyValueAMIs:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EC2 Instances on launch
  TagsKeyValueEC2Instances:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEksClusters:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EKS Clusters on creation
  TagsKeyValueEksClusters:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagRDSClusterInstances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for RDS Clusters and Instances on creation
  TagsKeyValueRDSClusterInstances:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagEFS:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for EFS on filesystem creation
  TagsKeyValueEFS:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagFSX:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for FSX on filesystem creation
  TagsKeyValueFSX:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagSecrets:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for SecretsManager on secret creation
  TagsKeyValueSecrets:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagBackupPlans:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for Backup Plans on creation
  TagsKeyValueBackupPlans:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  TagLoadbalancers:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable auto-tagger for LoadBalancers on creation
  TagsKeyValueLoadbalancers:
    Type: String
    Description: Comma Separated Tags Key-Value (e.g. Key1=Value1,Key2=Value2)
  EngineerFacingNotificationsConfigsSecretName:
    Type: String
    Description: SecretsManager Secret Name (Should contain NOTIFICATION_APP and WEBHOOK_URL/APP_CONFIG keys)
  SecurityAdminFacingNotificationsConfigsSecretName:
    Type: String
    Description: SecretsManager Secret Name (Should contain NOTIFICATION_APP and WEBHOOK_URL/APP_CONFIG keys)
  EnableSlackSocketMode:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to enable Socket mode for Slack App
  SlackSocketAppEcrImageURI:
    Type: String
    Description: ECR Image URI of image to run Slack App in socket mode
  SlackBotConfigSecretName:
    Type: String
    Description: Contains the Slack bot OAuth token and channel ID for sending alerts and managing responses
  SenderEmailAddress:
    Type: String
    Description: Email Address
  ReceiverEmailAddressess:
    Type: String
    Description: Comma Separated Email Addresses
  UnusedResourcesDetectionBypassTagKey:
    Type: String
    Description: Tag Key
  DisableDetectionStoppedEC2Instances:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for stopped EC2 Instances
  DisableDetectionUnusedSecurityGroups:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused Security Groups
  DisableDetectionUnusedEBSVolumes:
    Type: String
    AllowedValues:
    - true
    - false
    Description: Set to True if you want to disable detection for unused EBS Volumes
  AddSupportforAzureCloud:
    Type: String
    Description: Set to True if you want to send findings to Azure Cloud
    AllowedValues:
    - true
    - false
  AzureCustomerId:
    Type: String
    Description: Customer ID
  AzureSharedKeySSM:
    Type: String
    Description: Name of SSM Parameter Item which contains Shared Key for Azure Cloud
  AzureLogType:
    Type: String
    Description: Log Type

Conditions:
  SlackSocketModeEnabled: !Equals [ !Ref EnableSlackSocketMode, true ]
  SlackBotConfigProvided: !Not [ !Equals [ !Ref SlackBotConfigSecretName, "" ] ]
  CreateSlackInteractivityAPI: !And
  - !Not [ !Condition SlackSocketModeEnabled ]
  - !Condition SlackBotConfigProvided

  DeploySSMAutomationProject: !Equals
  - !Ref AddSupportforPostDeploySSMAutomation
  - true
  DeployUserOffboardingWorkflowProject: !Equals
  - !Ref AddSupportforUserOffboardingWorkflow
  - true
  DeployIAMKeyPairAccessTrackerProject: !Equals
  - !Ref AddSupportforIAMKeyPairAccessTracker
  - true
  DeployCMDBProject: !Equals
  - !Ref AddSupportforCMDB
  - true
  DeployIPTrackerProject: !Equals
  - !Ref AddSupportforIPTracker
  - true
  ApplyEC2InstancesConfigurations: !Equals
  - !Ref EnableEC2InstanceConfigurator
  - true
  TrackSSMAssociationFailures: !Equals
  - !Ref TrackSSMDocumentAssociationFailures
  - true
  IsGuardDutyEnabled: !Equals
  - !Ref EnableGuardDuty
  - true

  IsEnabledStoppedEC2InstancesDetection: !Equals
  - !Ref DisableDetectionStoppedEC2Instances
  - false
  IsEnabledUnusedSecurityGroupsDetection: !Equals
  - !Ref DisableDetectionUnusedSecurityGroups
  - false
  IsEnabledUnusedEBSVolumesDetection: !Equals
  - !Ref DisableDetectionUnusedEBSVolumes
  - false
  IsEnabledUnusedResourcesDetection: !Or
  - !Condition IsEnabledStoppedEC2InstancesDetection
  - !Condition IsEnabledUnusedSecurityGroupsDetection
  - !Condition IsEnabledUnusedEBSVolumesDetection

  AutoTagVPCs: !Equals
  - !Ref TagVPCs
  - true
  AutoTagSubnets: !Equals
  - !Ref TagSubnets
  - true
  AutoTagEbsVolumes: !Equals
  - !Ref TagEbsVolumes
  - true
  AutoTagEIPs: !Equals
  - !Ref TagEIPs
  - true
  AutoTagEbsSnapshots: !Equals
  - !Ref TagEbsSnapshots
  - true
  AutoTagAMIs: !Equals
  - !Ref TagAMIs
  - true
  AutoTagFSX: !Equals
  - !Ref TagFSX
  - true
  AutoTagSecrets: !Equals
  - !Ref TagSecrets
  - true
  AutoTagBackupPlans: !Equals
  - !Ref TagBackupPlans
  - true
  AutoTagLoadbalancers: !Equals
  - !Ref TagLoadbalancers
  - true
  AutoTagEC2Instances: !Equals
  - !Ref TagEC2Instances
  - true
  AutoTagEKSClusters: !Equals
  - !Ref TagEksClusters
  - true
  AutoTagRDSClustersInstances: !Equals
  - !Ref TagRDSClusterInstances
  - true
  AutoTagEFS: !Equals
  - !Ref TagEFS
  - true

  CreateNetworkResources: !Or
  - !Condition DeployUserOffboardingWorkflowProject
  - !Condition SlackSocketModeEnabled

  CreateCaptureExistingResources: !Or
  - !Condition DeployCMDBProject
  - !Condition DeployIAMKeyPairAccessTrackerProject

  CreateAutoTaggerResources0: !Or
  - !Condition AutoTagVPCs
  - !Condition AutoTagSubnets
  - !Condition AutoTagEbsVolumes
  - !Condition AutoTagEIPs
  - !Condition AutoTagEbsSnapshots
  - !Condition AutoTagAMIs
  - !Condition AutoTagEC2Instances
  - !Condition AutoTagEKSClusters
  - !Condition AutoTagRDSClustersInstances
  - !Condition AutoTagEFS
  CreateAutoTaggerResources1: !Or
  - !Condition AutoTagFSX
  - !Condition AutoTagSecrets
  - !Condition AutoTagBackupPlans
  - !Condition AutoTagLoadbalancers

  CreateGetActiveEC2InstancesLambda: !Or
  - !Condition DeployCMDBProject
  - !Condition AutoTagEC2Instances
  CreateGetActiveEKSClustersLambda: !Or
  - !Condition DeployCMDBProject
  - !Condition AutoTagEKSClusters
  CreateGetActiveRDSClustersInstancesLambda: !Or
  - !Condition DeployCMDBProject
  - !Condition AutoTagRDSClustersInstances
  CreateGetActiveEFSLambda: !Or
  - !Condition DeployCMDBProject
  - !Condition AutoTagEFS
  CreateEC2TaggingResources: !Or
  - !Condition AutoTagVPCs
  - !Condition AutoTagSubnets
  - !Condition AutoTagEbsVolumes
  - !Condition AutoTagEIPs
  - !Condition AutoTagEbsSnapshots
  - !Condition AutoTagAMIs
  - !Condition AutoTagEC2Instances
  CreateAutoTaggerResources: !Or
  - !Condition CreateAutoTaggerResources0
  - !Condition CreateAutoTaggerResources1
  CreateCommonResource: !Or
  - !Condition DeployCMDBProject
  - !Condition CreateAutoTaggerResources
  - !Condition DeployIAMKeyPairAccessTrackerProject
  CreateGetDeploymentDetailsResources: !Or
  - !Condition DeployIPTrackerProject
  - !Condition CreateCommonResource
  CreateSSMDocumentResources: !And
  - !Condition DeploySSMAutomationProject
  - !Condition ApplyEC2InstancesConfigurations
  CreateS3Buckets: !Or
  - !Condition DeployUserOffboardingWorkflowProject
  - !Condition DeployIPTrackerProject
  - !Condition CreateSSMDocumentResources

Resources:
  S3Buckets:
    Condition: CreateS3Buckets
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/s3-buckets.yml
      Parameters:
        ProjectName: !Ref ProjectName
        AddSupportforUserOffboardingWorkflow: !Ref AddSupportforUserOffboardingWorkflow
        AddSupportforIPTracker: !Ref AddSupportforIPTracker

  Network:
    Condition: CreateNetworkResources
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/network.yml
      Parameters:
        ProjectName: !Ref ProjectName

  BatchJob:
    Condition: DeployUserOffboardingWorkflowProject
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/batch-job.yml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Network.Outputs.VpcId
        PrivateSubnets: !GetAtt Network.Outputs.PrivateSubnets
        ECRImageURI: !Ref UserOffboardingWorkflowECRImageURI
        SSOUserManagerArtifactsBucketName: !GetAtt S3Buckets.Outputs.SSOUserManagerArtifactsBucketName
        SSOUserManagerArtifactsBucketARN: !GetAtt S3Buckets.Outputs.SSOUserManagerArtifactsBucketARN
        UnusedResourcesDetectionBypassTagKey: !Ref UnusedResourcesDetectionBypassTagKey

  SlackSocketModeECS:
    Condition: SlackSocketModeEnabled
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/slack-socket-application.yml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Network.Outputs.VpcId
        PrivateSubnets: !GetAtt Network.Outputs.PrivateSubnets
        ECRImageURI: !Ref SlackSocketAppEcrImageURI
        SlackBotConfigSecretName: !Ref SlackBotConfigSecretName
        SlackActionsCrossAccountRole: !Ref SlackActionsCrossAccountRole
        DeploymentTargets: !Ref DeploymentTargets
        ExcludeAccounts: !Ref ExcludeAccounts
        ManagementAccountId: !Ref ManagementAccountId
        HomeRegion: !Ref HomeRegion

  LambdaFunctions:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/lambda-functions.yml
      Parameters:
        ProjectName: !Ref ProjectName
        OrganizationId: !Ref OrganizationId
        AwsOrgName: !Ref AwsOrgName
        CrossAccountRole: !Ref CrossAccountRole
        SlackActionsCrossAccountRole: !Ref SlackActionsCrossAccountRole
        DeploymentTargets: !Ref DeploymentTargets
        ExcludeAccounts: !Ref ExcludeAccounts
        ActiveRegions: !Ref ActiveRegions
        ManagementAccountId: !Ref ManagementAccountId
        LogArchiveAccountId: !Ref LogArchiveAccountId
        HomeRegion: !Ref HomeRegion
        ChildAccountsStackSetName: !Ref ChildAccountsStackSetName
        EnableGuardDuty: !Ref EnableGuardDuty
        SSOUsersSecretName: !Ref SSOUsersSecretName
        EventsProcessorLambdaEnvVarsSecretName: !Ref EventsProcessorLambdaEnvVarsSecretName
        SecurityGroupTableName: !Ref SecurityGroupTableName
        IAMUsersTableName: !Ref IAMUsersTableName
        S3BucketsTableName: !Ref S3BucketsTableName
        RootIAMLoginsTableName: !Ref RootIAMLoginsTableName
        UnusedEC2InstancesTableName: !If [IsEnabledStoppedEC2InstancesDetection, !Ref UnusedEC2InstancesTableName, ""]
        UnusedSecurityGroupsTableName: !If [IsEnabledUnusedSecurityGroupsDetection, !Ref UnusedSecurityGroupsTableName, ""]
        UnusedEBSVolumesTableName: !If [IsEnabledUnusedEBSVolumesDetection, !Ref UnusedEBSVolumesTableName, ""]
        RemediatedResourcesTableName: !Ref RemediatedResourcesTableName
        ActiveResourcesTableName: !If [DeployCMDBProject, !Ref ActiveResourcesTableName, ""]
        DeletedResourcesTableName: !If [DeployCMDBProject, !Ref DeletedResourcesTableName, ""]
        DailyUserCostReportsTableName: !If [DeployCMDBProject, !Ref DailyUserCostReportsTableName, ""]
        WeeklyUserCostReportsTableName: !If [DeployCMDBProject, !Ref WeeklyUserCostReportsTableName, ""]
        MonthlyUserCostReportsTableName: !If [DeployCMDBProject, !Ref MonthlyUserCostReportsTableName, ""]
        IPCorrelationTableName: !If [DeployIPTrackerProject, !Ref IPCorrelationTableName, ""]
        SSOUserIPHistoryTableName: !If [DeployIPTrackerProject, !Ref SSOUserIPHistoryTableName, ""]
        IAMKeyPairAccessTrackerTableName: !If [DeployIAMKeyPairAccessTrackerProject, !Ref IAMKeyPairAccessTrackerTableName, ""]
        SSMDocumentAssociationFailureTrackerTableName: !If [ TrackSSMAssociationFailures, !Ref SSMDocumentAssociationFailureTrackerTableName , ""]
        AddSupportforPostDeploySSMAutomation: !Ref AddSupportforPostDeploySSMAutomation
        AutoAttachIAMRoleEC2: !Ref AutoAttachIAMRoleEC2
        ExistingEC2SSMIAMRoleName: !Ref ExistingEC2SSMIAMRoleName
        AutoAttachMissingPolicies: !Ref AutoAttachMissingPolicies
        NamesOfAdditionalPoliciesToAutoAttach: !Ref NamesOfAdditionalPoliciesToAutoAttach
        VPCEndpointsList: !Ref VPCEndpointsList
        CreateNewManagedPolicy: !Ref CreateNewManagedPolicy
        ManagedPolicyName: !Ref ManagedPolicyName
        ManagedPolicyDocumentJson: !Ref ManagedPolicyDocumentJsonSSM
        AutoCreateVPCEndpoints: !Ref AutoCreateVPCEndpoints
        EnableEC2InstanceConfigurator: !Ref EnableEC2InstanceConfigurator
        TrackSSMDocumentAssociationFailures: !Ref TrackSSMDocumentAssociationFailures
        AddSupportforUserOffboardingWorkflow: !Ref AddSupportforUserOffboardingWorkflow
        BatchJobQueueARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt BatchJob.Outputs.BatchJobQueueARN, ""]
        BatchJobDefinitionARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt BatchJob.Outputs.BatchJobDefinitionARN, ""]
        SSOUserManagerArtifactsBucketName: !If [DeployUserOffboardingWorkflowProject, !GetAtt S3Buckets.Outputs.SSOUserManagerArtifactsBucketName, ""]
        SSOUserManagerArtifactsBucketARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt S3Buckets.Outputs.SSOUserManagerArtifactsBucketARN, ""]
        AddSupportforIAMKeyPairAccessTracker: !Ref AddSupportforIAMKeyPairAccessTracker
        AddSupportforCMDB: !Ref AddSupportforCMDB
        AddSupportforIPTracker: !Ref AddSupportforIPTracker
        TrackTailscaleIPs: !Ref TrackTailscaleIPs
        SSOUsersIpDataBucketName: !If [DeployIPTrackerProject, !GetAtt S3Buckets.Outputs.SSOUsersIpDataBucketName, ""]
        SSOUsersIpDataBucketARN: !If [DeployIPTrackerProject, !GetAtt S3Buckets.Outputs.SSOUsersIpDataBucketARN, ""]
        TagVPCs: !Ref TagVPCs
        TagsKeyValueVPCs: !Ref TagsKeyValueVPCs
        TagSubnets: !Ref TagSubnets
        TagsKeyValueSubnets: !Ref TagsKeyValueSubnets
        TagEbsVolumes: !Ref TagEbsVolumes
        TagsKeyValueEbsVolumes: !Ref TagsKeyValueEbsVolumes
        TagEIPs: !Ref TagEIPs
        TagsKeyValueEIPs: !Ref TagsKeyValueEIPs
        TagEbsSnapshots: !Ref TagEbsSnapshots
        TagsKeyValueEbsSnapshots: !Ref TagsKeyValueEbsSnapshots
        TagAMIs: !Ref TagAMIs
        TagsKeyValueAMIs: !Ref TagsKeyValueAMIs
        TagEC2Instances: !Ref TagEC2Instances
        TagsKeyValueEC2Instances: !Ref TagsKeyValueEC2Instances
        TagEksClusters: !Ref TagEksClusters
        TagsKeyValueEksClusters: !Ref TagsKeyValueEksClusters
        TagRDSClusterInstances: !Ref TagRDSClusterInstances
        TagsKeyValueRDSClusterInstances: !Ref TagsKeyValueRDSClusterInstances
        TagEFS: !Ref TagEFS
        TagsKeyValueEFS: !Ref TagsKeyValueEFS
        TagFSX: !Ref TagFSX
        TagsKeyValueFSX: !Ref TagsKeyValueFSX
        TagSecrets: !Ref TagSecrets
        TagsKeyValueSecrets: !Ref TagsKeyValueSecrets
        TagBackupPlans: !Ref TagBackupPlans
        TagsKeyValueBackupPlans: !Ref TagsKeyValueBackupPlans
        TagLoadbalancers: !Ref TagLoadbalancers
        TagsKeyValueLoadbalancers: !Ref TagsKeyValueLoadbalancers
        EngineerFacingNotificationsConfigsSecretName: !Ref EngineerFacingNotificationsConfigsSecretName
        SecurityAdminFacingNotificationsConfigsSecretName: !Ref SecurityAdminFacingNotificationsConfigsSecretName
        EnableSlackSocketMode: !Ref EnableSlackSocketMode
        SlackBotConfigSecretName: !Ref SlackBotConfigSecretName
        SenderEmailAddress: !Ref SenderEmailAddress
        ReceiverEmailAddressess: !Ref ReceiverEmailAddressess
        UnusedResourcesDetectionBypassTagKey: !Ref UnusedResourcesDetectionBypassTagKey
        DisableDetectionStoppedEC2Instances: !Ref DisableDetectionStoppedEC2Instances
        DisableDetectionUnusedSecurityGroups: !Ref DisableDetectionUnusedSecurityGroups
        DisableDetectionUnusedEBSVolumes: !Ref DisableDetectionUnusedEBSVolumes
        AddSupportforAzureCloud: !Ref AddSupportforAzureCloud
        AzureCustomerId: !Ref AzureCustomerId
        AzureSharedKeySSM: !Ref AzureSharedKeySSM
        AzureLogType: !Ref AzureLogType

  SlackInteractivityAPI:
    Condition: CreateSlackInteractivityAPI
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/api-gateway.yml
      Parameters:
        ProjectName: !Ref ProjectName
        CloudWatchAlarmsSnsTopicARN: !GetAtt LambdaFunctions.Outputs.CloudWatchAlarmsSnsTopicARN
        SlackApiDomainName: !Ref SlackApiDomainName
        SlackApiDomainCertificateArn: !Ref SlackApiDomainCertificateArn
        SlackInteractivityLambdaARN: !GetAtt LambdaFunctions.Outputs.SlackInteractivityLambdaARN
        SlackRequestVerifierLambdaARN: !GetAtt LambdaFunctions.Outputs.SlackRequestVerifierLambdaARN

  StepFunctions:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/step-functions.yml
      Parameters:
        ProjectName: !Ref ProjectName
        EventsProcessorLambdaARN: !GetAtt LambdaFunctions.Outputs.EventsProcessorLambdaARN
        GetSSOUserDetailsLambdaARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt LambdaFunctions.Outputs.GetSSOUserDetailsLambdaARN, ""]
        SSOUserReportGeneratorLambdaARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt LambdaFunctions.Outputs.SSOUserReportGeneratorLambdaARN, ""]
        SSOUserReportWaiterLambdaARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt LambdaFunctions.Outputs.SSOUserReportWaiterLambdaARN, ""]
        SSOUserReportsCompilerLambdaARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt LambdaFunctions.Outputs.SSOUserReportsCompilerLambdaARN, ""]
        StackSetCreationWaiterLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.StackSetCreationWaiterLambdaARN, ""]
        GetSSOUsersLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.GetSSOUsersLambdaARN, ""]
        GetChildDeploymentAccountsLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.GetChildDeploymentAccountsLambdaARN, ""]
        GetDeploymentRegionsLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.GetDeploymentRegionsLambdaARN, ""]
        ManipulateInputsAccountsLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.ManipulateInputsAccountsLambdaARN, ""]
        ManipulateInputsRegionsLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.ManipulateInputsRegionsLambdaARN, ""]
        GetSSOUsersLatestActivityLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.GetSSOUsersLatestActivityLambdaARN, ""]
        SSOUsersDataRefinerLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.SSOUsersDataRefinerLambdaARN, ""]
        SSOUsersDataStorerIpCorrelationLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.SSOUsersDataStorerIpCorrelationLambdaARN, ""]
        SSOUsersDataStorerIpHistoryLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.SSOUsersDataStorerIpHistoryLambdaARN, ""]
        SSMInstanceAutomationLambdaARN: !If [DeploySSMAutomationProject, !GetAtt LambdaFunctions.Outputs.SSMInstanceAutomationLambdaARN, ""]
        LambdaFunctionTriggererLambdaARN: !If [DeployIPTrackerProject, !GetAtt LambdaFunctions.Outputs.LambdaFunctionTriggererLambdaARN, ""]
        GetDeploymentTargetAccountsLambdaARN: !If [CreateGetDeploymentDetailsResources, !GetAtt LambdaFunctions.Outputs.GetDeploymentTargetAccountsLambdaARN, ""]
        GetActiveInstancesLambdaARN: !If [CreateGetActiveEC2InstancesLambda, !GetAtt LambdaFunctions.Outputs.GetActiveInstancesLambdaARN, ""]
        GetActiveInstancesDetailsLambdaARN: !If [DeployCMDBProject, !GetAtt LambdaFunctions.Outputs.GetActiveInstancesDetailsLambdaARN, ""]
        GetActiveEKSClustersLambdaARN: !If [CreateGetActiveEKSClustersLambda, !GetAtt LambdaFunctions.Outputs.GetActiveEKSClustersLambdaARN, ""]
        GetActiveEKSClustersDetailsLambdaARN: !If [DeployCMDBProject, !GetAtt LambdaFunctions.Outputs.GetActiveEKSClustersDetailsLambdaARN, ""]
        GetActiveRDSClustersLambdaARN: !If [CreateGetActiveRDSClustersInstancesLambda, !GetAtt LambdaFunctions.Outputs.GetActiveRDSClustersLambdaARN, ""]
        GetActiveRDSClustersDetailsLambdaARN: !If [DeployCMDBProject, !GetAtt LambdaFunctions.Outputs.GetActiveRDSClustersDetailsLambdaARN, ""]
        GetActiveRDSInstancesLambdaARN: !If [CreateGetActiveRDSClustersInstancesLambda, !GetAtt LambdaFunctions.Outputs.GetActiveRDSInstancesLambdaARN, ""]
        GetActiveRDSInstancesDetailsLambdaARN: !If [DeployCMDBProject, !GetAtt LambdaFunctions.Outputs.GetActiveRDSInstancesDetailsLambdaARN, ""]
        GetActiveEFSFileSystemsLambdaARN: !If [CreateGetActiveEFSLambda, !GetAtt LambdaFunctions.Outputs.GetActiveEFSFileSystemsLambdaARN, ""]
        GetActiveEFSFileSystemsDetailsLambdaARN: !If [DeployCMDBProject, !GetAtt LambdaFunctions.Outputs.GetActiveEFSFileSystemsDetailsLambdaARN, ""]
        GetAllIAMUsersActiveKeyPairsLambdaARN: !If [DeployIAMKeyPairAccessTrackerProject, !GetAtt LambdaFunctions.Outputs.GetAllIAMUsersActiveKeyPairsLambdaARN, ""]
        SendActiveResourcesEventsLambdaARN: !If [CreateCaptureExistingResources, !GetAtt LambdaFunctions.Outputs.SendActiveResourcesEventsLambdaARN, ""]
        TagEC2InstancesLambdaARN: !If [AutoTagEC2Instances, !GetAtt LambdaFunctions.Outputs.TagEC2InstancesLambdaARN, ""]
        TagEKSClustersLambdaARN: !If [AutoTagEKSClusters, !GetAtt LambdaFunctions.Outputs.TagEKSClustersLambdaARN, ""]
        TagRDSClustersInstancesLambdaARN: !If [AutoTagRDSClustersInstances, !GetAtt LambdaFunctions.Outputs.TagRDSClustersInstancesLambdaARN, ""]
        TagEFSLambdaARN: !If [AutoTagEFS, !GetAtt LambdaFunctions.Outputs.TagEFSLambdaARN, ""]
        GetVPCsLambdaARN: !If [AutoTagVPCs, !GetAtt LambdaFunctions.Outputs.GetVPCsLambdaARN, ""]
        GetSubnetsLambdaARN: !If [AutoTagSubnets, !GetAtt LambdaFunctions.Outputs.GetSubnetsLambdaARN, ""]
        GetEBSVolumesLambdaARN: !If [AutoTagEbsVolumes, !GetAtt LambdaFunctions.Outputs.GetEBSVolumesLambdaARN, ""]
        GetEIPsLambdaARN: !If [AutoTagEIPs, !GetAtt LambdaFunctions.Outputs.GetEIPsLambdaARN, ""]
        GetEbsSnapshotsLambdaARN: !If [AutoTagEbsSnapshots, !GetAtt LambdaFunctions.Outputs.GetEbsSnapshotsLambdaARN, ""]
        GetAMIsLambdaARN: !If [AutoTagAMIs, !GetAtt LambdaFunctions.Outputs.GetAMIsLambdaARN, ""]
        TagEC2ResourceLambdaARN: !If [CreateEC2TaggingResources, !GetAtt LambdaFunctions.Outputs.TagEC2ResourceLambdaARN, ""]
        GetFsxFileSystemsLambdaARN: !If [AutoTagFSX, !GetAtt LambdaFunctions.Outputs.GetFsxFileSystemsLambdaARN, ""]
        TagFsxLambdaARN: !If [AutoTagFSX, !GetAtt LambdaFunctions.Outputs.TagFsxLambdaARN, ""]
        GetSecretsLambdaARN: !If [AutoTagSecrets, !GetAtt LambdaFunctions.Outputs.GetSecretsLambdaARN, ""]
        TagSecretsLambdaARN: !If [AutoTagSecrets, !GetAtt LambdaFunctions.Outputs.TagSecretsLambdaARN, ""]
        GetBackupPlansLambdaARN: !If [AutoTagBackupPlans, !GetAtt LambdaFunctions.Outputs.GetBackupPlansLambdaARN, ""]
        TagBackupPlansLambdaARN: !If [AutoTagBackupPlans, !GetAtt LambdaFunctions.Outputs.TagBackupPlansLambdaARN, ""]
        GetLoadBalancersLambdaARN: !If [AutoTagLoadbalancers, !GetAtt LambdaFunctions.Outputs.GetLoadBalancersLambdaARN, ""]
        TagLoadbalancersLambdaARN: !If [AutoTagLoadbalancers, !GetAtt LambdaFunctions.Outputs.TagLoadbalancersLambdaARN, ""]
        AddSupportforPostDeploySSMAutomation: !Ref AddSupportforPostDeploySSMAutomation
        AddSupportforIAMKeyPairAccessTracker: !Ref AddSupportforIAMKeyPairAccessTracker
        AddSupportforCMDB: !Ref AddSupportforCMDB
        AddSupportforUserOffboardingWorkflow: !Ref AddSupportforUserOffboardingWorkflow
        AddSupportforIPTracker: !Ref AddSupportforIPTracker
        SSOUsersIpDataBucketARN: !If [DeployIPTrackerProject, !GetAtt S3Buckets.Outputs.SSOUsersIpDataBucketARN, ""]
        TagVPCs: !Ref TagVPCs
        TagSubnets: !Ref TagSubnets
        TagEbsVolumes: !Ref TagEbsVolumes
        TagEIPs: !Ref TagEIPs
        TagEbsSnapshots: !Ref TagEbsSnapshots
        TagAMIs: !Ref TagAMIs
        TagEC2Instances: !Ref TagEC2Instances
        TagEksClusters: !Ref TagEksClusters
        TagRDSClusterInstances: !Ref TagRDSClusterInstances
        TagEFS: !Ref TagEFS
        TagFSX: !Ref TagFSX
        TagSecrets: !Ref TagSecrets
        TagBackupPlans: !Ref TagBackupPlans
        TagLoadbalancers: !Ref TagLoadbalancers

  EventRules:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested-stacks/event-rules.yml
      Parameters:
        ProjectName: !Ref ProjectName
        OrganizationId: !Ref OrganizationId
        IsControlTowerEnabled: !Ref IsControlTowerEnabled
        IsOrganizationTrail: !Ref IsOrganizationTrail
        CentralizedLogsS3BucketName: !Ref CentralizedLogsS3BucketName
        EnableGuardDuty: !Ref EnableGuardDuty
        GuardDutySeverityLevels: !Join [',', !Ref GuardDutySeverityLevels]
        EventsProcessorLambdaARN: !GetAtt LambdaFunctions.Outputs.EventsProcessorLambdaARN
        ResourceTrackerReportsLambdaARN: !GetAtt LambdaFunctions.Outputs.ResourceTrackerReportsLambdaARN
        UnusedResourcesDetectorLambdaARN: !If [IsEnabledUnusedResourcesDetection, !GetAtt LambdaFunctions.Outputs.UnusedResourcesDetectorLambdaARN, ""]
        CreateEventBusRuleGuardDutyFindingsLambdaARN: !If [IsGuardDutyEnabled, !GetAtt LambdaFunctions.Outputs.CreateEventBusRuleGuardDutyFindingsLambdaARN, ""]
        SSOUserReportGeneratorSfnARN: !If [DeployUserOffboardingWorkflowProject, !GetAtt StepFunctions.Outputs.SSOUserReportGeneratorSfnARN, ""]
        SSMInstanceAutomationSfnARN: !If [DeploySSMAutomationProject, !GetAtt StepFunctions.Outputs.SSMInstanceAutomationSfnARN, ""]
        AddSupportforPostDeploySSMAutomation: !Ref AddSupportforPostDeploySSMAutomation
        TrackSSMDocumentAssociationFailures: !Ref TrackSSMDocumentAssociationFailures
        AddSupportforUserOffboardingWorkflow: !Ref AddSupportforUserOffboardingWorkflow
        AddSupportforIAMKeyPairAccessTracker: !Ref AddSupportforIAMKeyPairAccessTracker
        AddSupportforCMDB: !Ref AddSupportforCMDB
        AddSupportforIPTracker: !Ref AddSupportforIPTracker
        EnableVpcFlowLogs: !Ref EnableVpcFlowLogs
        FlowLogsDeliveryBucketPrefix: !Ref FlowLogsDeliveryBucketPrefix

Outputs:
  EventBusName:
    Description: Name of main EventBus
    Value: !GetAtt EventRules.Outputs.EventBusName
  StepFunctionExecutorLambdaARN:
    Condition: CreateCommonResource
    Description: ARN of StepFunction Executor Lambda Function
    Value: !GetAtt LambdaFunctions.Outputs.StepFunctionExecutorLambdaARN
  CaptureExistingResourcesSfnARN:
    Condition: CreateCaptureExistingResources
    Description: ARN of Capture Existing Active Resources Step Function
    Value: !GetAtt StepFunctions.Outputs.CaptureExistingResourcesSfnARN
  AutoTaggerSfnARN:
    Condition: CreateAutoTaggerResources
    Description: ARN of Auto-Tagger Step Function
    Value: !GetAtt StepFunctions.Outputs.AutoTaggerSfnARN
  SlackInteractivityURL:
    Condition: CreateSlackInteractivityAPI
    Description: Slack Interactivity URL to configure in Slack settings
    Value: !GetAtt SlackInteractivityAPI.Outputs.InteractivityUrl