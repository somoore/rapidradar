name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go (RapidRadar core)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Go module checksums
        run: go mod verify

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet ./...

  python:
    name: Python checks (RapidRadar lambdas)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Compile deployment Python
        run: python -m compileall -q core/cf/deployment

      - name: Verify hash-locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --dry-run -r core/cf/deployment/requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes --dry-run -r core/cf/deployment/slack_socket_app/requirements.lock
          python -m pip install --disable-pip-version-check --require-hashes --dry-run -r core/cf/deployment/sfn/sso_manager/build/requirements.lock

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Enforce supply-chain policy
        run: python scripts/check_supply_chain_policy.py

      - name: Audit locked Python dependencies
        run: python scripts/audit_python_osv.py

      - name: Scan for committed secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --no-git --redact --exit-code 1

      - name: Build digest-pinned Docker images
        run: |
          docker build --platform=linux/amd64 -t rapidradar-sso-manager:ci core/cf/deployment/sfn/sso_manager/build
          docker build --platform=linux/amd64 -t rapidradar-slack-socket-app:ci core/cf/deployment/slack_socket_app
